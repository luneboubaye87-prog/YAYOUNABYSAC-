<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-main {
      width: 100%;
      margin-top: 18px;
      background: #111;
      color: white;
    }

    .btn-refresh {
      background: #111;
      color: white;
      margin-bottom: 15px;
    }

    .btn-confirm {
      background: #166534;
      color: white;
    }

    #message {
      display: none;
      padding: 14px;
      margin-bottom: 20px;
      border-radius: 8px;
      white-space: pre-line;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 12px;
    }

    .product img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 16px;
      margin-top: 15px;
    }

    .order h3 {
      margin-top: 0;
    }

    .order-product {
      background: #f5f5f5;
      padding: 9px;
      border-radius: 7px;
      margin-top: 6px;
    }

    .statut {
      margin-top: 5px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .stat strong {
      display: block;
      font-size: 23px;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👜 YAYOUNABYSAC</h1>
  <p>Administration</p>
</header>

<div class="container">

  <div id="message"></div>


  <!-- ============================= -->
  <!-- STATISTIQUES -->
  <!-- ============================= -->

  <div class="stats">

    <div class="stat">
      Commandes
      <strong id="nombreCommandes">0</strong>
    </div>

    <div class="stat">
      Total commandes
      <strong id="totalCommandes">0 FCFA</strong>
    </div>

  </div>


  <!-- ============================= -->
  <!-- PRODUITS -->
  <!-- ============================= -->

  <div class="box">

    <h2>➕ Ajouter un produit</h2>

    <label>Nom du produit</label>

    <input
      type="text"
      id="nom"
      placeholder="Exemple : Sac bandoulière"
    >


    <label>Description</label>

    <textarea
      id="description"
      placeholder="Description du produit"
    ></textarea>


    <label>Prix en FCFA</label>

    <input
      type="number"
      id="prix"
      placeholder="18000"
    >


    <label>Stock</label>

    <input
      type="number"
      id="stock"
      placeholder="5"
    >


    <label>Catégorie</label>

    <input
      type="text"
      id="categorie"
      placeholder="Sacs à main"
    >


    <label>URL de l'image</label>

    <input
      type="text"
      id="image"
      placeholder="https://..."
    >


    <button
      type="button"
      class="btn-main"
      onclick="ajouterProduit()"
    >
      ➕ Ajouter le produit
    </button>

  </div>


  <!-- ============================= -->
  <!-- LISTE PRODUITS -->
  <!-- ============================= -->

  <div class="box">

    <h2>🛍️ Produits existants</h2>

    <button
      type="button"
      class="btn-refresh"
      onclick="chargerProduits()"
    >
      🔄 Actualiser les produits
    </button>

    <div id="listeProduits">
      Chargement...
    </div>

  </div>


  <!-- ============================= -->
  <!-- COMMANDES -->
  <!-- ============================= -->

  <div class="box">

    <h2>📦 Commandes</h2>

    <button
      type="button"
      class="btn-refresh"
      onclick="chargerCommandes()"
    >
      🔄 Actualiser les commandes
    </button>

    <div id="listeCommandes">
      Chargement des commandes...
    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   MESSAGE
========================================= */

function afficherMessage(
  texte,
  type
) {

  const message =
    document.getElementById("message");

  message.textContent = texte;

  message.className = type;

}


/* =========================================
   AJOUTER PRODUIT
========================================= */

async function ajouterProduit() {

  const nom =
    document
      .getElementById("nom")
      .value
      .trim();

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const prix =
    Number(
      document
        .getElementById("prix")
        .value
    );

  const stock =
    Number(
      document
        .getElementById("stock")
        .value
    );

  const categorie =
    document
      .getElementById("categorie")
      .value
      .trim();

  const image =
    document
      .getElementById("image")
      .value
      .trim();


  if (!nom) {

    afficherMessage(
      "Veuillez entrer le nom du produit.",
      "error"
    );

    return;
  }


  if (!prix || prix < 0) {

    afficherMessage(
      "Veuillez entrer un prix valide.",
      "error"
    );

    return;
  }


  if (stock < 0 || isNaN(stock)) {

    afficherMessage(
      "Veuillez entrer un stock valide.",
      "error"
    );

    return;
  }


  afficherMessage(
    "Enregistrement du produit...",
    "success"
  );


  const { data, error } =
    await supabaseClient
      .from("Products")
      .insert([
        {
          name: nom,
          description: description,
          Price: prix,
          Stock: stock,
          Category: categorie,
          Image_url: image || null
        }
      ])
      .select();


  if (error) {

    console.error(
      "Erreur Supabase :",
      error
    );

    afficherMessage(
      "ERREUR SUPABASE :\n\n" +
      error.message +
      "\n\nCode : " +
      (error.code || "inconnu"),
      "error"
    );

    return;
  }


  afficherMessage(
    "✅ Produit ajouté avec succès !",
    "success"
  );


  document.getElementById("nom").value = "";

  document.getElementById("description").value = "";

  document.getElementById("prix").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("categorie").value = "";

  document.getElementById("image").value = "";


  chargerProduits();

}


/* =========================================
   CHARGER PRODUITS
========================================= */

async function chargerProduits() {

  const liste =
    document.getElementById(
      "listeProduits"
    );

  liste.innerHTML =
    "Chargement des produits...";


  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    liste.innerHTML =
      "<p>Erreur : " +
      error.message +
      "</p>";

    return;
  }


  if (!data || data.length === 0) {

    liste.innerHTML =
      "<p>Aucun produit.</p>";

    return;
  }


  liste.innerHTML = "";


  data.forEach(function(produit) {

    const bloc =
      document.createElement("div");

    bloc.className =
      "product";


    let imageHTML = "";

    if (produit.Image_url) {

      imageHTML =
        '<img src="' +
        produit.Image_url +
        '" alt="Produit">';

    }


    bloc.innerHTML =

      imageHTML +

      "<strong>" +
      (produit.name || "") +
      "</strong>" +

      "<p>" +
      (produit.description || "") +
      "</p>" +

      "<p>Prix : " +
      Number(
        produit.Price || 0
      ).toLocaleString("fr-FR") +
      " FCFA</p>" +

      "<p>Stock : " +
      (produit.Stock ?? 0) +
      "</p>" +

      "<p>Catégorie : " +
      (produit.Category || "") +
      "</p>";


    liste.appendChild(bloc);

  });

}


/* =========================================
   CHARGER COMMANDES
========================================= */

async function chargerCommandes() {

  const liste =
    document.getElementById(
      "listeCommandes"
    );

  liste.innerHTML =
    "Chargement des commandes...";


  const { data: commandes, error } =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (error) {

    liste.innerHTML =
      "<p>ERREUR SUPABASE : " +
      error.message +
      "</p>";

    return;
  }


  const commandesListe =
    commandes || [];


  document.getElementById(
    "nombreCommandes"
  ).textContent =
    commandesListe.length;


  let totalGeneral = 0;


  commandesListe.forEach(
    function(commande) {

      totalGeneral +=
        Number(
          commande.total || 0
        );

    }
  );


  document.getElementById(
    "totalCommandes"
  ).textContent =
    totalGeneral.toLocaleString(
      "fr-FR"
    ) +
    " FCFA";


  if (commandesListe.length === 0) {

    liste.innerHTML =
      "<p>Aucune commande pour le moment.</p>";

    return;
  }


  liste.innerHTML = "";


  commandesListe.forEach(
    function(commande) {

      afficherCommande(
        commande,
        liste
      );

    }
  );

}


/* =========================================
   AFFICHER UNE COMMANDE
========================================= */

async function afficherCommande(
  commande,
  liste
) {

  const bloc =
    document.createElement("div");

  bloc.className =
    "order";


  const date =
    commande.created_at
    ? new Date(
        commande.created_at
      ).toLocaleString("fr-FR")
    : "";


  bloc.innerHTML =

    "<h3>📦 Commande #" +
    commande.id +
    "</h3>" +

    "<p><strong>Client :</strong> " +
    (commande.customer_nam || "") +
    "</p>" +

    "<p><strong>📞 Téléphone :</strong> " +
    (commande.phone || "") +
    "</p>" +

    "<p><strong>📍 Adresse :</strong> " +
    (commande.address || "") +
    "</p>" +

    "<p><strong>💰 Total :</strong> " +
    Number(
      commande.total || 0
    ).toLocaleString("fr-FR") +
    " FCFA</p>" +

    "<p><strong>📅 Date :</strong> " +
    date +
    "</p>" +

    "<label><strong>📌 Statut</strong></label>";


  /* =====================================
     STATUT
  ===================================== */

  const select =
    document.createElement("select");

  select.className =
    "statut";


  const statuts = [
    "Nouvelle",
    "Confirmée",
    "Expédiée",
    "Livrée",
    "Annulée"
  ];


  statuts.forEach(
    function(statut) {

      const option =
        document.createElement("option");

      option.value =
        statut;

      option.textContent =
        statut;


      if (
        commande.status === statut
      ) {

        option.selected = true;

      }


      select.appendChild(
        option
      );

    }
  );


  select.addEventListener(
    "change",
    async function() {

      const nouveauStatut =
        this.value;


      const { error } =
        await supabaseClient
          .from("Orders")
          .update({
            status: nouveauStatut
          })
          .eq(
            "id",
            commande.id
          );


      if (error) {

        alert(
          "Erreur lors du changement de statut :\n\n" +
          error.message
        );

        return;
      }


      commande.status =
        nouveauStatut;


      afficherMessage(
        "✅ Statut de la commande #" +
        commande.id +
        " modifié en « " +
        nouveauStatut +
        " ».",
        "success"
      );

    }
  );


  bloc.appendChild(
    select
  );


  /* =====================================
     PRODUITS DE LA COMMANDE
  ===================================== */

  const zoneProduits =
    document.createElement("div");

  zoneProduits.style.marginTop =
    "15px";

  zoneProduits.innerHTML =
    "<strong>🛍️ Produits commandés :</strong><br>" +
    "Chargement...";


  bloc.appendChild(
    zoneProduits
  );


  liste.appendChild(
    bloc
  );


  chargerProduitsCommande(
    commande.id,
    zoneProduits
  );

}


/* =========================================
   PRODUITS D'UNE COMMANDE
========================================= */

async function chargerProduitsCommande(
  orderId,
  zone
) {

  const { data: lignes, error } =
    await supabaseClient
      .from("Orders_items")
      .select("*")
      .eq(
        "order_id",
        orderId
      );


  if (error) {

    zone.innerHTML =
      "<strong>Produits commandés :</strong><br>" +
      "Erreur : " +
      error.message;

    return;
  }


  if (!lignes || lignes.length === 0) {

    zone.innerHTML =
      "<strong>Produits commandés :</strong><br>" +
      "Aucun produit.";

    return;
  }


  zone.innerHTML =
    "<strong>🛍️ Produits commandés :</strong>";


  for (
    const ligne of lignes
  ) {

    const { data: produit } =
      await supabaseClient
        .from("Products")
        .select("name")
        .eq(
          "id",
          ligne.product_id
        )
        .maybeSingle();


    const nom =
      produit
      ? produit.name
      : "Produit #" +
        ligne.product_id;


    const prix =
      Number(
        ligne.price || 0
      );


    const quantite =
      Number(
        ligne.quantity || 0
      );


    const sousTotal =
      prix * quantite;


    const ligneDiv =
      document.createElement("div");

    ligneDiv.className =
      "order-product";


    ligneDiv.textContent =
      nom +
      " × " +
      quantite +
      " = " +
      sousTotal.toLocaleString(
        "fr-FR"
      ) +
      " FCFA";


    zone.appendChild(
      ligneDiv
    );

  }

}


/* =========================================
   LANCEMENT
========================================= */

chargerProduits();

chargerCommandes();

</script>

</body>
</html>
