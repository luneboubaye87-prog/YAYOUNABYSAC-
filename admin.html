<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #e53935;
      color: white;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 20px 14px 50px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      margin-bottom: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    .primary {
      background: #111;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #e53935;
      color: white;
    }

    .success {
      background: #168a45;
      color: white;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 15px;
      overflow: hidden;
      background: white;
    }

    .product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-content {
      padding: 15px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      margin: 8px 0;
    }

    .product-info {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .actions button {
      flex: 1;
    }

    .preview {
      display: none;
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

    .message {
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: none;
    }

    .message.success-message {
      background: #e8f7ee;
      color: #13743a;
    }

    .message.error-message {
      background: #fdecec;
      color: #b42318;
    }

    .order-card {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .order-card strong {
      display: inline-block;
      margin-bottom: 5px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .editing-title {
      background: #fff5d6;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      header {
        padding: 15px 12px;
      }

      header h1 {
        font-size: 17px;
      }

      main {
        padding: 15px 10px 40px;
      }

      .box {
        padding: 16px;
      }

      .product-image {
        height: 200px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👜 YAYOUNABYSAC</h1>
  <button class="logout" onclick="deconnexion()">Se déconnecter</button>
</header>

<main>

  <!-- CONNEXION -->
  <section id="connexionBox" class="box">
    <h2>🔐 Connexion administrateur</h2>

    <div id="loginMessage" class="message"></div>

    <label>Email</label>
    <input type="email" id="email" placeholder="Votre email">

    <label>Mot de passe</label>
    <input type="password" id="password" placeholder="Votre mot de passe">

    <button class="primary" onclick="connexionAdmin()">
      Se connecter
    </button>

    <br><br>

    <button class="secondary" onclick="afficherRecuperation()">
      Mot de passe oublié
    </button>
  </section>


  <!-- RECUPERATION -->
  <section id="recoveryBox" class="box hidden">

    <h2>🔑 Réinitialiser le mot de passe</h2>

    <div id="recoveryMessage" class="message"></div>

    <label>Email</label>
    <input type="email" id="recoveryEmail" placeholder="Votre email">

    <button class="primary" onclick="envoyerRecuperation()">
      Envoyer le lien
    </button>

    <br><br>

    <button class="secondary" onclick="retourConnexion()">
      Retour connexion
    </button>

  </section>


  <!-- NOUVEAU MOT DE PASSE -->
  <section id="newPasswordBox" class="box hidden">

    <h2>🔐 Nouveau mot de passe</h2>

    <div id="newPasswordMessage" class="message"></div>

    <label>Nouveau mot de passe</label>
    <input type="password" id="newPassword">

    <label>Confirmer le mot de passe</label>
    <input type="password" id="confirmPassword">

    <button class="primary" onclick="changerMotDePasse()">
      Enregistrer le nouveau mot de passe
    </button>

  </section>


  <!-- ADMIN -->
  <section id="adminBox" class="hidden">

    <!-- AJOUT / MODIFICATION -->
    <div class="box">

      <h2 id="formTitle">➕ Ajouter un produit</h2>

      <div id="formMessage" class="message"></div>

      <div id="editingNotice" class="editing-title hidden">
        ✏️ Vous êtes en train de modifier un produit.
      </div>

      <label>Nom du produit</label>
      <input
        type="text"
        id="productName"
        placeholder="Exemple : Sac à main"
      >

      <label>Description</label>
      <textarea
        id="productDescription"
        placeholder="Description du produit"
      ></textarea>

      <label>Prix en FCFA</label>
      <input
        type="number"
        id="productPrice"
        placeholder="18000"
        min="0"
      >

      <label>Stock</label>
      <input
        type="number"
        id="productStock"
        placeholder="4"
        min="0"
      >

      <label>Catégorie</label>
      <input
        type="text"
        id="productCategory"
        placeholder="Sacs à main"
      >

      <label>Photo du produit</label>
      <input
        type="file"
        id="productImage"
        accept="image/*"
        onchange="previewImage()"
      >

      <img id="imagePreview" class="preview">

      <button
        id="saveProductButton"
        class="primary"
        onclick="sauvegarderProduit()"
      >
        Ajouter le produit
      </button>

      <br><br>

      <button
        id="cancelEditButton"
        class="secondary hidden"
        onclick="annulerModification()"
      >
        Annuler la modification
      </button>

    </div>


    <!-- PRODUITS -->
    <div class="box">

      <h2>📦 Mes produits</h2>

      <div id="productsMessage" class="message"></div>

      <div id="productsList" class="products-grid">
        <div class="empty">
          Chargement des produits...
        </div>
      </div>

    </div>


    <!-- COMMANDES -->
    <div class="box">

      <h2>🛒 Commandes</h2>

      <button class="secondary" onclick="chargerCommandes()">
        🔄 Actualiser
      </button>

      <br><br>

      <div id="ordersList">
        <div class="empty">
          Chargement des commandes...
        </div>
      </div>

    </div>

  </section>

</main>


<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     VARIABLES
  ============================== */

  let produitEnModification = null;


  /* ==============================
     ELEMENTS
  ============================== */

  const connexionBox =
    document.getElementById("connexionBox");

  const recoveryBox =
    document.getElementById("recoveryBox");

  const newPasswordBox =
    document.getElementById("newPasswordBox");

  const adminBox =
    document.getElementById("adminBox");


  /* ==============================
     MESSAGE
  ============================== */

  function afficherMessage(elementId, message, type) {

    const element =
      document.getElementById(elementId);

    element.textContent = message;

    element.className =
      "message " +
      (type === "success"
        ? "success-message"
        : "error-message");

    element.style.display = "block";
  }


  function cacherMessage(elementId) {

    const element =
      document.getElementById(elementId);

    element.style.display = "none";
  }


  /* ==============================
     CONNEXION
  ============================== */

  async function connexionAdmin() {

    cacherMessage("loginMessage");

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      afficherMessage(
        "loginMessage",
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      afficherMessage(
        "loginMessage",
        "Erreur : " + error.message,
        "error"
      );

      return;
    }

    afficherAdmin();

  }


  /* ==============================
     AFFICHER ADMIN
  ============================== */

  function afficherAdmin() {

    connexionBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");
    adminBox.classList.remove("hidden");

    chargerProduits();
    chargerCommandes();

  }


  /* ==============================
     DECONNEXION
  ============================== */

  async function deconnexion() {

    await supabaseClient.auth.signOut();

    adminBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");

    connexionBox.classList.remove("hidden");

  }


  /* ==============================
     RECUPERATION
  ============================== */

  function afficherRecuperation() {

    connexionBox.classList.add("hidden");
    recoveryBox.classList.remove("hidden");

  }


  function retourConnexion() {

    recoveryBox.classList.add("hidden");
    connexionBox.classList.remove("hidden");

  }


  async function envoyerRecuperation() {

    cacherMessage("recoveryMessage");

    const email =
      document.getElementById("recoveryEmail")
      .value.trim();

    if (!email) {

      afficherMessage(
        "recoveryMessage",
        "Veuillez entrer votre email.",
        "error"
      );

      return;
    }

    const redirectUrl =
      window.location.origin +
      window.location.pathname;

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );

    if (error) {

      afficherMessage(
        "recoveryMessage",
        "Erreur : " + error.message,
        "error"
      );

      return;
    }

    afficherMessage(
      "recoveryMessage",
      "Le lien de récupération a été envoyé.",
      "success"
    );

  }


  /* ==============================
     NOUVEAU MOT DE PASSE
  ============================== */

  async function changerMotDePasse() {

    cacherMessage("newPasswordMessage");

    const password =
      document.getElementById("newPassword").value;

    const confirm =
      document.getElementById("confirmPassword").value;

    if (!password || !confirm) {

      afficherMessage(
        "newPasswordMessage",
        "Veuillez remplir les deux champs.",
        "error"
      );

      return;
    }

    if (password !== confirm) {

      afficherMessage(
        "newPasswordMessage",
        "Les deux mots de passe ne correspondent pas.",
        "error"
      );

      return;
    }

    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if (error) {

      afficherMessage(
        "newPasswordMessage",
        "Erreur : " + error.message,
        "error"
      );

      return;
    }

    afficherMessage(
      "newPasswordMessage",
      "Mot de passe modifié avec succès.",
      "success"
    );

    setTimeout(() => {

      newPasswordBox.classList.add("hidden");
      connexionBox.classList.remove("hidden");

    }, 1500);

  }


  /* ==============================
     PREVISUALISATION PHOTO
  ============================== */

  function previewImage() {

    const file =
      document.getElementById("productImage").files[0];

    const preview =
      document.getElementById("imagePreview");

    if (!file) {

      preview.style.display = "none";
      preview.src = "";

      return;
    }

    const reader =
      new FileReader();

    reader.onload = function(e) {

      preview.src = e.target.result;
      preview.style.display = "block";

    };

    reader.readAsDataURL(file);

  }


  /* ==============================
     CHARGER PRODUITS
  ============================== */

  async function chargerProduits() {

    const list =
      document.getElementById("productsList");

    list.innerHTML =
      '<div class="empty">Chargement des produits...</div>';

    const { data, error } =
      await supabaseClient
        .from("Products")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {

      list.innerHTML =
        '<div class="empty">Erreur : ' +
        error.message +
        '</div>';

      return;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">Aucun produit pour le moment.</div>';

      return;
    }

    list.innerHTML = "";

    data.forEach(produit => {

      const card =
        document.createElement("div");

      card.className = "product-card";

      const image =
        produit.Image_url ||
        "https://via.placeholder.com/500x400?text=YAYOUNABYSAC";

      card.innerHTML = `

        <img
          class="product-image"
          src="${image}"
          alt="${escapeHtml(produit.name || "Produit")}"
          onerror="this.src='https://via.placeholder.com/500x400?text=YAYOUNABYSAC'"
        >

        <div class="product-content">

          <div class="product-name">
            ${escapeHtml(produit.name || "")}
          </div>

          <div class="product-price">
            ${Number(produit.Price || 0).toLocaleString("fr-FR")} FCFA
          </div>

          <div class="product-info">

            📦 Stock :
            <strong>${produit.Stock ?? 0}</strong>

            <br>

            🏷️ Catégorie :
            <strong>${escapeHtml(produit.Category || "")}</strong>

            <br><br>

            ${escapeHtml(produit.description || "")}

          </div>

          <div class="actions">

            <button
              class="success"
              onclick="modifierProduit(${produit.id})"
            >
              ✏️ Modifier
            </button>

            <button
              class="danger"
              onclick="supprimerProduit(${produit.id})"
            >
              🗑️ Supprimer
            </button>

          </div>

        </div>
      `;

      list.appendChild(card);

    });

  }


  /* ==============================
     ECHAPPEMENT HTML
  ============================== */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==============================
     MODIFIER PRODUIT
  ============================== */

  async function modifierProduit(id) {

    cacherMessage("formMessage");

    const { data, error } =
      await supabaseClient
        .from("Products")
        .select("*")
        .eq("id", id)
        .single();

    if (error) {

      afficherMessage(
        "formMessage",
        "Impossible de charger le produit : " +
        error.message,
        "error"
      );

      return;
    }

    produitEnModification = data;

    document.getElementById("productName").value =
      data.name || "";

    document.getElementById("productDescription").value =
      data.description || "";

    document.getElementById("productPrice").value =
      data.Price || "";

    document.getElementById("productStock").value =
      data.Stock ?? "";

    document.getElementById("productCategory").value =
      data.Category || "";

    const preview =
      document.getElementById("imagePreview");

    if (data.Image_url) {

      preview.src = data.Image_url;
      preview.style.display = "block";

    } else {

      preview.src = "";
      preview.style.display = "none";

    }

    document.getElementById("formTitle").textContent =
      "✏️ Modifier le produit";

    document.getElementById("saveProductButton").textContent =
      "Enregistrer les modifications";

    document.getElementById("cancelEditButton")
      .classList.remove("hidden");

    document.getElementById("editingNotice")
      .classList.remove("hidden");

    document.getElementById("productName")
      .scrollIntoView({
        behavior: "smooth",
        block: "center"
      });

  }


  /* ==============================
     ANNULER MODIFICATION
  ============================== */

  function annulerModification() {

    produitEnModification = null;

    document.getElementById("productName").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productStock").value = "";
    document.getElementById("productCategory").value = "";
    document.getElementById("productImage").value = "";

    document.getElementById("imagePreview").src = "";
    document.getElementById("imagePreview").style.display = "none";

    document.getElementById("formTitle").textContent =
      "➕ Ajouter un produit";

    document.getElementById("saveProductButton").textContent =
      "Ajouter le produit";

    document.getElementById("cancelEditButton")
      .classList.add("hidden");

    document.getElementById("editingNotice")
      .classList.add("hidden");

  }


  /* ==============================
     SAUVEGARDER PRODUIT
  ============================== */

  async function sauvegarderProduit() {

    cacherMessage("formMessage");

    const name =
      document.getElementById("productName")
      .value.trim();

    const description =
      document.getElementById("productDescription")
      .value.trim();

    const price =
      Number(
        document.getElementById("productPrice").value
      );

    const stock =
      Number(
        document.getElementById("productStock").value
      );

    const category =
      document.getElementById("productCategory")
      .value.trim();

    const file =
      document.getElementById("productImage").files[0];


    if (!name || !category) {

      afficherMessage(
        "formMessage",
        "Veuillez au minimum remplir le nom et la catégorie.",
        "error"
      );

      return;
    }

    if (price < 0 || stock < 0) {

      afficherMessage(
        "formMessage",
        "Le prix et le stock doivent être positifs.",
        "error"
      );

      return;
    }


    /* ==============================
       MODIFICATION
    ============================== */

    if (produitEnModification) {

      let imageUrl =
        produitEnModification.Image_url || null;


      /* NOUVELLE PHOTO */

      if (file) {

        const extension =
          file.name.split(".").pop().toLowerCase();

        const filePath =
          "produit-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2) +
          "." +
          extension;


        const { error: uploadError } =
          await supabaseClient
            .storage
            .from("product-images")
            .upload(
              filePath,
              file,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (uploadError) {

          afficherMessage(
            "formMessage",
            "Erreur lors de l'envoi de la nouvelle photo : " +
            uploadError.message,
            "error"
          );

          return;
        }


        const { data: publicData } =
          supabaseClient
            .storage
            .from("product-images")
            .getPublicUrl(filePath);

        imageUrl =
          publicData.publicUrl;


        /* SUPPRIMER ANCIENNE PHOTO */

        if (produitEnModification.Image_url) {

          await supprimerAncienneImage(
            produitEnModification.Image_url
          );

        }

      }


      const { error } =
        await supabaseClient
          .from("Products")
          .update({
            name: name,
            description: description,
            Price: price,
            Image_url: imageUrl,
            Stock: stock,
            Category: category
          })
          .eq(
            "id",
            produitEnModification.id
          );


      if (error) {

        afficherMessage(
          "formMessage",
          "Erreur lors de la modification : " +
          error.message,
          "error"
        );

        return;
      }


      afficherMessage(
        "formMessage",
        "Produit modifié avec succès ✅",
        "success"
      );

      annulerModification();
      chargerProduits();

      return;

    }


    /* ==============================
       NOUVEAU PRODUIT
    ============================== */

    let imageUrl = null;


    if (file) {

      const extension =
        file.name.split(".").pop().toLowerCase();

      const filePath =
        "produit-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2) +
        "." +
        extension;


      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (uploadError) {

        afficherMessage(
          "formMessage",
          "Erreur lors de l'envoi de la photo : " +
          uploadError.message,
          "error"
        );

        return;
      }


      const { data: publicData } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(filePath);

      imageUrl =
        publicData.publicUrl;

    }


    const { error } =
      await supabaseClient
        .from("Products")
        .insert({
          name: name,
          description: description,
          Price: price,
          Image_url: imageUrl,
          Stock: stock,
          Category: category
        });


    if (error) {

      afficherMessage(
        "formMessage",
        "Erreur lors de l'ajout : " +
        error.message,
        "error"
      );

      return;
    }


    afficherMessage(
      "formMessage",
      "Produit ajouté avec succès ✅",
      "success"
    );

    annulerModification();
    chargerProduits();

  }


  /* ==============================
     SUPPRIMER PRODUIT
  ============================== */

  async function supprimerProduit(id) {

    const confirmation =
      confirm(
        "Voulez-vous vraiment supprimer ce produit ?\n\nCette action est définitive."
      );

    if (!confirmation) {
      return;
    }


    const { data: produit, error: getError } =
      await supabaseClient
        .from("Products")
        .select("*")
        .eq("id", id)
        .single();


    if (getError) {

      alert(
        "Impossible de récupérer le produit : " +
        getError.message
      );

      return;
    }


    const { error } =
      await supabaseClient
        .from("Products")
        .delete()
        .eq("id", id);


    if (error) {

      alert(
        "Erreur lors de la suppression : " +
        error.message
      );

      return;
    }


    /* SUPPRIMER L'IMAGE */

    if (produit.Image_url) {

      await supprimerAncienneImage(
        produit.Image_url
      );

    }


    alert("Produit supprimé avec succès ✅");

    chargerProduits();

  }


  /* ==============================
     SUPPRIMER IMAGE STORAGE
  ============================== */

  async function supprimerAncienneImage(imageUrl) {

    try {

      const marker =
        "/storage/v1/object/public/product-images/";

      const position =
        imageUrl.indexOf(marker);

      if (position === -1) {
        return;
      }

      const filePath =
        decodeURIComponent(
          imageUrl.substring(
            position + marker.length
          )
        );

      if (!filePath) {
        return;
      }

      await supabaseClient
        .storage
        .from("product-images")
        .remove([filePath]);

    } catch (error) {

      console.log(
        "Impossible de supprimer l'ancienne image :",
        error
      );

    }

  }


  /* ==============================
     COMMANDES
  ============================== */

  async function chargerCommandes() {

    const list =
      document.getElementById("ordersList");

    list.innerHTML =
      '<div class="empty">Chargement des commandes...</div>';


    const { data, error } =
      await supabaseClient
        .from("Orders")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      list.innerHTML =
        '<div class="empty">Erreur : ' +
        error.message +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">Aucune commande pour le moment.</div>';

      return;
    }


    list.innerHTML = "";


    data.forEach(order => {

      const card =
        document.createElement("div");

      card.className = "order-card";


      card.innerHTML = `

        <strong>🧾 Commande #${order.id}</strong>

        <br>

        👤 Client :
        ${escapeHtml(order.Customer_name || "")}

        <br>

        📞 Téléphone :
        ${escapeHtml(order.Phone || "")}

        <br>

        📍 Adresse :
        ${escapeHtml(order.Address || "")}

        <br>

        💰 Total :
        <strong>
          ${Number(order.Total || 0).toLocaleString("fr-FR")}
          FCFA
        </strong>

        <br>

        📌 Statut :
        ${escapeHtml(order.Status || "")}

      `;


      list.appendChild(card);

    });

  }


  /* ==============================
     SESSION AU CHARGEMENT
  ============================== */

  async function verifierSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (session) {

      afficherAdmin();

    } else {

      adminBox.classList.add("hidden");
      connexionBox.classList.remove("hidden");

    }

  }


  /* ==============================
     RECUPERATION SESSION
  ============================== */

  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (
        event === "PASSWORD_RECOVERY"
      ) {

        connexionBox.classList.add("hidden");
        recoveryBox.classList.add("hidden");
        adminBox.classList.add("hidden");
        newPasswordBox.classList.remove("hidden");

      }

    }
  );


  verifierSession();

</script>
