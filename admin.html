<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 15px;
      cursor: pointer;
      font-weight: bold;
    }

    .logout {
      background: #e53935;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      margin-bottom: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-weight: bold;
      font-size: 14px;
    }

    .primary {
      background: #111;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #e53935;
      color: white;
    }

    .success {
      background: #168a45;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #f1f1f1;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 15px;
    }

    .product-card {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 12px;
      background: #fff;
    }

    .product-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      border-radius: 12px;
      background: #eee;
    }

    .product-card h3 {
      margin: 10px 0 5px;
    }

    .product-price {
      font-weight: bold;
      font-size: 18px;
      margin: 7px 0;
    }

    .product-info {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .actions button {
      flex: 1;
    }

    .preview {
      width: 100%;
      max-width: 250px;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
      display: none;
    }

    /* COMMANDES */

    .orders-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .orders-header h2 {
      margin: 0;
    }

    .order-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.04);
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .order-number {
      font-size: 18px;
      font-weight: bold;
    }

    .order-date {
      color: #777;
      font-size: 13px;
      margin-top: 4px;
    }

    .order-line {
      padding: 7px 0;
      border-bottom: 1px solid #f0f0f0;
      line-height: 1.45;
    }

    .order-line:last-child {
      border-bottom: none;
    }

    .order-label {
      font-weight: bold;
    }

    .order-total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status-select {
      margin: 8px 0 0;
      font-weight: bold;
    }

    .order-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .order-actions button {
      flex: 1;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 600px) {

      header {
        padding: 14px;
      }

      header h1 {
        font-size: 17px;
      }

      .container {
        padding: 12px;
      }

      .box {
        padding: 15px;
        border-radius: 14px;
      }

      .orders-header {
        align-items: stretch;
        flex-direction: column;
      }

      .orders-header button {
        width: 100%;
      }

      .order-top {
        flex-direction: column;
      }

      .order-actions {
        flex-direction: column;
      }

      .order-actions button {
        width: 100%;
      }

      .product-card img {
        height: 190px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👜 YAYOUNABYSAC</h1>

  <button
    class="logout"
    onclick="deconnexion()">
    Se déconnecter
  </button>
</header>


<div class="container">

  <!-- CONNEXION -->

  <div
    id="connexionBox"
    class="box">

    <h2>🔐 Connexion administrateur</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Votre email">

    <label>Mot de passe</label>
    <input
      type="password"
      id="password"
      placeholder="Votre mot de passe">

    <button
      class="primary"
      onclick="connexionAdmin()">
      Se connecter
    </button>

    <button
      class="secondary"
      onclick="afficherRecuperation()"
      style="margin-top:10px;">
      Mot de passe oublié ?
    </button>

    <div
      id="loginMessage"
      class="message hidden">
    </div>
  </div>


  <!-- RECUPERATION -->

  <div
    id="recuperationBox"
    class="box hidden">

    <h2>🔑 Récupération du mot de passe</h2>

    <label>Email</label>

    <input
      type="email"
      id="recoveryEmail"
      placeholder="Votre email">

    <button
      class="primary"
      onclick="envoyerRecuperation()">
      Envoyer le lien
    </button>

    <button
      class="secondary"
      onclick="retourConnexion()"
      style="margin-top:10px;">
      Retour
    </button>

    <div
      id="recoveryMessage"
      class="message hidden">
    </div>
  </div>


  <!-- NOUVEAU MOT DE PASSE -->

  <div
    id="newPasswordBox"
    class="box hidden">

    <h2>🔐 Nouveau mot de passe</h2>

    <label>Nouveau mot de passe</label>

    <input
      type="password"
      id="newPassword"
      placeholder="Nouveau mot de passe">

    <button
      class="primary"
      onclick="changerMotDePasse()">
      Enregistrer
    </button>

    <div
      id="newPasswordMessage"
      class="message hidden">
    </div>
  </div>


  <!-- ADMIN -->

  <div
    id="adminBox"
    class="hidden">


    <!-- PRODUITS -->

    <div class="box">

      <h2>📦 Gestion des produits</h2>

      <input
        type="hidden"
        id="editId">

      <label>Nom du produit</label>

      <input
        type="text"
        id="productName"
        placeholder="Ex : Sac à main">

      <label>Description</label>

      <textarea
        id="productDescription"
        placeholder="Description du produit"></textarea>

      <label>Prix en FCFA</label>

      <input
        type="number"
        id="productPrice"
        placeholder="18000">

      <label>Stock</label>

      <input
        type="number"
        id="productStock"
        placeholder="4">

      <label>Catégorie</label>

      <input
        type="text"
        id="productCategory"
        placeholder="Sacs à main">

      <label>Image du produit</label>

      <input
        type="file"
        id="productImage"
        accept="image/*"
        onchange="previewImage()">

      <img
        id="imagePreview"
        class="preview">

      <div class="actions">

        <button
          class="primary"
          id="saveProductButton"
          onclick="sauvegarderProduit()">
          ➕ Ajouter le produit
        </button>

        <button
          class="secondary"
          onclick="annulerModification()">
          Annuler
        </button>

      </div>

      <div
        id="productMessage"
        class="message hidden">
      </div>

    </div>


    <!-- LISTE PRODUITS -->

    <div class="box">

      <h2>🛍️ Mes produits</h2>

      <div
        id="productsList"
        class="products-grid">

        <div class="loading">
          Chargement des produits...
        </div>

      </div>

    </div>


    <!-- COMMANDES -->

    <div class="box">

      <div class="orders-header">

        <h2>🧾 Commandes</h2>

        <button
          class="primary"
          onclick="chargerCommandes()">
          🔄 Actualiser
        </button>

      </div>

      <div
        id="ordersList">

        <div class="loading">
          Chargement des commandes...
        </div>

      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   CONNEXION
========================= */

async function connexionAdmin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.classList.remove("hidden");

  if (!email || !password) {

    message.textContent =
      "Veuillez remplir tous les champs.";

    return;
  }

  message.textContent =
    "Connexion en cours...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    message.textContent =
      "Erreur : " + error.message;

    return;
  }

  message.textContent =
    "Connexion réussie.";

  afficherAdmin();
}


/* =========================
   AFFICHER ADMIN
========================= */

function afficherAdmin() {

  document
    .getElementById("connexionBox")
    .classList.add("hidden");

  document
    .getElementById("recuperationBox")
    .classList.add("hidden");

  document
    .getElementById("newPasswordBox")
    .classList.add("hidden");

  document
    .getElementById("adminBox")
    .classList.remove("hidden");

  chargerProduits();
  chargerCommandes();
}


/* =========================
   DECONNEXION
========================= */

async function deconnexion() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("adminBox")
    .classList.add("hidden");

  document
    .getElementById("connexionBox")
    .classList.remove("hidden");
}


/* =========================
   RECUPERATION
========================= */

function afficherRecuperation() {

  document
    .getElementById("connexionBox")
    .classList.add("hidden");

  document
    .getElementById("recuperationBox")
    .classList.remove("hidden");
}


function retourConnexion() {

  document
    .getElementById("recuperationBox")
    .classList.add("hidden");

  document
    .getElementById("connexionBox")
    .classList.remove("hidden");
}


async function envoyerRecuperation() {

  const email =
    document
      .getElementById("recoveryEmail")
      .value
      .trim();

  const message =
    document.getElementById("recoveryMessage");

  message.classList.remove("hidden");

  if (!email) {

    message.textContent =
      "Veuillez saisir votre email.";

    return;
  }

  const redirectUrl =
    window.location.origin +
    window.location.pathname;

  const { error } =
    await supabaseClient.auth.resetPasswordForEmail(
      email,
      {
        redirectTo: redirectUrl
      }
    );

  if (error) {

    message.textContent =
      "Erreur : " + error.message;

    return;
  }

  message.textContent =
    "Le lien de récupération a été envoyé.";
}


/* =========================
   CHANGER MOT DE PASSE
========================= */

async function changerMotDePasse() {

  const password =
    document
      .getElementById("newPassword")
      .value;

  const message =
    document.getElementById("newPasswordMessage");

  message.classList.remove("hidden");

  if (!password) {

    message.textContent =
      "Veuillez saisir un mot de passe.";

    return;
  }

  const { error } =
    await supabaseClient.auth.updateUser({
      password: password
    });

  if (error) {

    message.textContent =
      "Erreur : " + error.message;

    return;
  }

  message.textContent =
    "Mot de passe modifié avec succès.";
}


/* =========================
   PREVIEW IMAGE
========================= */

function previewImage() {

  const input =
    document.getElementById("productImage");

  const preview =
    document.getElementById("imagePreview");

  const file =
    input.files[0];

  if (!file) {

    preview.style.display = "none";

    return;
  }

  preview.src =
    URL.createObjectURL(file);

  preview.style.display = "block";
}


/* =========================
   CHARGER PRODUITS
========================= */

async function chargerProduits() {

  const list =
    document.getElementById("productsList");

  list.innerHTML =
    '<div class="loading">Chargement des produits...</div>';

  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", {
        ascending: false
      });

  if (error) {

    list.innerHTML =
      '<div class="empty">Erreur : ' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }

  if (!data || data.length === 0) {

    list.innerHTML =
      '<div class="empty">Aucun produit.</div>';

    return;
  }

  list.innerHTML = "";

  data.forEach(product => {

    const card =
      document.createElement("div");

    card.className =
      "product-card";

    const image =
      product.Image_url
        ? product.Image_url
        : "https://via.placeholder.com/500x500?text=YAYOUNABYSAC";

    card.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.name || "")}">

      <h3>
        ${escapeHtml(product.name || "")}
      </h3>

      <div class="product-price">
        ${Number(product.Price || 0).toLocaleString("fr-FR")}
        FCFA
      </div>

      <div class="product-info">

        📦 Stock :
        ${Number(product.Stock || 0)}

        <br>

        🏷️ Catégorie :
        ${escapeHtml(product.Category || "")}

        <br><br>

        ${escapeHtml(product.description || "")}

      </div>

      <div class="actions">

        <button
          class="primary"
          onclick="modifierProduit(${product.id})">
          ✏️ Modifier
        </button>

        <button
          class="danger"
          onclick="supprimerProduit(${product.id})">
          🗑️ Supprimer
        </button>

      </div>
    `;

    list.appendChild(card);
  });
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   MODIFIER PRODUIT
========================= */

async function modifierProduit(id) {

  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .eq("id", id)
      .single();

  if (error) {

    alert("Erreur : " + error.message);

    return;
  }

  document
    .getElementById("editId")
    .value = data.id;

  document
    .getElementById("productName")
    .value = data.name || "";

  document
    .getElementById("productDescription")
    .value = data.description || "";

  document
    .getElementById("productPrice")
    .value = data.Price || "";

  document
    .getElementById("productStock")
    .value = data.Stock || "";

  document
    .getElementById("productCategory")
    .value = data.Category || "";

  const preview =
    document.getElementById("imagePreview");

  if (data.Image_url) {

    preview.src =
      data.Image_url;

    preview.style.display =
      "block";

  } else {

    preview.style.display =
      "none";
  }

  document
    .getElementById("saveProductButton")
    .textContent =
      "💾 Enregistrer les modifications";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   ANNULER MODIFICATION
========================= */

function annulerModification() {

  document
    .getElementById("editId")
    .value = "";

  document
    .getElementById("productName")
    .value = "";

  document
    .getElementById("productDescription")
    .value = "";

  document
    .getElementById("productPrice")
    .value = "";

  document
    .getElementById("productStock")
    .value = "";

  document
    .getElementById("productCategory")
    .value = "";

  document
    .getElementById("productImage")
    .value = "";

  document
    .getElementById("imagePreview")
    .style.display = "none";

  document
    .getElementById("saveProductButton")
    .textContent =
      "➕ Ajouter le produit";
}


/* =========================
   SAUVEGARDER PRODUIT
========================= */

async function sauvegarderProduit() {

  const message =
    document.getElementById("productMessage");

  message.classList.remove("hidden");

  const editId =
    document
      .getElementById("editId")
      .value;

  const name =
    document
      .getElementById("productName")
      .value
      .trim();

  const description =
    document
      .getElementById("productDescription")
      .value
      .trim();

  const price =
    Number(
      document
        .getElementById("productPrice")
        .value
    );

  const stock =
    Number(
      document
        .getElementById("productStock")
        .value
    );

  const category =
    document
      .getElementById("productCategory")
      .value
      .trim();

  const imageInput =
    document.getElementById("productImage");

  if (!name || !price || stock < 0) {

    message.textContent =
      "Veuillez remplir correctement les champs obligatoires.";

    return;
  }

  message.textContent =
    "Enregistrement en cours...";


  let imageUrl = null;

  /* IMAGE EXISTANTE EN MODE MODIFICATION */

  if (editId) {

    const { data: existingProduct } =
      await supabaseClient
        .from("Products")
        .select("Image_url")
        .eq("id", editId)
        .single();

    if (existingProduct) {

      imageUrl =
        existingProduct.Image_url || null;
    }
  }


  /* NOUVELLE IMAGE */

  if (imageInput.files.length > 0) {

    const file =
      imageInput.files[0];

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();

    const fileName =
      "produit-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2) +
      "." +
      extension;

    const filePath =
      fileName;

    const { error: uploadError } =
      await supabaseClient
        .storage
        .from("product-images")
        .upload(
          filePath,
          file,
          {
            upsert: false
          }
        );

    if (uploadError) {

      message.textContent =
        "Erreur image : " +
        uploadError.message;

      return;
    }

    const publicResult =
      supabaseClient
        .storage
        .from("product-images")
        .getPublicUrl(filePath);

    imageUrl =
      publicResult.data.publicUrl;
  }


  /* MODIFICATION */

  if (editId) {

    const updateData = {
      name: name,
      description: description,
      Price: price,
      Stock: stock,
      Category: category
    };

    if (imageUrl) {

      updateData.Image_url =
        imageUrl;
    }

    const { error } =
      await supabaseClient
        .from("Products")
        .update(updateData)
        .eq("id", editId);

    if (error) {

      message.textContent =
        "Erreur : " +
        error.message;

      return;
    }

    message.textContent =
      "Produit modifié avec succès.";

  } else {

    /* AJOUT */

    const { error } =
      await supabaseClient
        .from("Products")
        .insert({
          name: name,
          description: description,
          Price: price,
          Stock: stock,
          Category: category,
          Image_url: imageUrl
        });

    if (error) {

      message.textContent =
        "Erreur : " +
        error.message;

      return;
    }

    message.textContent =
      "Produit ajouté avec succès.";
  }


  annulerModification();

  await chargerProduits();
}


/* =========================
   SUPPRIMER PRODUIT
========================= */

async function supprimerProduit(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer ce produit ?"
    );

  if (!confirmation) {
    return;
  }

  const { data: product } =
    await supabaseClient
      .from("Products")
      .select("Image_url")
      .eq("id", id)
      .single();

  const { error } =
    await supabaseClient
      .from("Products")
      .delete()
      .eq("id", id);

  if (error) {

    alert(
      "Impossible de supprimer le produit : " +
      error.message
    );

    return;
  }

  if (
    product &&
    product.Image_url
  ) {

    await supprimerAncienneImage(
      product.Image_url
    );
  }

  await chargerProduits();
}


/* =========================
   SUPPRIMER IMAGE
========================= */

async function supprimerAncienneImage(
  imageUrl
) {

  try {

    const marker =
      "/product-images/";

    const index =
      imageUrl.indexOf(marker);

    if (index === -1) {
      return;
    }

    const filePath =
      imageUrl.substring(
        index + marker.length
      );

    await supabaseClient
      .storage
      .from("product-images")
      .remove([
        filePath
      ]);

  } catch (error) {

    console.log(
      "Erreur suppression image",
      error
    );
  }
}


/* =========================
   FORMATER DATE
========================= */

function formaterDate(dateString) {

  if (!dateString) {
    return "";
  }

  const date =
    new Date(dateString);

  return date.toLocaleString(
    "fr-FR",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


/* =========================
   CHARGER COMMANDES
========================= */

async function chargerCommandes() {

  const list =
    document.getElementById("ordersList");

  list.innerHTML =
    '<div class="loading">Chargement des commandes...</div>';

  const { data, error } =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("id", {
        ascending: false
      });

  if (error) {

    list.innerHTML =
      '<div class="empty">Erreur : ' +
      escapeHtml(error.message) +
      '</div>';

    return;
  }

  if (!data || data.length === 0) {

    list.innerHTML =
      '<div class="empty">Aucune commande pour le moment.</div>';

    return;
  }

  list.innerHTML = "";

  data.forEach(order => {

    const card =
      document.createElement("div");

    card.className =
      "order-card";

    const status =
      order.Status || "Nouvelle";

    card.innerHTML = `

      <div class="order-top">

        <div>

          <div class="order-number">
            🧾 Commande #${order.id}
          </div>

          <div class="order-date">
            📅 ${formaterDate(order.created_at)}
          </div>

        </div>

      </div>


      <div class="order-line">

        <span class="order-label">
          👤 Client :
        </span>

        ${escapeHtml(
          order.Customer_name || ""
        )}

      </div>


      <div class="order-line">

        <span class="order-label">
          📞 Téléphone :
        </span>

        ${escapeHtml(
          order.Phone || ""
        )}

      </div>


      <div class="order-line">

        <span class="order-label">
          📍 Adresse :
        </span>

        ${escapeHtml(
          order.Address || ""
        )}

      </div>


      <div class="order-line">

        <span class="order-label">
          📌 Statut :
        </span>

        <select
          class="status-select"
          id="status-${order.id}"
          onchange="changerStatut(${order.id})">

          <option
            value="Nouvelle"
            ${status === "Nouvelle" ? "selected" : ""}>
            Nouvelle
          </option>

          <option
            value="En préparation"
            ${status === "En préparation" ? "selected" : ""}>
            En préparation
          </option>

          <option
            value="Expédiée"
            ${status === "Expédiée" ? "selected" : ""}>
            Expédiée
          </option>

          <option
            value="Livrée"
            ${status === "Livrée" ? "selected" : ""}>
            Livrée
          </option>

          <option
            value="Annulée"
            ${status === "Annulée" ? "selected" : ""}>
            Annulée
          </option>

        </select>

      </div>


      <div class="order-total">

        💰 ${Number(
          order.Total || 0
        ).toLocaleString("fr-FR")} FCFA

      </div>


      <div class="order-actions">

        <button
          class="success"
          onclick="ouvrirWhatsAppClient('${escapeHtml(order.Phone || "")}')">

          📲 WhatsApp

        </button>

      </div>

    `;

    list.appendChild(card);
  });
}


/* =========================
   CHANGER STATUT
========================= */

async function changerStatut(id) {

  const select =
    document.getElementById(
      "status-" + id
    );

  if (!select) {
    return;
  }

  const nouveauStatut =
    select.value;

  const { error } =
    await supabaseClient
      .from("Orders")
      .update({
        Status: nouveauStatut
      })
      .eq("id", id);

  if (error) {

    alert(
      "Erreur lors de la modification du statut : " +
      error.message
    );

    return;
  }

  alert(
    "Statut de la commande #" +
    id +
    " mis à jour."
  );
}


/* =========================
   WHATSAPP CLIENT
========================= */

function ouvrirWhatsAppClient(phone) {

  if (!phone) {

    alert(
      "Aucun numéro de téléphone disponible."
    );

    return;
  }

  let numero =
    String(phone)
      .replace(/\D/g, "");

  if (
    numero.startsWith("77") ||
    numero.startsWith("76") ||
    numero.startsWith("70") ||
    numero.startsWith("78") ||
    numero.startsWith("75")
  ) {

    numero =
      "221" + numero;
  }

  const url =
    "https://wa.me/" +
    numero;

  window.open(
    url,
    "_blank"
  );
}


/* =========================
   VERIFIER SESSION
========================= */

async function verifierSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (
    data &&
    data.session
  ) {

    afficherAdmin();

  } else {

    document
      .getElementById("adminBox")
      .classList.add("hidden");

    document
      .getElementById("connexionBox")
      .classList.remove("hidden");
  }
}


/* =========================
   AUTH CHANGEMENTS
========================= */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (
      event === "SIGNED_IN" &&
      session
    ) {

      afficherAdmin();
    }

    if (
      event === "SIGNED_OUT"
    ) {

      document
        .getElementById("adminBox")
        .classList.add("hidden");

      document
        .getElementById("connexionBox")
        .classList.remove("hidden");
    }

    if (
      event === "PASSWORD_RECOVERY"
    ) {

      document
        .getElementById("connexionBox")
        .classList.add("hidden");

      document
        .getElementById("recuperationBox")
        .classList.add("hidden");

      document
        .getElementById("newPasswordBox")
        .classList.remove("hidden");
    }
  }
);


/* =========================
   DEMARRAGE
========================= */

verifierSession();

</script>
