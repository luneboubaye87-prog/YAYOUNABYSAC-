<body>

<header>
  <h1>YAYOUNABYSAC — Administration</h1>
</header>

<main>

  <!-- CONNEXION -->

  <div class="box" id="connexionBox">

    <h2>🔐 Connexion administrateur</h2>

    <button

    <button

    >

    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- RECUPERATION -->

  <div class="box hidden" id="recoveryBox">

    <h2>🔑 Récupération du mot de passe</h2>

    <label>Email administrateur</label>

    <input
      type="email"
      id="recoveryEmail"
      placeholder="Votre email"
    >

    <button
      class="primary"
      onclick="envoyerRecuperation()"
    >
      Envoyer le lien
    </button>

    <button
      class="secondary"
      onclick="retourConnexion()"
    >
      Retour
    </button>

    <div id="recoveryMessage"></div>

  </div>


  <!-- NOUVEAU MOT DE PASSE -->

  <div class="box hidden" id="newPasswordBox">

    <h2>🔐 Nouveau mot de passe</h2>

    <label>Nouveau mot de passe</label>

    <input
      type="password"
      id="newPassword"
      placeholder="Nouveau mot de passe"
    >

    <button
      class="primary"
      onclick="changerMotDePasse()"
    >
      Enregistrer le nouveau mot de passe
    </button>

    <div id="newPasswordMessage"></div>

  </div>


  <!-- ADMIN -->

  <div class="hidden" id="adminBox">

    <!-- AJOUT PRODUIT -->

    <div class="box">

      <h2>➕ Ajouter un produit</h2>

      <label>Nom du produit</label>

      <input
        type="text"
        id="productName"
        placeholder="Ex : Sac à main"
      >


      <label>Description</label>

      <textarea
        id="productDescription"
        placeholder="Description du produit"
      ></textarea>


      <label>Prix en FCFA</label>

      <input
        type="number"
        id="productPrice"
        placeholder="18000"
        min="0"
      >


      <label>Stock</label>

      <input
        type="number"
        id="productStock"
        placeholder="4"
        min="0"
      >


      <label>Catégorie</label>

      <input
        type="text"
        id="productCategory"
        placeholder="Sacs à main"
      >


      <label>Photo du produit</label>

      <label class="photo-button">
        📷 Choisir une photo depuis le téléphone
        <input
          type="file"
          id="productImage"
          accept="image/*"
          onchange="previewPhoto(event)"
        >
      </label>

      <img
        id="photoPreview"
        alt="Aperçu de la photo"
      >


      <button
        class="primary"
        id="addProductButton"
        onclick="ajouterProduit()"
      >
        Ajouter le produit
      </button>

      <div id="productMessage"></div>

    </div>


    <!-- PRODUITS -->

    <div class="box">

      <h2>👜 Produits</h2>

      <div id="productsAdmin">
        Chargement des produits...
      </div>

    </div>


    <!-- COMMANDES -->

    <div class="box">

      <h2>📦 Commandes</h2>

      <button
        class="secondary"
        onclick="chargerCommandes()"
      >
        Actualiser
      </button>

      <button
        class="logout"
        onclick="deconnexion()"
      >
        Se déconnecter
      </button>

      <div id="orders">
        Chargement des commandes...
      </div>

    </div>

  </div>

</main>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     UTILITAIRES
  ================================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formaterPrix(value) {

    return Number(value || 0)
      .toLocaleString("fr-FR")
      .replace(/\u202f/g, " ") +
      " FCFA";

  }


  function afficherMessage(id, message, type = "") {

    const element =
      document.getElementById(id);

    element.innerHTML = `
      <div class="status ${type}">
        ${escapeHtml(message)}
      </div>
    `;

  }


  /* ================================
     CONNEXION
  ================================= */

  async function connexionAdmin() {

    const email =
      document
        .getElementById("email")
        .value
        .trim();

    const password =
      document
        .getElementById("password")
        .value;


    if (!email || !password) {

      afficherMessage(
        "loginMessage",
        "Veuillez remplir les deux champs.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });


    if (error) {

      afficherMessage(
        "loginMessage",
        error.message,
        "error"
      );

      return;
    }


    afficherAdmin();

  }


  /* ================================
     AFFICHER ADMIN
  ================================= */

  function afficherAdmin() {

    document
      .getElementById("connexionBox")
      .classList.add("hidden");

    document
      .getElementById("recoveryBox")
      .classList.add("hidden");

    document
      .getElementById("newPasswordBox")
      .classList.add("hidden");

    document
      .getElementById("adminBox")
      .classList.remove("hidden");


    chargerProduitsAdmin();

    chargerCommandes();

  }


  /* ================================
     PHOTO PREVIEW
  ================================= */

  function previewPhoto(event) {

    const file =
      event.target.files[0];

    const preview =
      document.getElementById("photoPreview");


    if (!file) {

      preview.style.display = "none";

      return;
    }


    if (!file.type.startsWith("image/")) {

      alert("Veuillez sélectionner une image.");

      event.target.value = "";

      preview.style.display = "none";

      return;
    }


    const reader =
      new FileReader();


    reader.onload = function(e) {

      preview.src = e.target.result;

      preview.style.display = "block";

    };


    reader.readAsDataURL(file);

  }


  /* ================================
     AJOUTER PRODUIT
  ================================= */

  async function ajouterProduit() {

    const name =
      document
        .getElementById("productName")
        .value
        .trim();

    const description =
      document
        .getElementById("productDescription")
        .value
        .trim();

    const price =
      Number(
        document
          .getElementById("productPrice")
          .value
      );

    const stock =
      Number(
        document
          .getElementById("productStock")
          .value
      );

    const category =
      document
        .getElementById("productCategory")
        .value
        .trim();

    const imageInput =
      document.getElementById("productImage");

    const file =
      imageInput.files[0];


    if (!name || !description || !category) {

      afficherMessage(
        "productMessage",
        "Veuillez remplir le nom, la description et la catégorie.",
        "error"
      );

      return;
    }


    if (!Number.isFinite(price) || price < 0) {

      afficherMessage(
        "productMessage",
        "Veuillez entrer un prix valide.",
        "error"
      );

      return;
    }


    if (!Number.isInteger(stock) || stock < 0) {

      afficherMessage(
        "productMessage",
        "Veuillez entrer un stock valide.",
        "error"
      );

      return;
    }


    if (!file) {

      afficherMessage(
        "productMessage",
        "Veuillez choisir une photo du produit.",
        "error"
      );

      return;
    }


    const button =
      document.getElementById("addProductButton");

    button.disabled = true;

    button.textContent =
      "⏳ Envoi de la photo...";


    try {

      const extension =
        file.name
          .split(".")
          .pop()
          .toLowerCase();


      const safeExtension =
        ["jpg", "jpeg", "png", "webp", "gif"]
          .includes(extension)
          ? extension
          : "jpg";


      const fileName =
        "produit-" +
        Date.now() +
        "-" +
        Math.random()
          .toString(36)
          .substring(2, 8) +
        "." +
        safeExtension;


      const filePath =
        fileName;


      /* UPLOAD PHOTO */

      const { error: uploadError } =
        await supabaseClient
          .storage
          .from("product-images")
          .upload(
            filePath,
            file,
            {
              cacheControl: "3600",
              upsert: false
            }
          );


      if (uploadError) {

        throw new Error(
          "Erreur lors de l'envoi de la photo : " +
          uploadError.message
        );

      }


      button.textContent =
        "⏳ Enregistrement du produit...";


      /* URL PUBLIQUE */

      const { data: publicData } =
        supabaseClient
          .storage
          .from("product-images")
          .getPublicUrl(filePath);


      const imageUrl =
        publicData.publicUrl;


      /* ENREGISTRER PRODUIT */

      const { error: insertError } =
        await supabaseClient
          .from("Products")
          .insert({
            name: name,
            description: description,
            Price: price,
            Image_url: imageUrl,
            Stock: stock,
            Category: category
          });


      if (insertError) {

        throw new Error(
          "Photo envoyée, mais erreur lors de l'enregistrement du produit : " +
          insertError.message
        );

      }


      afficherMessage(
        "productMessage",
        "✓ Produit ajouté avec sa photo.",
        "success"
      );


      /* VIDER FORMULAIRE */

      document
        .getElementById("productName")
        .value = "";

      document
        .getElementById("productDescription")
        .value = "";

      document
        .getElementById("productPrice")
        .value = "";

      document
        .getElementById("productStock")
        .value = "";

      document
        .getElementById("productCategory")
        .value = "";

      imageInput.value = "";


      const preview =
        document.getElementById("photoPreview");

      preview.src = "";

      preview.style.display = "none";


      chargerProduitsAdmin();


    } catch (error) {

      console.error(error);

      afficherMessage(
        "productMessage",
        error.message,
        "error"
      );

    }


    button.disabled = false;

    button.textContent =
      "Ajouter le produit";

  }


  /* ================================
     CHARGER PRODUITS ADMIN
  ================================= */

  async function chargerProduitsAdmin() {

    const container =
      document.getElementById("productsAdmin");

    container.innerHTML =
      "Chargement des produits...";


    const { data, error } =
      await supabaseClient
        .from("Products")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      container.innerHTML =
        `<div class="status error">
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        `<div class="status">
          Aucun produit pour le moment.
        </div>`;

      return;
    }


    container.innerHTML =
      data.map(product => {

        const image =
          product.Image_url
            ? `
              <img
                src="${escapeHtml(product.Image_url)}"
                alt="${escapeHtml(product.name)}"
              >
            `
            : `
              <div
                style="
                  width:70px;
                  height:70px;
                  border-radius:10px;
                  background:#eee;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-size:25px;
                "
              >
                👜
              </div>
            `;


        return `
          <div class="product-admin">

            ${image}

            <div class="product-admin-info">

              <strong>
                ${escapeHtml(product.name)}
              </strong>

              <div>
                ${formaterPrix(product.Price)}
              </div>

              <div class="small">
                Stock : ${escapeHtml(product.Stock)}
                ·
                ${escapeHtml(product.Category || "")}
              </div>

            </div>

          </div>
        `;

      }).join("");

  }


  /* ================================
     COMMANDES
  ================================= */

  async function chargerCommandes() {

    const container =
      document.getElementById("orders");

    container.innerHTML =
      "Chargement des commandes...";


    const { data, error } =
      await supabaseClient
        .from("Orders")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      container.innerHTML =
        `<div class="status error">
          ${escapeHtml(error.message)}
        </div>`;

      return;
    }


    if (!data || data.length === 0) {

      container.innerHTML =
        `<div class="status">
          Aucune commande pour le moment.
        </div>`;

      return;
    }


    container.innerHTML =
      data.map(order => {

        return `
          <div class="order">

            <strong>
              📦 Commande #${escapeHtml(order.id)}
            </strong>

            <div>
              👤 ${escapeHtml(order.Customer_name || "")}
            </div>

            <div>
              📞 ${escapeHtml(order.Phone || "")}
            </div>

            <div>
              📍 ${escapeHtml(order.Address || "")}
            </div>

            <div>
              💰 ${formaterPrix(order.Total)}
            </div>

            <div>
              📌 ${escapeHtml(order.Status || "")}
            </div>

          </div>
        `;

      }).join("");

  }


  /* ================================
     RECUPERATION
  ================================= */

  function afficherRecuperation() {

    document
      .getElementById("connexionBox")
      .classList.add("hidden");

    document
      .getElementById("recoveryBox")
      .classList.remove("hidden");

  }


  function retourConnexion() {

    document
      .getElementById("recoveryBox")
      .classList.add("hidden");

    document
      .getElementById("connexionBox")
      .classList.remove("hidden");

  }


  async function envoyerRecuperation() {

    const email =
      document
        .getElementById("recoveryEmail")
        .value
        .trim();


    if (!email) {

      afficherMessage(
        "recoveryMessage",
        "Entrez votre adresse email.",
        "error"
      );

      return;
    }


    const redirectTo =
      window.location.origin +
      window.location.pathname;


    const { error } =
      await supabaseClient.auth
        .resetPasswordForEmail(
          email,
          {
            redirectTo: redirectTo
          }
        );


    if (error) {

      afficherMessage(
        "recoveryMessage",
        error.message,
        "error"
      );

      return;
    }


    afficherMessage(
      "recoveryMessage",
      "✓ Le lien de récupération a été envoyé.",
      "success"
    );

  }


  /* ================================
     CHANGEMENT MOT DE PASSE
  ================================= */

  async function changerMotDePasse() {

    const password =
      document
        .getElementById("newPassword")
        .value;


    if (!password || password.length < 6) {

      afficherMessage(
        "newPasswordMessage",
        "Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient.auth
        .updateUser({
          password: password
        });


    if (error) {

      afficherMessage(
        "newPasswordMessage",
        error.message,
        "error"
      );

      return;
    }


    afficherMessage(
      "newPasswordMessage",
      "✓ Mot de passe modifié avec succès.",
      "success"
    );

  }


  /* ================================
     DECONNEXION
  ================================= */

  async function deconnexion() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  /* ================================
     SESSION
  ================================= */

  async function verifierSession() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();


    if (session) {

      const hash =
        window.location.hash;

      if (
        hash.includes("type=recovery")
      ) {

        document
          .getElementById("connexionBox")
          .classList.add("hidden");

        document
          .getElementById("newPasswordBox")
          .classList.remove("hidden");

      } else {

        afficherAdmin();

      }

    }

  }


  verifierSession();

</script>

</body>
</html>
