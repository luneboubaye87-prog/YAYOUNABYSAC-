<!DOCTYPE html>

<head>

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;

    .container {

    .box {

    }

    h1, h2 {
      margin-top: 0;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;

    }

    .btn {
      background: #111;
      color: white;
    }

    .logout {
      background: #c62828;
      color: white;
    }

    .product,
    .order {
      border: 1px solid #ddd;
      border-radius: 10px;

    }

    .hidden {

    }

    .success {

    }

    .error {
      color: #c62828;
      font-weight: bold;

    .status {
      font-weight: bold;
    }

    img {
      max-width: 150px;

    }
  </style>

</head>

  <button class="logout" type="button" onclick="deconnexion()">
    🚪 Se déconnecter
  </button>

</div>


<!-- AJOUT PRODUIT -->
<div class="box">

  <h2>➕ Ajouter un produit</h2>

  <input
    type="text"

    placeholder="Nom du produit"
  >

  <textarea
    id="descriptionProduit"

  ></textarea>

  >

  >

  >

  <button class="btn" type="button" onclick="ajouterProduit()">
    ➕ Ajouter le produit
  </button>

  <p id="messageProduit"></p>

</div>


<!-- PRODUITS -->
<div class="box">

  <h2>👜 Produits</h2>

  <button class="btn" type="button" onclick="chargerProduits()">

  </button>

  <div id="listeProduits">
    Chargement des produits...
  </div>

</div>


<!-- COMMANDES -->
<div class="box">

  <h2>📦 Commandes</h2>

  <button class="btn" type="button" onclick="chargerCommandes()">

  </button>

  <div id="listeCommandes">
    Chargement des commandes...
  </div>

</div>
```

  </div>

</div>

<script>

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ===============================
// CONNEXION
// ===============================

async function connexionAdmin() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("messageConnexion");

  message.textContent = "Connexion...";
  message.className = "";

  if (!email || !password) {
    message.textContent =
      "Veuillez entrer votre e-mail et votre mot de passe.";
    message.className = "error";
    return;
  }

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    console.error(error);

    message.textContent =
      "Erreur : " + error.message;

    message.className = "error";

    return;
  }

  console.log("Administrateur connecté :", data.user);

  document.getElementById("connexionBox")
    .classList.add("hidden");

  document.getElementById("adminBox")
    .classList.remove("hidden");

  chargerProduits();
  chargerCommandes();
}


// ===============================
// DÉCONNEXION
// ===============================

async function deconnexion() {

  await supabaseClient.auth.signOut();

  document.getElementById("adminBox")
    .classList.add("hidden");

  document.getElementById("connexionBox")
    .classList.remove("hidden");

  document.getElementById("password").value = "";

  document.getElementById("messageConnexion").textContent = "";
}


// ===============================
// VÉRIFIER LA SESSION
// ===============================

async function verifierSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    document.getElementById("connexionBox")
      .classList.add("hidden");

    document.getElementById("adminBox")
      .classList.remove("hidden");

    chargerProduits();
    chargerCommandes();

  } else {

    document.getElementById("connexionBox")
      .classList.remove("hidden");

    document.getElementById("adminBox")
      .classList.add("hidden");
  }
}


// ===============================
// AJOUTER UN PRODUIT
// ===============================

async function ajouterProduit() {

  const nom =
    document.getElementById("nomProduit").value.trim();

  const description =
    document.getElementById("descriptionProduit").value.trim();

  const prix =
    Number(document.getElementById("prixProduit").value);

  const stock =
    Number(document.getElementById("stockProduit").value);

  const categorie =
    document.getElementById("categorieProduit").value.trim();

  const image =
    document.getElementById("imageProduit").value.trim();

  const message =
    document.getElementById("messageProduit");

  message.textContent = "Ajout du produit...";
  message.className = "";

  if (!nom || !prix || !stock || !categorie) {

    message.textContent =
      "Veuillez remplir les champs obligatoires.";

    message.className = "error";

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("Products")
      .insert([
        {
          name: nom,
          description: description,
          Price: prix,
          Stock: stock,
          Category: categorie,
          Image_url: image || null
        }
      ])
      .select();

  if (error) {

    console.error(error);

    message.textContent =
      "Erreur : " + error.message;

    message.className = "error";

    return;
  }

  message.textContent =
    "✅ Produit ajouté avec succès !";

  message.className = "success";

  document.getElementById("nomProduit").value = "";
  document.getElementById("descriptionProduit").value = "";
  document.getElementById("prixProduit").value = "";
  document.getElementById("stockProduit").value = "";
  document.getElementById("categorieProduit").value = "";
  document.getElementById("imageProduit").value = "";

  chargerProduits();
}


// ===============================
// CHARGER LES PRODUITS
// ===============================

async function chargerProduits() {

  const zone =
    document.getElementById("listeProduits");

  zone.innerHTML =
    "Chargement des produits...";

  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", { ascending: false });

  if (error) {

    console.error(error);

    zone.innerHTML =
      '<p class="error">Erreur : ' +
      error.message +
      '</p>';

    return;
  }

  if (!data || data.length === 0) {

    zone.innerHTML =
      "<p>Aucun produit.</p>";

    return;
  }

  zone.innerHTML = "";

  data.forEach(produit => {

    const div =
      document.createElement("div");

    div.className = "product";

    div.innerHTML = `
      <strong>${produit.name || ""}</strong><br>
      ${produit.description || ""}<br><br>

      💰 Prix :
      ${Number(produit.Price || 0).toLocaleString("fr-FR")}
      FCFA<br>

      📦 Stock :
      ${produit.Stock ?? 0}<br>

      🏷️ Catégorie :
      ${produit.Category || ""}<br>

      ${
        produit.Image_url
        ? `<img src="${produit.Image_url}" alt="${produit.name || "Produit"}">`
        : ""
      }
    `;

    zone.appendChild(div);

  });
}


// ===============================
// CHARGER LES COMMANDES
// ===============================

async function chargerCommandes() {

  const zone =
    document.getElementById("listeCommandes");

  zone.innerHTML =
    "Chargement des commandes...";

  const { data, error } =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    zone.innerHTML =
      '<p class="error">Erreur : ' +
      error.message +
      '</p>';

    return;
  }

  if (!data || data.length === 0) {

    zone.innerHTML =
      "<p>Aucune commande pour le moment.</p>";

    return;
  }

  zone.innerHTML = "";

  data.forEach(commande => {

    const div =
      document.createElement("div");

    div.className = "order";

    const statuts = [
      "Nouvelle",
      "Confirmée",
      "Expédiée",
      "Livrée",
      "Annulée"
    ];

    let optionsStatut = "";

    statuts.forEach(statut => {

      optionsStatut += `
        <option
          value="${statut}"
          ${commande.status === statut ? "selected" : ""}
        >
          ${statut}
        </option>
      `;

    });

    div.innerHTML = `

      <strong>📦 Commande #${commande.id}</strong>

      <br><br>

      👤 Client :
      ${commande.customer_nam || ""}

      <br>

      📞 Téléphone :
      ${commande.phone || ""}

      <br>

      📍 Adresse :
      ${commande.address || ""}

      <br>

      💰 Total :
      ${Number(commande.total || 0).toLocaleString("fr-FR")}
      FCFA

      <br><br>

      <label>
        <strong>Statut :</strong>
      </label>

      <select
        onchange="changerStatut(${commande.id}, this.value)"
      >
        ${optionsStatut}
      </select>

      <div id="items-${commande.id}">
        Chargement des articles...
      </div>

    `;

    zone.appendChild(div);

    chargerArticlesCommande(commande.id);

  });

}


// ===============================
// ARTICLES D'UNE COMMANDE
// ===============================

async function chargerArticlesCommande(orderId) {

  const zone =
    document.getElementById("items-" + orderId);

  if (!zone) return;

  const { data, error } =
    await supabaseClient
      .from("Orders_items")
      .select("*")
      .eq("order_id", orderId);

  if (error) {

    console.error(error);

    zone.innerHTML =
      '<p class="error">Erreur articles : ' +
      error.message +
      '</p>';

    return;
  }

  if (!data || data.length === 0) {

    zone.innerHTML =
      "<br>🛍️ Aucun article trouvé.";

    return;
  }

  let html =
    "<br><strong>🛍️ Articles :</strong><br>";

  for (const ligne of data) {

    const { data: produit } =
      await supabaseClient
        .from("Products")
        .select("name")
        .eq("id", ligne.product_id)
        .maybeSingle();

    const nomProduit =
      produit ? produit.name : "Produit";

    html += `
      • ${nomProduit}
      × ${ligne.quantity}
      — ${Number(ligne.price || 0).toLocaleString("fr-FR")} FCFA
      <br>
    `;
  }

  zone.innerHTML = html;
}


// ===============================
// CHANGER LE STATUT
// ===============================

async function changerStatut(orderId, nouveauStatut) {

  const { error } =
    await supabaseClient
      .from("Orders")
      .update({
        status: nouveauStatut
      })
      .eq("id", orderId);

  if (error) {

    console.error(error);

    alert(
      "Erreur lors de la modification du statut :\n\n" +
      error.message
    );

    return;
  }

  console.log(
    "Statut modifié pour la commande",
    orderId,
    nouveauStatut
  );

}


// ===============================
// DÉMARRAGE
// ===============================

verifierSession();

</script>

</body>
</html>
