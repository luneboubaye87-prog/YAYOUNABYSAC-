<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f7f3ef;
      color:#2d2926;
      padding:20px;
    }

    .container{
      max-width:1000px;
      margin:0 auto;
    }

    header{
      background:#2d2926;
      color:white;
      padding:22px;
      border-radius:18px;
      margin-bottom:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    header h1{
      font-size:24px;
    }

    .card{
      background:white;
      border-radius:18px;
      padding:22px;
      margin-bottom:20px;
      box-shadow:0 5px 20px rgba(0,0,0,0.07);
    }

    .card h2{
      margin-bottom:18px;
      font-size:20px;
    }

    label{
      display:block;
      margin-bottom:7px;
      font-weight:bold;
      font-size:14px;
    }

    input,
    textarea,
    select{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      margin-bottom:14px;
      font-size:15px;
      background:white;
    }

    textarea{
      min-height:90px;
      resize:vertical;
    }

    button{
      border:none;
      border-radius:10px;
      padding:12px 16px;
      cursor:pointer;
      font-weight:bold;
      font-size:14px;
    }

    .btn-primary{
      background:#2d2926;
      color:white;
    }

    .btn-secondary{
      background:#eee5de;
      color:#2d2926;
    }

    .btn-danger{
      background:#b42318;
      color:white;
    }

    .btn-success{
      background:#26734d;
      color:white;
    }

    .hidden{
      display:none !important;
    }

    .message{
      padding:12px;
      border-radius:10px;
      margin-bottom:15px;
      display:none;
      line-height:1.5;
      font-size:14px;
    }

    .message.error{
      background:#ffe7e5;
      color:#a11a12;
    }

    .message.success{
      background:#e5f6eb;
      color:#17653c;
    }

    .order{
      border:1px solid #e4ddd7;
      border-radius:16px;
      padding:18px;
      margin-bottom:18px;
      background:#fff;
    }

    .order-header{
      display:flex;
      justify-content:space-between;
      gap:15px;
      flex-wrap:wrap;
      padding-bottom:14px;
      margin-bottom:14px;
      border-bottom:1px solid #eee;
    }

    .order-id{
      font-size:18px;
      font-weight:bold;
    }

    .order-date{
      color:#777;
      font-size:13px;
    }

    .customer{
      background:#faf8f6;
      padding:14px;
      border-radius:12px;
      margin-bottom:16px;
      line-height:1.7;
    }

    .customer strong{
      color:#2d2926;
    }

    .products-title{
      font-size:16px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .product-item{
      border:1px solid #eee;
      border-radius:12px;
      padding:13px;
      margin-bottom:9px;
      background:#fafafa;
    }

    .product-line{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
    }

    .product-name{
      font-weight:bold;
      margin-bottom:5px;
    }

    .product-info{
      font-size:13px;
      color:#666;
      line-height:1.5;
    }

    .product-price{
      font-weight:bold;
      white-space:nowrap;
    }

    .order-total{
      margin-top:14px;
      padding-top:14px;
      border-top:2px solid #eee5de;
      display:flex;
      justify-content:space-between;
      font-size:18px;
      font-weight:bold;
    }

    .status-zone{
      margin-top:16px;
      padding-top:16px;
      border-top:1px solid #eee;
    }

    .status-zone select{
      margin-bottom:10px;
    }

    .status-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#777;
    }

    .empty{
      text-align:center;
      padding:30px;
      color:#777;
      background:#faf8f6;
      border-radius:12px;
    }

    .small-error{
      background:#fff0ee;
      color:#a11a12;
      border-radius:10px;
      padding:12px;
      margin-top:10px;
      font-size:13px;
      line-height:1.5;
    }

    .top-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .recovery-link{
      display:block;
      text-align:center;
      margin-top:10px;
      color:#8a5a44;
      cursor:pointer;
      text-decoration:underline;
      font-size:14px;
    }

    .separator{
      text-align:center;
      margin:15px 0;
      color:#999;
      font-size:13px;
    }

    @media(max-width:600px){
      body{
        padding:12px;
      }

      header{
        padding:18px;
      }

      header h1{
        font-size:20px;
      }

      .card{
        padding:16px;
      }

      .product-line{
        flex-direction:column;
      }

      .product-price{
        white-space:normal;
      }

      .order-total{
        font-size:16px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>👜 YAYOUNABYSAC - Administration</h1>

    <div class="top-actions">
      <button
        id="actualiserBtn"
        class="btn-secondary hidden"
        onclick="chargerCommandes()">
        🔄 Actualiser
      </button>

      <button
        id="deconnexionBtn"
        class="btn-danger hidden"
        onclick="deconnexionAdmin()">
        🚪 Se déconnecter
      </button>
    </div>
  </header>


  <!-- CONNEXION -->
  <div id="connexionBox" class="card">

    <h2>🔐 Connexion administrateur</h2>

    <div id="connexionMessage" class="message"></div>

    <label for="email">Adresse e-mail</label>
    <input
      type="email"
      id="email"
      placeholder="Votre adresse e-mail">

    <label for="password">Mot de passe</label>
    <input
      type="password"
      id="password"
      placeholder="Votre mot de passe">

    <button
      class="btn-primary"
      style="width:100%;"
      onclick="connexionAdmin()">
      Se connecter
    </button>

    <div
      class="recovery-link"
      onclick="afficherRecuperation()">
      Mot de passe oublié ?
    </div>

  </div>


  <!-- RECUPERATION -->
  <div id="recoveryBox" class="card hidden">

    <h2>📧 Réinitialiser le mot de passe</h2>

    <div id="recoveryMessage" class="message"></div>

    <label for="recoveryEmail">Adresse e-mail</label>

    <input
      type="email"
      id="recoveryEmail"
      placeholder="Votre adresse e-mail">

    <button
      class="btn-primary"
      style="width:100%;"
      onclick="envoyerRecuperation()">
      Envoyer le lien
    </button>

    <div
      class="recovery-link"
      onclick="afficherConnexion()">
      Retour à la connexion
    </div>

  </div>


  <!-- NOUVEAU MOT DE PASSE -->
  <div id="newPasswordBox" class="card hidden">

    <h2>🔑 Nouveau mot de passe</h2>

    <div id="newPasswordMessage" class="message"></div>

    <label for="newPassword">
      Nouveau mot de passe
    </label>

    <input
      type="password"
      id="newPassword"
      placeholder="Nouveau mot de passe">

    <label for="confirmPassword">
      Confirmer le mot de passe
    </label>

    <input
      type="password"
      id="confirmPassword"
      placeholder="Confirmer le mot de passe">

    <button
      class="btn-primary"
      style="width:100%;"
      onclick="changerMotDePasse()">
      Enregistrer le nouveau mot de passe
    </button>

  </div>


  <!-- ADMIN -->
  <div id="adminBox" class="hidden">

    <div class="card">

      <h2>📦 Commandes</h2>

      <div id="commandesMessage" class="message"></div>

      <div id="commandesContainer">
        <div class="loading">
          Chargement des commandes...
        </div>
      </div>

    </div>

  </div>

</div>


<script>

  /* ==============================
     CONFIGURATION SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==============================
     ELEMENTS
  ============================== */

  const connexionBox =
    document.getElementById("connexionBox");

  const recoveryBox =
    document.getElementById("recoveryBox");

  const newPasswordBox =
    document.getElementById("newPasswordBox");

  const adminBox =
    document.getElementById("adminBox");

  const actualiserBtn =
    document.getElementById("actualiserBtn");

  const deconnexionBtn =
    document.getElementById("deconnexionBtn");

  const commandesContainer =
    document.getElementById("commandesContainer");


  /* ==============================
     OUTILS
  ============================== */

  function escapeHtml(value){

    if(value === null || value === undefined){
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function formatPrice(value){

    const number =
      Number(value || 0);

    return number.toLocaleString("fr-FR") +
      " FCFA";
  }


  function formatDate(date){

    if(!date){
      return "";
    }

    try{

      return new Date(date).toLocaleString(
        "fr-FR",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

    }catch(error){

      return date;
    }
  }


  function afficherMessage(
    elementId,
    message,
    type
  ){

    const element =
      document.getElementById(elementId);

    if(!element){
      return;
    }

    element.textContent = message;

    element.className =
      "message " + type;

    element.style.display = "block";
  }


  function cacherMessage(elementId){

    const element =
      document.getElementById(elementId);

    if(element){
      element.style.display = "none";
    }
  }


  /* ==============================
     AFFICHAGE DES ECRANS
  ============================== */

  function afficherConnexion(){

    connexionBox.classList.remove("hidden");
    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");
    adminBox.classList.add("hidden");

    actualiserBtn.classList.add("hidden");
    deconnexionBtn.classList.add("hidden");
  }


  function afficherRecuperation(){

    connexionBox.classList.add("hidden");
    recoveryBox.classList.remove("hidden");
    newPasswordBox.classList.add("hidden");
    adminBox.classList.add("hidden");

    actualiserBtn.classList.add("hidden");
    deconnexionBtn.classList.add("hidden");

    cacherMessage("recoveryMessage");
  }


  function afficherAdmin(){

    connexionBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");
    adminBox.classList.remove("hidden");

    actualiserBtn.classList.remove("hidden");
    deconnexionBtn.classList.remove("hidden");
  }


  function afficherNouveauMotDePasse(){

    connexionBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    adminBox.classList.add("hidden");
    newPasswordBox.classList.remove("hidden");

    actualiserBtn.classList.add("hidden");
    deconnexionBtn.classList.add("hidden");
  }


  /* ==============================
     CONNEXION ADMIN
  ============================== */

  async function connexionAdmin(){

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    cacherMessage("connexionMessage");

    if(!email || !password){

      afficherMessage(
        "connexionMessage",
        "Veuillez remplir l'adresse e-mail et le mot de passe.",
        "error"
      );

      return;
    }

    const button =
      document.querySelector(
        '#connexionBox button.btn-primary'
      );

    if(button){
      button.disabled = true;
      button.textContent = "Connexion...";
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(button){
      button.disabled = false;
      button.textContent = "Se connecter";
    }

    if(error){

      afficherMessage(
        "connexionMessage",
        "Erreur de connexion : " +
        error.message,
        "error"
      );

      return;
    }

    if(data && data.session){

      afficherAdmin();

      await chargerCommandes();
    }
  }


  /* ==============================
     DECONNEXION
  ============================== */

  async function deconnexionAdmin(){

    const {
      error
    } =
      await supabaseClient.auth.signOut();

    if(error){

      alert(
        "Erreur lors de la déconnexion : " +
        error.message
      );

      return;
    }

    afficherConnexion();
  }


  /* ==============================
     RECUPERATION MOT DE PASSE
  ============================== */

  async function envoyerRecuperation(){

    const email =
      document.getElementById(
        "recoveryEmail"
      ).value.trim();

    cacherMessage("recoveryMessage");

    if(!email){

      afficherMessage(
        "recoveryMessage",
        "Veuillez entrer votre adresse e-mail.",
        "error"
      );

      return;
    }

    const redirectTo =
      window.location.origin +
      window.location.pathname;

    const {
      error
    } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectTo
        }
      );

    if(error){

      afficherMessage(
        "recoveryMessage",
        "Erreur lors de l'envoi : " +
        error.message,
        "error"
      );

      return;
    }

    afficherMessage(
      "recoveryMessage",
      "Le lien de réinitialisation a été envoyé à votre adresse e-mail.",
      "success"
    );
  }


  /* ==============================
     CHANGER MOT DE PASSE
  ============================== */

  async function changerMotDePasse(){

    const password =
      document.getElementById(
        "newPassword"
      ).value;

    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      ).value;

    cacherMessage("newPasswordMessage");

    if(!password || !confirmPassword){

      afficherMessage(
        "newPasswordMessage",
        "Veuillez remplir les deux champs.",
        "error"
      );

      return;
    }

    if(password.length < 6){

      afficherMessage(
        "newPasswordMessage",
        "Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }

    if(password !== confirmPassword){

      afficherMessage(
        "newPasswordMessage",
        "Les deux mots de passe ne correspondent pas.",
        "error"
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if(error){

      afficherMessage(
        "newPasswordMessage",
        "Erreur : " +
        error.message,
        "error"
      );

      return;
    }

    afficherMessage(
      "newPasswordMessage",
      "Mot de passe modifié avec succès. Vous pouvez maintenant vous connecter.",
      "success"
    );

    setTimeout(
      () => {
        afficherConnexion();
      },
      2000
    );
  }


  /* ==============================
     CHARGER LES COMMANDES
  ============================== */

  async function chargerCommandes(){

    commandesContainer.innerHTML =
      '<div class="loading">Chargement des commandes...</div>';

    const {
      data: commandes,
      error
    } =
      await supabaseClient
        .from("Orders")
        .select("*")
        .order(
          "id",
          {
            ascending:false
          }
        );

    if(error){

      commandesContainer.innerHTML =
        '<div class="small-error">' +
        '<strong>Erreur lors du chargement des commandes :</strong><br>' +
        escapeHtml(error.message) +
        '</div>';

      return;
    }

    if(!commandes || commandes.length === 0){

      commandesContainer.innerHTML =
        '<div class="empty">' +
        'Aucune commande pour le moment.' +
        '</div>';

      return;
    }

    let html = "";

    for(const commande of commandes){

      html +=
        await construireCommandeHtml(
          commande
        );
    }

    commandesContainer.innerHTML = html;
  }


  /* ==============================
     CONSTRUIRE UNE COMMANDE
  ============================== */

  async function construireCommandeHtml(
    commande
  ){

    const id =
      commande.id;

    const customerName =
      commande.customer_name || "";

    const phone =
      commande.phone || "";

    const address =
      commande.address || "";

    const total =
      commande.total || 0;

    const status =
      commande.status || "Depuis WhatsApp";

    const createdAt =
      commande.created_at || "";


    /* ==============================
       LECTURE DES ARTICLES
    ============================== */

    const {
      data: items,
      error: itemsError
    } =
      await supabaseClient
        .from("Orders_items")
        .select(
          "id, order_id, product_id, quantity, price"
        )
        .eq(
          "order_id",
          id
        )
        .order(
          "id",
          {
            ascending:true
          }
        );


    let articlesHtml = "";


    /* ERREUR DE LECTURE */
    if(itemsError){

      articlesHtml =
        '<div class="small-error">' +
        '<strong>Erreur lors de la lecture des produits :</strong><br>' +
        escapeHtml(itemsError.message) +
        '<br><br>' +
        'La commande existe bien, mais Supabase refuse peut-être la lecture de la table Orders_items.' +
        '</div>';

    }


    /* AUCUN ARTICLE */
    else if(!items || items.length === 0){

      articlesHtml =
        '<div class="small-error" style="background:#fff8e6;color:#7a5a00;">' +
        'Aucun article trouvé dans Orders_items pour cette commande.' +
        '</div>';

    }


    /* ARTICLES TROUVES */
    else{

      /*
        On récupère les identifiants des produits
      */

      const productIds =
        [
          ...new Set(
            items
              .map(
                item => item.product_id
              )
              .filter(
                id => id !== null &&
                      id !== undefined
              )
          )
        ];


      let produits = [];
      let productsError = null;


      if(productIds.length > 0){

        const result =
          await supabaseClient
            .from("Products")
            .select(
              "id, name, Price, Image_url"
            )
            .in(
              "id",
              productIds
            );

        produits =
          result.data || [];

        productsError =
          result.error;
      }


      /*
        Création d'un dictionnaire des produits
      */

      const produitsMap = {};

      produits.forEach(
        produit => {

          produitsMap[
            String(produit.id)
          ] = produit;
        }
      );


      items.forEach(
        item => {

          const produit =
            produitsMap[
              String(item.product_id)
            ];


          const productName =
            produit && produit.name
              ? produit.name
              : "Produit #" +
                item.product_id;


          const quantity =
            Number(item.quantity || 0);


          /*
            IMPORTANT :
            Le prix affiché vient de Orders_items.price,
            car c'est le prix enregistré au moment
            de la commande.
          */

          const unitPrice =
            Number(item.price || 0);


          const subtotal =
            quantity * unitPrice;


          articlesHtml +=
            '<div class="product-item">' +

              '<div class="product-line">' +

                '<div>' +

                  '<div class="product-name">' +
                    escapeHtml(productName) +
                  '</div>' +

                  '<div class="product-info">' +
                    'Quantité : <strong>' +
                    quantity +
                    '</strong>' +
                    '<br>' +
                    'Prix unitaire : <strong>' +
                    formatPrice(unitPrice) +
                    '</strong>' +
                  '</div>' +

                '</div>' +

                '<div class="product-price">' +
                  formatPrice(subtotal) +
                '</div>' +

              '</div>' +

            '</div>';
        }
      );


      /*
        Si les produits n'ont pas pu être récupérés,
        on affiche quand même les articles avec leur ID.
      */

      if(productsError){

        articlesHtml +=
          '<div class="small-error">' +
          '<strong>Information :</strong><br>' +
          'Les articles sont bien enregistrés, mais les noms des produits n’ont pas pu être récupérés depuis Products.<br><br>' +
          escapeHtml(productsError.message) +
          '</div>';
      }

    }


    /* ==============================
       HTML DE LA COMMANDE
    ============================== */

    return (

      '<div class="order">' +

        '<div class="order-header">' +

          '<div>' +

            '<div class="order-id">' +
              'Commande #' +
              escapeHtml(id) +
            '</div>' +

            '<div class="order-date">' +
              escapeHtml(
                formatDate(createdAt)
              ) +
            '</div>' +

          '</div>' +

        '</div>' +


        '<div class="customer">' +

          '<strong>👤 Client :</strong> ' +
          escapeHtml(customerName) +

          '<br>' +

          '<strong>📞 Téléphone :</strong> ' +
          escapeHtml(phone) +

          '<br>' +

          '<strong>📍 Adresse / Quartier :</strong> ' +
          escapeHtml(address) +

        '</div>' +


        '<div class="products-title">' +
          '🛍️ Produits commandés' +
        '</div>' +

        articlesHtml +


        '<div class="order-total">' +

          '<span>Total</span>' +

          '<span>' +
            formatPrice(total) +
          '</span>' +

        '</div>' +


        '<div class="status-zone">' +

          '<label for="status-' +
            escapeHtml(id) +
          '">' +
            '📌 Statut de la commande' +
          '</label>' +

          '<select id="status-' +
            escapeHtml(id) +
          '">' +

            '<option value="Depuis WhatsApp"' +
              (
                status === "Depuis WhatsApp"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'Depuis WhatsApp' +
            '</option>' +

            '<option value="En attente"' +
              (
                status === "En attente"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'En attente' +
            '</option>' +

            '<option value="Confirmée"' +
              (
                status === "Confirmée"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'Confirmée' +
            '</option>' +

            '<option value="En préparation"' +
              (
                status === "En préparation"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'En préparation' +
            '</option>' +

            '<option value="Expédiée"' +
              (
                status === "Expédiée"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'Expédiée' +
            '</option>' +

            '<option value="Livrée"' +
              (
                status === "Livrée"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'Livrée' +
            '</option>' +

            '<option value="Annulée"' +
              (
                status === "Annulée"
                  ? " selected"
                  : ""
              ) +
            '>' +
              'Annulée' +
            '</option>' +

          '</select>' +


          '<div class="status-actions">' +

            '<button ' +
              'class="btn-success" ' +
              'onclick="modifierStatut(' +
                id +
              ')">' +
              '💾 Enregistrer le statut' +
            '</button>' +

          '</div>' +

        '</div>' +

      '</div>'
    );
  }


  /* ==============================
     MODIFIER LE STATUT
  ============================== */

  async function modifierStatut(id){

    const select =
      document.getElementById(
        "status-" + id
      );

    if(!select){
      return;
    }

    const nouveauStatut =
      select.value;


    const {
      error
    } =
      await supabaseClient
        .from("Orders")
        .update({
          status: nouveauStatut
        })
        .eq(
          "id",
          id
        );


    if(error){

      alert(
        "Erreur lors de la modification du statut : " +
        error.message
      );

      return;
    }


    alert(
      "Statut de la commande #" +
      id +
      " enregistré : " +
      nouveauStatut
    );


    await chargerCommandes();
  }


  /* ==============================
     VERIFICATION SESSION
  ============================== */

  async function verifierSession(){

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();


    if(
      !error &&
      data &&
      data.session
    ){

      afficherAdmin();

      await chargerCommandes();

    }else{

      afficherConnexion();
    }
  }


  /* ==============================
     AUTH STATE CHANGE
  ============================== */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if(
        event === "PASSWORD_RECOVERY"
      ){

        afficherNouveauMotDePasse();

        return;
      }


      if(
        session &&
        session.user
      ){

        afficherAdmin();

        await chargerCommandes();

      }else{

        afficherConnexion();
      }

    }
  );


  /* ==============================
     DEMARRAGE
  ============================== */

  verifierSession();

</script>

</body>
</html>
