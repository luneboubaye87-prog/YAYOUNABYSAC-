<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    .commande {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .commande p {
      margin: 7px 0;
    }

    .statut {
      padding: 10px;
      border-radius: 8px;
      width: 100%;
      margin-top: 10px;
      font-size: 16px;
    }

    .vide {
      text-align: center;
      padding: 30px;
    }

    .erreur {
      color: red;
      background: #ffe5e5;
      padding: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>👜 YAYOUNABYSAC</h1>
  <h2>📦 Commandes</h2>

  <div id="message">Chargement des commandes...</div>

  <div id="commandes"></div>

<script>

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function chargerCommandes() {

  const message = document.getElementById("message");
  const conteneur = document.getElementById("commandes");

  message.textContent = "Chargement des commandes...";

  const { data, error } = await supabaseClient
    .from("Orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    message.innerHTML =
      `<div class="erreur">
        Erreur Supabase : ${error.message}
      </div>`;

    return;
  }

  if (!data || data.length === 0) {

    message.innerHTML =
      `<div class="vide">
        Aucune commande pour le moment.
      </div>`;

    return;
  }

  message.textContent =
    data.length + " commande(s)";

  conteneur.innerHTML = "";

  data.forEach(commande => {

    const bloc = document.createElement("div");

    bloc.className = "commande";

    bloc.innerHTML = `

      <p><strong>👤 Client :</strong>
      ${commande.Customer_name || ""}</p>

      <p><strong>📞 Téléphone :</strong>
      ${commande.Phone || ""}</p>

      <p><strong>📍 Adresse :</strong>
      ${commande.Address || ""}</p>

      <p><strong>💰 Total :</strong>
      ${commande.Total || 0} FCFA</p>

      <p><strong>📅 Date :</strong>
      ${new Date(commande.created_at).toLocaleString("fr-FR")}</p>

      <p><strong>📌 Statut :</strong></p>

      <select class="statut"
              data-id="${commande.id}">

        <option value="Nouvelle"
          ${commande.Status === "Nouvelle" ? "selected" : ""}>
          Nouvelle
        </option>

        <option value="Confirmée"
          ${commande.Status === "Confirmée" ? "selected" : ""}>
          Confirmée
        </option>

        <option value="Expédiée"
          ${commande.Status === "Expédiée" ? "selected" : ""}>
          Expédiée
        </option>

        <option value="Livrée"
          ${commande.Status === "Livrée" ? "selected" : ""}>
          Livrée
        </option>

        <option value="Annulée"
          ${commande.Status === "Annulée" ? "selected" : ""}>
          Annulée
        </option>

      </select>
    `;

    conteneur.appendChild(bloc);
  });


  document.querySelectorAll(".statut").forEach(select => {

    select.addEventListener("change", async function() {

      const id = this.dataset.id;
      const nouveauStatut = this.value;

      const { error } = await supabaseClient
        .from("Orders")
        .update({
          Status: nouveauStatut
        })
        .eq("id", id);

      if (error) {

        alert(
          "Erreur lors de la modification : " +
          error.message
        );

      } else {

        alert("Statut mis à jour ✅");
      }

    });

  });

}


chargerCommandes();

</script>

</body>
</html>
