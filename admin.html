<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f7f3ef;
      color:#2d2926;
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    .container{
      width:100%;
      max-width:1100px;
      margin:0 auto;
      padding:20px;
    }

    header{
      background:#2d2926;
      color:white;
      padding:18px 20px;
      position:sticky;
      top:0;
      z-index:20;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }

    .header-inner{
      max-width:1100px;
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .logo{
      font-size:20px;
      font-weight:800;
      letter-spacing:.5px;
    }

    .header-right{
      display:flex;
      gap:8px;
    }

    .btn{
      border:0;
      border-radius:10px;
      padding:11px 15px;
      cursor:pointer;
      font-weight:700;
    }

    .btn-primary{
      background:#2d2926;
      color:white;
    }

    .btn-light{
      background:white;
      color:#2d2926;
      border:1px solid #ddd3cb;
    }

    .btn-danger{
      background:#b42318;
      color:white;
    }

    .btn-success{
      background:#26734d;
      color:white;
    }

    .page-title{
      margin:10px 0 20px;
      font-size:28px;
    }

    .box{
      background:white;
      border-radius:18px;
      padding:22px;
      margin-bottom:20px;
      box-shadow:0 4px 20px rgba(50,40,30,.07);
      border:1px solid #eee5de;
    }

    .box h2{
      margin-bottom:16px;
      font-size:20px;
    }

    .form-group{
      margin-bottom:14px;
    }

    .form-group label{
      display:block;
      margin-bottom:6px;
      font-weight:700;
      font-size:14px;
    }

    .form-group input,
    .form-group select{
      width:100%;
      padding:13px;
      border:1px solid #d8cec6;
      border-radius:10px;
      outline:none;
      background:white;
    }

    .form-group input:focus,
    .form-group select:focus{
      border-color:#2d2926;
    }

    .form-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:15px;
    }

    .message{
      margin-top:12px;
      padding:12px;
      border-radius:10px;
      display:none;
      font-size:14px;
      line-height:1.5;
    }

    .message.show{
      display:block;
    }

    .message.error{
      background:#fdecec;
      color:#a61b1b;
    }

    .message.success{
      background:#eaf7ef;
      color:#1e6b42;
    }

    .admin-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:20px;
    }

    .orders-list{
      display:grid;
      gap:18px;
    }

    .order-card{
      border:1px solid #e2d9d2;
      border-radius:16px;
      overflow:hidden;
      background:#fff;
    }

    .order-header{
      background:#f4eee9;
      padding:16px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:15px;
      flex-wrap:wrap;
    }

    .order-title{
      font-size:18px;
      font-weight:800;
    }

    .order-date{
      color:#766c65;
      font-size:13px;
      margin-top:5px;
    }

    .order-body{
      padding:16px;
    }

    .customer-info{
      display:grid;
      gap:7px;
      margin-bottom:18px;
      font-size:15px;
    }

    .customer-info strong{
      color:#2d2926;
    }

    .products-title{
      font-weight:800;
      margin-bottom:10px;
      font-size:16px;
    }

    .product-item{
      border:1px solid #e9e1db;
      border-radius:12px;
      padding:12px;
      margin-bottom:9px;
      background:#fcfaf8;
    }

    .product-main{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }

    .product-name{
      font-weight:800;
    }

    .product-details{
      color:#6f665f;
      font-size:13px;
      margin-top:5px;
      line-height:1.5;
    }

    .product-price{
      font-weight:800;
      white-space:nowrap;
    }

    .no-items{
      background:#fff6e5;
      border:1px solid #f1d59a;
      color:#805b17;
      border-radius:10px;
      padding:12px;
      font-size:14px;
      line-height:1.5;
    }

    .order-total{
      border-top:1px solid #e9e1db;
      margin-top:16px;
      padding-top:15px;
      display:flex;
      justify-content:space-between;
      font-size:18px;
      font-weight:800;
    }

    .status-box{
      margin-top:16px;
      padding-top:15px;
      border-top:1px solid #e9e1db;
    }

    .status-row{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .status-row select{
      flex:1;
      min-width:160px;
      padding:11px;
      border:1px solid #d8cec6;
      border-radius:10px;
      background:white;
    }

    .status-badge{
      display:inline-block;
      padding:6px 10px;
      border-radius:20px;
      font-size:12px;
      font-weight:800;
      background:#eee;
    }

    .loading{
      text-align:center;
      padding:30px;
      color:#756b64;
    }

    .empty{
      text-align:center;
      padding:35px 15px;
      color:#756b64;
    }

    .hidden{
      display:none !important;
    }

    .small{
      font-size:13px;
      color:#766c65;
    }

    @media(max-width:600px){
      .container{
        padding:12px;
      }

      header{
        padding:15px 12px;
      }

      .logo{
        font-size:17px;
      }

      .page-title{
        font-size:23px;
      }

      .box{
        padding:16px;
      }

      .order-header{
        padding:13px;
      }

      .order-body{
        padding:13px;
      }

      .product-main{
        flex-direction:column;
      }

      .product-price{
        white-space:normal;
      }

      .header-right .btn{
        padding:9px 11px;
        font-size:13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">YAYOUNABYSAC</div>

    <div class="header-right">
      <button
        id="actualiserBtn"
        class="btn btn-light hidden"
        onclick="chargerCommandes()">
        Actualiser
      </button>

      <button
        id="deconnexionBtn"
        class="btn btn-danger hidden"
        onclick="deconnexion()">
        Se déconnecter
      </button>
    </div>
  </div>
</header>

<main class="container">

  <!-- CONNEXION -->
  <section id="connexionBox" class="box">

    <h1 class="page-title">Connexion administrateur</h1>

    <div class="form-group">
      <label for="email">Adresse e-mail</label>
      <input
        type="email"
        id="email"
        placeholder="Votre adresse e-mail"
        autocomplete="email">
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input
        type="password"
        id="password"
        placeholder="Votre mot de passe"
        autocomplete="current-password">
    </div>

    <div class="form-actions">
      <button
        class="btn btn-primary"
        onclick="connexionAdmin()">
        Se connecter
      </button>

      <button
        class="btn btn-light"
        onclick="afficherRecuperation()">
        Mot de passe oublié ?
      </button>
    </div>

    <div id="connexionMessage" class="message"></div>

  </section>


  <!-- RECUPERATION -->
  <section id="recoveryBox" class="box hidden">

    <h2>Réinitialiser le mot de passe</h2>

    <p class="small" style="margin-bottom:15px;">
      Entrez votre adresse e-mail administrateur pour recevoir un lien de réinitialisation.
    </p>

    <div class="form-group">
      <label for="recoveryEmail">Adresse e-mail</label>
      <input
        type="email"
        id="recoveryEmail"
        placeholder="Votre adresse e-mail">
    </div>

    <div class="form-actions">
      <button
        class="btn btn-primary"
        onclick="envoyerRecuperation()">
        Envoyer le lien
      </button>

      <button
        class="btn btn-light"
        onclick="retourConnexion()">
        Retour
      </button>
    </div>

    <div id="recoveryMessage" class="message"></div>

  </section>


  <!-- NOUVEAU MOT DE PASSE -->
  <section id="newPasswordBox" class="box hidden">

    <h2>Nouveau mot de passe</h2>

    <div class="form-group">
      <label for="newPassword">Nouveau mot de passe</label>
      <input
        type="password"
        id="newPassword"
        placeholder="Nouveau mot de passe">
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirmer le mot de passe">
    </div>

    <div class="form-actions">
      <button
        class="btn btn-primary"
        onclick="changerMotDePasse()">
        Enregistrer le nouveau mot de passe
      </button>
    </div>

    <div id="newPasswordMessage" class="message"></div>

  </section>


  <!-- ADMIN -->
  <section id="adminBox" class="hidden">

    <div class="admin-top">
      <div>
        <h1 class="page-title" style="margin-bottom:5px;">
          📦 Commandes
        </h1>

        <div class="small">
          Gestion des commandes YAYOUNABYSAC
        </div>
      </div>

      <button
        class="btn btn-primary"
        onclick="chargerCommandes()">
        🔄 Actualiser
      </button>
    </div>

    <div id="commandesContainer" class="orders-list">
      <div class="loading">
        Chargement des commandes...
      </div>
    </div>

  </section>

</main>


<script>
  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL = "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_ANON_KEY =
    "REMPLACE_PAR_TA_CLE_ANON_SUPABASE";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const connexionBox = document.getElementById("connexionBox");
  const recoveryBox = document.getElementById("recoveryBox");
  const newPasswordBox = document.getElementById("newPasswordBox");
  const adminBox = document.getElementById("adminBox");

  const actualiserBtn = document.getElementById("actualiserBtn");
  const deconnexionBtn = document.getElementById("deconnexionBtn");

  const commandesContainer =
    document.getElementById("commandesContainer");


  /* =========================================================
     UTILITAIRES
  ========================================================= */

  function afficherMessage(id, texte, type = "success"){
    const element = document.getElementById(id);

    if(!element){
      return;
    }

    element.textContent = texte;
    element.className = "message show " + type;
  }


  function cacherMessages(){
    document.querySelectorAll(".message").forEach(function(element){
      element.className = "message";
      element.textContent = "";
    });
  }


  function formatPrix(prix){
    const nombre = Number(prix || 0);

    return nombre.toLocaleString("fr-FR") + " FCFA";
  }


  function formatDate(date){
    if(!date){
      return "";
    }

    try{
      return new Date(date).toLocaleString(
        "fr-FR",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );
    }catch(error){
      return date;
    }
  }


  function escapeHtml(value){
    if(value === null || value === undefined){
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function afficherEspaceAdmin(){
    connexionBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");

    adminBox.classList.remove("hidden");

    actualiserBtn.classList.remove("hidden");
    deconnexionBtn.classList.remove("hidden");
  }


  function afficherEspaceConnexion(){
    adminBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");

    connexionBox.classList.remove("hidden");

    actualiserBtn.classList.add("hidden");
    deconnexionBtn.classList.add("hidden");
  }


  /* =========================================================
     CONNEXION
  ========================================================= */

  async function connexionAdmin(){

    cacherMessages();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if(!email || !password){
      afficherMessage(
        "connexionMessage",
        "Veuillez remplir l'adresse e-mail et le mot de passe.",
        "error"
      );
      return;
    }

    try{

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if(error){
        throw error;
      }

      if(!data || !data.user){
        throw new Error("Connexion impossible.");
      }

      afficherEspaceAdmin();

      await chargerCommandes();

    }catch(error){

      console.error("Erreur connexion :", error);

      afficherMessage(
        "connexionMessage",
        "Erreur de connexion : " + (
          error.message || "identifiants incorrects."
        ),
        "error"
      );
    }
  }


  /* =========================================================
     DECONNEXION
  ========================================================= */

  async function deconnexion(){

    await supabaseClient.auth.signOut();

    afficherEspaceConnexion();

    document.getElementById("password").value = "";

    commandesContainer.innerHTML = "";
  }


  /* =========================================================
     RECUPERATION MOT DE PASSE
  ========================================================= */

  function afficherRecuperation(){

    cacherMessages();

    connexionBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");
    adminBox.classList.add("hidden");

    recoveryBox.classList.remove("hidden");

    actualiserBtn.classList.add("hidden");
    deconnexionBtn.classList.add("hidden");

    const email =
      document.getElementById("email").value.trim();

    if(email){
      document.getElementById("recoveryEmail").value = email;
    }
  }


  function retourConnexion(){

    cacherMessages();

    recoveryBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");
    adminBox.classList.add("hidden");

    connexionBox.classList.remove("hidden");
  }


  async function envoyerRecuperation(){

    cacherMessages();

    const email =
      document.getElementById("recoveryEmail").value.trim();

    if(!email){
      afficherMessage(
        "recoveryMessage",
        "Veuillez entrer votre adresse e-mail.",
        "error"
      );
      return;
    }

    try{

      const redirectUrl =
        window.location.origin +
        window.location.pathname;

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo: redirectUrl
          }
        );

      if(error){
        throw error;
      }

      afficherMessage(
        "recoveryMessage",
        "Le lien de réinitialisation a été envoyé à votre adresse e-mail.",
        "success"
      );

    }catch(error){

      console.error("Erreur récupération :", error);

      afficherMessage(
        "recoveryMessage",
        "Erreur : " + (
          error.message ||
          "Impossible d'envoyer le lien."
        ),
        "error"
      );
    }
  }


  /* =========================================================
     CHANGEMENT MOT DE PASSE
  ========================================================= */

  async function changerMotDePasse(){

    cacherMessages();

    const password =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    if(!password || !confirmPassword){

      afficherMessage(
        "newPasswordMessage",
        "Veuillez remplir les deux champs.",
        "error"
      );

      return;
    }

    if(password.length < 6){

      afficherMessage(
        "newPasswordMessage",
        "Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }

    if(password !== confirmPassword){

      afficherMessage(
        "newPasswordMessage",
        "Les deux mots de passe ne correspondent pas.",
        "error"
      );

      return;
    }

    try{

      const { error } =
        await supabaseClient.auth.updateUser({
          password: password
        });

      if(error){
        throw error;
      }

      afficherMessage(
        "newPasswordMessage",
        "Mot de passe modifié avec succès. Vous pouvez maintenant vous connecter.",
        "success"
      );

      document.getElementById("newPassword").value = "";
      document.getElementById("confirmPassword").value = "";

    }catch(error){

      console.error("Erreur changement mot de passe :", error);

      afficherMessage(
        "newPasswordMessage",
        "Erreur : " + (
          error.message ||
          "Impossible de modifier le mot de passe."
        ),
        "error"
      );
    }
  }


  /* =========================================================
     CHARGER COMMANDES
  ========================================================= */

  async function chargerCommandes(){

    commandesContainer.innerHTML =
      '<div class="loading">Chargement des commandes...</div>';

    try{

      const {
        data: sessionData
      } = await supabaseClient.auth.getSession();

      if(!sessionData || !sessionData.session){

        afficherEspaceConnexion();

        return;
      }


      /* -----------------------------------------------------
         1. RECUPERER LES COMMANDES
      ----------------------------------------------------- */

      const {
        data: commandes,
        error: commandesError
      } = await supabaseClient
        .from("Orders")
        .select("*")
        .order("id", {
          ascending:false
        });


      if(commandesError){
        throw commandesError;
      }


      if(!commandes || commandes.length === 0){

        commandesContainer.innerHTML =
          '<div class="box empty">Aucune commande pour le moment.</div>';

        return;
      }


      /* -----------------------------------------------------
         2. RECUPERER TOUS LES ARTICLES
         
         IMPORTANT :
         On ne fait PAS de relation Supabase automatique.
         On récupère directement Orders_items.
      ----------------------------------------------------- */

      const {
        data: items,
        error: itemsError
      } = await supabaseClient
        .from("Orders_items")
        .select("id, order_id, product_id, quantity, price")
        .order("id", {
          ascending:false
        });


      if(itemsError){

        console.error(
          "Erreur récupération Orders_items :",
          itemsError
        );

        throw new Error(
          "Impossible de récupérer Orders_items : " +
          itemsError.message
        );
      }


      /* -----------------------------------------------------
         3. RECUPERER LES PRODUITS
      ----------------------------------------------------- */

      const {
        data: produits,
        error: produitsError
      } = await supabaseClient
        .from("Products")
        .select("id, name, Price, Image_url, Stock, Category");


      if(produitsError){

        console.error(
          "Erreur récupération Products :",
          produitsError
        );

        throw new Error(
          "Impossible de récupérer Products : " +
          produitsError.message
        );
      }


      /* -----------------------------------------------------
         4. INDEX DES ARTICLES PAR ORDER_ID
      ----------------------------------------------------- */

      const itemsParCommande = {};

      (items || []).forEach(function(item){

        const orderId = String(item.order_id);

        if(!itemsParCommande[orderId]){
          itemsParCommande[orderId] = [];
        }

        itemsParCommande[orderId].push(item);
      });


      /* -----------------------------------------------------
         5. INDEX DES PRODUITS PAR ID
      ----------------------------------------------------- */

      const produitsParId = {};

      (produits || []).forEach(function(produit){

        produitsParId[String(produit.id)] = produit;
      });


      /* -----------------------------------------------------
         6. AFFICHAGE DES COMMANDES
      ----------------------------------------------------- */

      let html = "";

      commandes.forEach(function(commande){

        const orderId = String(commande.id);

        const articles =
          itemsParCommande[orderId] || [];


        html += `
          <article class="order-card">

            <div class="order-header">

              <div>
                <div class="order-title">
                  🧾 Commande #${escapeHtml(commande.id)}
                </div>

                <div class="order-date">
                  ${escapeHtml(formatDate(commande.created_at))}
                </div>
              </div>

              <div>
                <span class="status-badge">
                  ${escapeHtml(commande.Status || "En attente")}
                </span>
              </div>

            </div>


            <div class="order-body">

              <div class="customer-info">

                <div>
                  👤 <strong>Client :</strong>
                  ${escapeHtml(commande.customer_name || "-")}
                </div>

                <div>
                  📞 <strong>Téléphone :</strong>
                  ${escapeHtml(commande.Phone || commande.phone || "-")}
                </div>

                <div>
                  📍 <strong>Adresse :</strong>
                  ${escapeHtml(commande.Address || commande.address || "-")}
                </div>

              </div>


              <div class="products-title">
                🛍️ Produits commandés
              </div>
        `;


        /* ---------------------------------------------------
           ARTICLES DE LA COMMANDE
        --------------------------------------------------- */

        if(articles.length === 0){

          html += `
            <div class="no-items">
              Aucun article trouvé dans Orders_items pour cette commande.
            </div>
          `;

        }else{

          articles.forEach(function(item){

            const produit =
              produitsParId[String(item.product_id)];


            let nomProduit =
              produit && produit.name
                ? produit.name
                : "Produit #" + item.product_id;


            const quantity =
              Number(item.quantity || 0);

            const price =
              Number(item.price || 0);

            const sousTotal =
              quantity * price;


            html += `
              <div class="product-item">

                <div class="product-main">

                  <div>

                    <div class="product-name">
                      👜 ${escapeHtml(nomProduit)}
                    </div>

                    <div class="product-details">
                      Produit ID : ${escapeHtml(item.product_id)}
                      <br>
                      Quantité : ${escapeHtml(quantity)}
                      <br>
                      Prix unitaire : ${escapeHtml(formatPrix(price))}
                    </div>

                  </div>

                  <div class="product-price">
                    ${escapeHtml(formatPrix(sousTotal))}
                  </div>

                </div>

              </div>
            `;
          });
        }


        /* ---------------------------------------------------
           TOTAL
        --------------------------------------------------- */

        html += `
              <div class="order-total">
                <span>Total commande</span>
                <span>
                  ${escapeHtml(formatPrix(commande.Total || commande.total || 0))}
                </span>
              </div>


              <div class="status-box">

                <div class="small" style="margin-bottom:8px;">
                  Statut de la commande
                </div>

                <div class="status-row">

                  <select
                    id="status-${escapeHtml(commande.id)}">

                    <option
                      value="En attente"
                      ${(commande.Status === "En attente" || !commande.Status) ? "selected" : ""}>
                      En attente
                    </option>

                    <option
                      value="Confirmée"
                      ${commande.Status === "Confirmée" ? "selected" : ""}>
                      Confirmée
                    </option>

                    <option
                      value="En préparation"
                      ${commande.Status === "En préparation" ? "selected" : ""}>
                      En préparation
                    </option>

                    <option
                      value="Expédiée"
                      ${commande.Status === "Expédiée" ? "selected" : ""}>
                      Expédiée
                    </option>

                    <option
                      value="Livrée"
                      ${commande.Status === "Livrée" ? "selected" : ""}>
                      Livrée
                    </option>

                    <option
                      value="Annulée"
                      ${commande.Status === "Annulée" ? "selected" : ""}>
                      Annulée
                    </option>

                  </select>


                  <button
                    class="btn btn-success"
                    onclick="enregistrerStatut(${Number(commande.id)})">
                    Enregistrer le statut
                  </button>

                </div>

              </div>

            </div>

          </article>
        `;
      });


      commandesContainer.innerHTML = html;


    }catch(error){

      console.error(
        "Erreur chargement commandes :",
        error
      );

      commandesContainer.innerHTML = `
        <div class="box">
          <div class="message show error">
            Erreur lors du chargement des commandes :
            ${escapeHtml(error.message || error)}
          </div>
        </div>
      `;
    }
  }


  /* =========================================================
     ENREGISTRER STATUT
  ========================================================= */

  async function enregistrerStatut(orderId){

    const select =
      document.getElementById("status-" + orderId);

    if(!select){
      return;
    }

    const nouveauStatut =
      select.value;

    try{

      const { error } =
        await supabaseClient
          .from("Orders")
          .update({
            Status: nouveauStatut
          })
          .eq("id", orderId);


      if(error){
        throw error;
      }


      alert(
        "Le statut de la commande #" +
        orderId +
        " a été enregistré."
      );


      await chargerCommandes();


    }catch(error){

      console.error(
        "Erreur statut :",
        error
      );

      alert(
        "Erreur lors de l'enregistrement du statut : " +
        (error.message || error)
      );
    }
  }


  /* =========================================================
     SESSION SUPABASE
  ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    async function(event, session){

      console.log(
        "Auth event :",
        event
      );


      if(event === "PASSWORD_RECOVERY"){

        connexionBox.classList.add("hidden");
        recoveryBox.classList.add("hidden");
        adminBox.classList.add("hidden");

        newPasswordBox.classList.remove("hidden");

        actualiserBtn.classList.add("hidden");
        deconnexionBtn.classList.add("hidden");

        return;
      }


      if(session && session.user){

        afficherEspaceAdmin();

        await chargerCommandes();

      }else{

        afficherEspaceConnexion();
      }
    }
  );


  /* =========================================================
     VERIFICATION AU CHARGEMENT
  ========================================================= */

  async function verifierSession(){

    try{

      const {
        data
      } = await supabaseClient.auth.getSession();


      if(data && data.session){

        afficherEspaceAdmin();

        await chargerCommandes();

      }else{

        afficherEspaceConnexion();
      }

    }catch(error){

      console.error(
        "Erreur vérification session :",
        error
      );

      afficherEspaceConnexion();
    }
  }


  verifierSession();

</script>

</body>
</html>
