<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAYOUNABYSAC - Administration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  color: #222;
}

header {
  background: #111;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0 0 5px;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

h2 {
  margin-top: 30px;
}

h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 10px;
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 15px;
  cursor: pointer;
}

.btn-principal {
  width: 100%;
  background: #111;
  color: white;
  margin-top: 8px;
}

.btn-secondaire {
  background: #555;
  color: white;
}

.btn-modifier {
  background: #2563eb;
  color: white;
  margin-right: 5px;
}

.btn-supprimer {
  background: #dc2626;
  color: white;
}

.stats {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.stat {
  flex: 1;
  min-width: 180px;
  background: white;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.stat strong {
  display: block;
  font-size: 24px;
  margin-top: 8px;
}

.produit {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
}

.produit img {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 8px;
  display: block;
  margin-bottom: 12px;
}

.commande {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-top: 15px;
}

.ligne-produit {
  background: #f5f5f5;
  padding: 8px;
  border-radius: 6px;
  margin-top: 6px;
}

.message {
  display: none;
  padding: 12px;
  margin-bottom: 15px;
  border-radius: 8px;
}

.message.succes {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.message.erreur {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

#chargement {
  color: #555;
}
</style>
</head>

<body>

<header>
  <h1>YAYOUNABYSAC</h1>
  <div>Administration</div>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <!-- STATISTIQUES -->

  <div class="stats">

    <div class="stat">
      Commandes
      <strong id="nombreCommandes">0</strong>
    </div>

    <div class="stat">
      Total
      <strong id="totalCommandes">0 FCFA</strong>
    </div>

    <div class="stat">
      Produits
      <strong id="nombreProduits">0</strong>
    </div>

  </div>


  <!-- ========================= -->
  <!-- GESTION DES PRODUITS -->
  <!-- ========================= -->

  <h2>🛍️ Gestion des produits</h2>

  <div class="card">

    <h3 id="titreFormulaire">
      ➕ Ajouter un produit
    </h3>

    <input
      type="hidden"
      id="produitId"
    >

    <label for="nomProduit">
      Nom du produit
    </label>

    <input
      type="text"
      id="nomProduit"
      placeholder="Ex : Sac bandoulière"
    >


    <label for="descriptionProduit">
      Description
    </label>

    <textarea
      id="descriptionProduit"
      placeholder="Description du produit"
    ></textarea>


    <label for="prixProduit">
      Prix en FCFA
    </label>

    <input
      type="number"
      id="prixProduit"
      placeholder="18000"
    >


    <label for="stockProduit">
      Stock
    </label>

    <input
      type="number"
      id="stockProduit"
      placeholder="5"
    >


    <label for="categorieProduit">
      Catégorie
    </label>

    <input
      type="text"
      id="categorieProduit"
      placeholder="Sacs à main"
    >


    <label for="imageProduit">
      URL de l'image
    </label>

    <input
      type="url"
      id="imageProduit"
      placeholder="https://..."
    >


    <button
      type="button"
      class="btn-principal"
      id="boutonProduit"
    >
      Ajouter le produit
    </button>


    <button
      type="button"
      class="btn-secondaire"
      id="boutonAnnuler"
      style="display:none; width:100%; margin-top:8px;"
    >
      Annuler la modification
    </button>

  </div>


  <!-- LISTE DES PRODUITS -->

  <div class="card">

    <h3>📋 Produits existants</h3>

    <button
      type="button"
      class="btn-secondaire"
      id="boutonActualiserProduits"
    >
      🔄 Actualiser les produits
    </button>

    <div id="listeProduits">
      Chargement des produits...
    </div>

  </div>


  <!-- ========================= -->
  <!-- COMMANDES -->
  <!-- ========================= -->

  <h2>📦 Commandes</h2>

  <div class="card">

    <button
      type="button"
      class="btn-secondaire"
      id="boutonActualiserCommandes"
    >
      🔄 Actualiser les commandes
    </button>

    <div id="listeCommandes">
      Chargement des commandes...
    </div>

  </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   MESSAGE
========================================== */

function afficherMessage(texte, type) {

  const message =
    document.getElementById("message");

  message.textContent = texte;

  message.className =
    "message " + type;

  setTimeout(function() {

    message.className = "message";

    message.textContent = "";

  }, 5000);
}


/* ==========================================
   CHARGER PRODUITS
========================================== */

async function chargerProduits() {

  const liste =
    document.getElementById("listeProduits");

  liste.innerHTML =
    "Chargement des produits...";


  const resultat =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (resultat.error) {

    liste.innerHTML =
      "<p>Erreur : " +
      resultat.error.message +
      "</p>";

    return;
  }


  const produits =
    resultat.data || [];


  document.getElementById(
    "nombreProduits"
  ).textContent = produits.length;


  if (produits.length === 0) {

    liste.innerHTML =
      "<p>Aucun produit pour le moment.</p>";

    return;
  }


  liste.innerHTML = "";


  produits.forEach(function(produit) {

    const bloc =
      document.createElement("div");

    bloc.className = "produit";


    let imageHTML = "";

    if (produit.image_url) {

      imageHTML =
        '<img src="' +
        produit.image_url +
        '" alt="Produit">';

    }


    bloc.innerHTML =

      imageHTML +

      "<h3>" +
      (produit.name || "") +
      "</h3>" +

      "<p>" +
      (produit.description || "") +
      "</p>" +

      "<p><strong>Prix :</strong> " +
      Number(produit.price || 0)
        .toLocaleString("fr-FR") +
      " FCFA</p>" +

      "<p><strong>Stock :</strong> " +
      (produit.stock ?? 0) +
      "</p>" +

      "<p><strong>Catégorie :</strong> " +
      (produit.category || "") +
      "</p>";


    const boutonModifier =
      document.createElement("button");

    boutonModifier.type = "button";

    boutonModifier.className =
      "btn-modifier";

    boutonModifier.textContent =
      "✏️ Modifier";


    boutonModifier.addEventListener(
      "click",
      function() {

        modifierProduit(produit.id);

      }
    );


    const boutonSupprimer =
      document.createElement("button");

    boutonSupprimer.type = "button";

    boutonSupprimer.className =
      "btn-supprimer";

    boutonSupprimer.textContent =
      "🗑️ Supprimer";


    boutonSupprimer.addEventListener(
      "click",
      function() {

        supprimerProduit(produit.id);

      }
    );


    bloc.appendChild(
      boutonModifier
    );

    bloc.appendChild(
      boutonSupprimer
    );


    liste.appendChild(bloc);

  });

}


/* ==========================================
   AJOUTER OU MODIFIER PRODUIT
========================================== */

async function enregistrerProduit() {

  afficherMessage(
    "Enregistrement du produit...",
    "succes"
  );


  const id =
    document.getElementById(
      "produitId"
    ).value;


  const nom =
    document.getElementById(
      "nomProduit"
    ).value.trim();


  const description =
    document.getElementById(
      "descriptionProduit"
    ).value.trim();


  const prix =
    Number(
      document.getElementById(
        "prixProduit"
      ).value
    );


  const stock =
    Number(
      document.getElementById(
        "stockProduit"
      ).value
    );


  const categorie =
    document.getElementById(
      "categorieProduit"
    ).value.trim();


  const image =
    document.getElementById(
      "imageProduit"
    ).value.trim();


  /* Vérification */

  if (!nom) {

    afficherMessage(
      "Veuillez entrer le nom du produit.",
      "erreur"
    );

    return;
  }


  if (prix < 0 || isNaN(prix)) {

    afficherMessage(
      "Veuillez entrer un prix valide.",
      "erreur"
    );

    return;
  }


  if (stock < 0 || isNaN(stock)) {

    afficherMessage(
      "Veuillez entrer un stock valide.",
      "erreur"
    );

    return;
  }


  const produit = {

    name: nom,

    description: description,

    price: prix,

    stock: stock,

    category: categorie,

    image_url: image || null

  };


  let resultat;


  /* MODIFICATION */

  if (id) {

    resultat =
      await supabaseClient
        .from("Products")
        .update(produit)
        .eq("id", id);

  }

  /* AJOUT */

  else {

    resultat =
      await supabaseClient
        .from("Products")
        .insert([produit]);

  }


  if (resultat.error) {

    afficherMessage(
      "Erreur Supabase : " +
      resultat.error.message,
      "erreur"
    );

    return;
  }


  if (id) {

    afficherMessage(
      "Produit modifié avec succès ✅",
      "succes"
    );

  } else {

    afficherMessage(
      "Produit ajouté avec succès ✅",
      "succes"
    );

  }


  viderFormulaire();

  await chargerProduits();

}


/* ==========================================
   MODIFIER PRODUIT
========================================== */

async function modifierProduit(id) {

  const resultat =
    await supabaseClient
      .from("Products")
      .select("*")
      .eq("id", id)
      .single();


  if (resultat.error) {

    afficherMessage(
      "Erreur : " +
      resultat.error.message,
      "erreur"
    );

    return;
  }


  const produit =
    resultat.data;


  document.getElementById(
    "produitId"
  ).value = produit.id;


  document.getElementById(
    "nomProduit"
  ).value =
    produit.name || "";


  document.getElementById(
    "descriptionProduit"
  ).value =
    produit.description || "";


  document.getElementById(
    "prixProduit"
  ).value =
    produit.price || "";


  document.getElementById(
    "stockProduit"
  ).value =
    produit.stock ?? "";


  document.getElementById(
    "categorieProduit"
  ).value =
    produit.category || "";


  document.getElementById(
    "imageProduit"
  ).value =
    produit.image_url || "";


  document.getElementById(
    "titreFormulaire"
  ).textContent =
    "✏️ Modifier le produit";


  document.getElementById(
    "boutonProduit"
  ).textContent =
    "Enregistrer les modifications";


  document.getElementById(
    "boutonAnnuler"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==========================================
   ANNULER MODIFICATION
========================================== */

function viderFormulaire() {

  document.getElementById(
    "produitId"
  ).value = "";


  document.getElementById(
    "nomProduit"
  ).value = "";


  document.getElementById(
    "descriptionProduit"
  ).value = "";


  document.getElementById(
    "prixProduit"
  ).value = "";


  document.getElementById(
    "stockProduit"
  ).value = "";


  document.getElementById(
    "categorieProduit"
  ).value = "";


  document.getElementById(
    "imageProduit"
  ).value = "";


  document.getElementById(
    "titreFormulaire"
  ).textContent =
    "➕ Ajouter un produit";


  document.getElementById(
    "boutonProduit"
  ).textContent =
    "Ajouter le produit";


  document.getElementById(
    "boutonAnnuler"
  ).style.display =
    "none";

}


document.getElementById(
  "boutonAnnuler"
).addEventListener(
  "click",
  viderFormulaire
);


/* ==========================================
   SUPPRIMER PRODUIT
========================================== */

async function supprimerProduit(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer ce produit ?"
    );


  if (!confirmation) {

    return;

  }


  const resultat =
    await supabaseClient
      .from("Products")
      .delete()
      .eq("id", id);


  if (resultat.error) {

    afficherMessage(
      "Erreur Supabase : " +
      resultat.error.message,
      "erreur"
    );

    return;
  }


  afficherMessage(
    "Produit supprimé avec succès ✅",
    "succes"
  );


  await chargerProduits();

}


/* ==========================================
   COMMANDES
========================================== */

async function chargerCommandes() {

  const liste =
    document.getElementById(
      "listeCommandes"
    );


  liste.innerHTML =
    "Chargement des commandes...";


  const resultat =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (resultat.error) {

    liste.innerHTML =
      "<p>Erreur : " +
      resultat.error.message +
      "</p>";

    return;
  }


  const commandes =
    resultat.data || [];


  document.getElementById(
    "nombreCommandes"
  ).textContent =
    commandes.length;


  let totalGeneral = 0;


  if (commandes.length === 0) {

    liste.innerHTML =
      "<p>Aucune commande pour le moment.</p>";

    document.getElementById(
      "totalCommandes"
    ).textContent =
      "0 FCFA";

    return;
  }


  liste.innerHTML = "";


  for (
    const commande of commandes
  ) {

    totalGeneral +=
      Number(
        commande.total || 0
      );


    const bloc =
      document.createElement("div");

    bloc.className =
      "commande";


    const date =
      commande.created_at
      ? new Date(
          commande.created_at
        ).toLocaleString("fr-FR")
      : "";


    bloc.innerHTML =

      "<h3>Commande #" +
      commande.id +
      "</h3>" +

      "<p><strong>Date :</strong> " +
      date +
      "</p>" +

      "<p><strong>Client :</strong> " +
      (commande.customer_nam || "") +
      "</p>" +

      "<p><strong>Téléphone :</strong> " +
      (commande.phone || "") +
      "</p>" +

      "<p><strong>Adresse :</strong> " +
      (commande.address || "") +
      "</p>" +

      "<p><strong>Total :</strong> " +
      Number(
        commande.total || 0
      ).toLocaleString("fr-FR") +
      " FCFA</p>" +

      "<label>Statut :</label>";


    const select =
      document.createElement("select");


    const statuts = [
      "Nouvelle",
      "Confirmée",
      "Expédiée",
      "Livrée",
      "Annulée"
    ];


    statuts.forEach(
      function(statut) {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          statut;

        option.textContent =
          statut;

        if (
          commande.status === statut
        ) {

          option.selected = true;

        }

        select.appendChild(
          option
        );

      }
    );


    select.addEventListener(
      "change",
      async function() {

        const nouveauStatut =
          this.value;


        const resultat =
          await supabaseClient
            .from("Orders")
            .update({
              status: nouveauStatut
            })
            .eq("id", commande.id);


        if (resultat.error) {

          alert(
            "Erreur : " +
            resultat.error.message
          );

          return;
        }


        alert(
          "Statut modifié avec succès ✅"
        );

      }
    );


    bloc.appendChild(select);


    const produitsZone =
      document.createElement(
        "div"
      );


    produitsZone.style.marginTop =
      "15px";


    produitsZone.innerHTML =
      "Chargement des produits...";


    bloc.appendChild(
      produitsZone
    );


    liste.appendChild(
      bloc
    );


    chargerProduitsCommande(
      commande.id,
      produitsZone
    );

  }


  document.getElementById(
    "totalCommandes"
  ).textContent =
    totalGeneral.toLocaleString(
      "fr-FR"
    ) +
    " FCFA";

}


/* ==========================================
   PRODUITS D'UNE COMMANDE
========================================== */

async function chargerProduitsCommande(
  orderId,
  zone
) {

  const resultat =
    await supabaseClient
      .from("Orders_items")
      .select("*")
      .eq("order_id", orderId);


  if (resultat.error) {

    zone.innerHTML =
      "Erreur : " +
      resultat.error.message;

    return;
  }


  const lignes =
    resultat.data || [];


  if (lignes.length === 0) {

    zone.innerHTML =
      "<p>Aucun produit.</p>";

    return;
  }


  zone.innerHTML =
    "<strong>Produits :</strong>";


  for (
    const ligne of lignes
  ) {

    const produitResultat =
      await supabaseClient
        .from("Products")
        .select("name")
        .eq(
          "id",
          ligne.product_id
        )
        .single();


    const nom =
      produitResultat.data
      ? produitResultat.data.name
      : "Produit";


    const sousTotal =
      Number(ligne.price || 0) *
      Number(ligne.quantity || 0);


    const ligneDiv =
      document.createElement(
        "div"
      );


    ligneDiv.className =
      "ligne-produit";


    ligneDiv.textContent =
      nom +
      " × " +
      ligne.quantity +
      " — " +
      sousTotal.toLocaleString(
        "fr-FR"
      ) +
      " FCFA";


    zone.appendChild(
      ligneDiv
    );

  }

}


/* ==========================================
   BOUTONS
========================================== */

document.getElementById(
  "boutonProduit"
).addEventListener(
  "click",
  function() {

    enregistrerProduit();

  }
);


document.getElementById(
  "boutonActualiserProduits"
).addEventListener(
  "click",
  function() {

    chargerProduits();

  }
);


document.getElementById(
  "boutonActualiserCommandes"
).addEventListener(
  "click",
  function() {

    chargerCommandes();

  }
);


/* ==========================================
   DEMARRAGE
========================================== */

chargerProduits();

chargerCommandes();

</script>

</body>
</html>
