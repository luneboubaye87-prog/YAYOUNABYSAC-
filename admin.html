<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0 0 6px;
    }

    header p {
      margin: 0;
      opacity: 0.8;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 15px;
    }

    .message {
      display: none;
      padding: 14px;
      margin-bottom: 15px;
      border-radius: 10px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      white-space: pre-line;
    }

    .section {
      background: white;
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .section h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-main {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 15px;
    }

    .btn-cancel {
      width: 100%;
      background: #777;
      color: white;
      margin-top: 8px;
    }

    .btn-edit {
      background: #2563eb;
      color: white;
      margin-top: 10px;
      margin-right: 5px;
    }

    .btn-delete {
      background: #dc2626;
      color: white;
      margin-top: 10px;
    }

    .btn-refresh {
      background: #111;
      color: white;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 15px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .product img {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin-bottom: 10px;
    }

    .order {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .order-product {
      background: #f5f5f5;
      padding: 9px;
      border-radius: 7px;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>👜 YAYOUNABYSAC</h1>
  <p>Administration</p>
</header>

<div class="container">

  <div id="message" class="message"></div>


  <!-- ============================= -->
  <!-- STATISTIQUES -->
  <!-- ============================= -->

  <div class="stats">

    <div class="stat">
      Commandes
      <strong id="nombreCommandes">0</strong>
    </div>

    <div class="stat">
      Total
      <strong id="totalCommandes">0 FCFA</strong>
    </div>

    <div class="stat">
      Produits
      <strong id="nombreProduits">0</strong>
    </div>

  </div>


  <!-- ============================= -->
  <!-- AJOUTER / MODIFIER PRODUIT -->
  <!-- ============================= -->

  <div class="section">

    <h2 id="titreProduit">
      ➕ Ajouter un produit
    </h2>

    <input
      type="hidden"
      id="produitId"
      value=""
    >

    <label>
      Nom du produit
    </label>

    <input
      type="text"
      id="nomProduit"
      placeholder="Exemple : Sac bandoulière"
    >


    <label>
      Description
    </label>

    <textarea
      id="descriptionProduit"
      placeholder="Description du produit"
    ></textarea>


    <label>
      Prix en FCFA
    </label>

    <input
      type="number"
      id="prixProduit"
      placeholder="18000"
    >


    <label>
      Stock
    </label>

    <input
      type="number"
      id="stockProduit"
      placeholder="5"
    >


    <label>
      Catégorie
    </label>

    <input
      type="text"
      id="categorieProduit"
      placeholder="Sacs à main"
    >


    <label>
      URL de l'image
    </label>

    <input
      type="text"
      id="imageProduit"
      placeholder="https://..."
    >


    <button
      type="button"
      class="btn-main"
      onclick="enregistrerProduit()"
    >
      ➕ Ajouter le produit
    </button>


    <button
      type="button"
      id="annulerModification"
      class="btn-cancel"
      onclick="annulerModification()"
      style="display:none;"
    >
      Annuler la modification
    </button>

  </div>


  <!-- ============================= -->
  <!-- LISTE PRODUITS -->
  <!-- ============================= -->

  <div class="section">

    <h2>🛍️ Produits</h2>

    <button
      type="button"
      class="btn-refresh"
      onclick="chargerProduits()"
    >
      🔄 Actualiser les produits
    </button>

    <div id="listeProduits">
      Chargement...
    </div>

  </div>


  <!-- ============================= -->
  <!-- COMMANDES -->
  <!-- ============================= -->

  <div class="section">

    <h2>📦 Commandes</h2>

    <button
      type="button"
      class="btn-refresh"
      onclick="chargerCommandes()"
    >
      🔄 Actualiser les commandes
    </button>

    <div id="listeCommandes">
      Chargement...
    </div>

  </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   MESSAGE
========================================== */

function afficherMessage(texte, type) {

  const message =
    document.getElementById("message");

  message.textContent = texte;

  message.className =
    "message " + type;

}


/* ==========================================
   VIDER FORMULAIRE
========================================== */

function viderFormulaire() {

  document.getElementById("produitId").value = "";

  document.getElementById("nomProduit").value = "";

  document.getElementById("descriptionProduit").value = "";

  document.getElementById("prixProduit").value = "";

  document.getElementById("stockProduit").value = "";

  document.getElementById("categorieProduit").value = "";

  document.getElementById("imageProduit").value = "";

  document.getElementById("titreProduit").textContent =
    "➕ Ajouter un produit";

  document.querySelector(".btn-main").textContent =
    "➕ Ajouter le produit";

  document.getElementById(
    "annulerModification"
  ).style.display = "none";

}


/* ==========================================
   ANNULER MODIFICATION
========================================== */

function annulerModification() {

  viderFormulaire();

}


/* ==========================================
   ENREGISTRER PRODUIT
========================================== */

async function enregistrerProduit() {

  const id =
    document.getElementById("produitId").value.trim();

  const nom =
    document.getElementById("nomProduit").value.trim();

  const description =
    document.getElementById("descriptionProduit").value.trim();

  const prix =
    Number(
      document.getElementById("prixProduit").value
    );

  const stock =
    Number(
      document.getElementById("stockProduit").value
    );

  const categorie =
    document.getElementById("categorieProduit").value.trim();

  const image =
    document.getElementById("imageProduit").value.trim();


  /* Vérification du nom */

  if (!nom) {

    afficherMessage(
      "Veuillez entrer le nom du produit.",
      "error"
    );

    return;
  }


  /* Vérification du prix */

  if (isNaN(prix) || prix < 0) {

    afficherMessage(
      "Veuillez entrer un prix valide.",
      "error"
    );

    return;
  }


  /* Vérification du stock */

  if (isNaN(stock) || stock < 0) {

    afficherMessage(
      "Veuillez entrer un stock valide.",
      "error"
    );

    return;
  }


  afficherMessage(
    "Enregistrement en cours...",
    "success"
  );


  const produit = {

    name: nom,

    description: description,

    price: prix,

    stock: stock,

    category: categorie,

    image_url: image || null

  };


  let resultat;


  /* =====================================
     MODIFICATION
  ===================================== */

  if (id) {

    resultat =
      await supabaseClient
        .from("Products")
        .update(produit)
        .eq("id", id);

  }


  /* =====================================
     AJOUT
  ===================================== */

  else {

    resultat =
      await supabaseClient
        .from("Products")
        .insert([produit]);

  }


  /* =====================================
     ERREUR
  ===================================== */

  if (resultat.error) {

    console.error(
      "Erreur produit :",
      resultat.error
    );

    afficherMessage(
      "ERREUR SUPABASE :\n\n" +
      resultat.error.message +
      "\n\nCode : " +
      (resultat.error.code || "inconnu"),
      "error"
    );

    return;
  }


  /* =====================================
     SUCCÈS
  ===================================== */

  if (id) {

    afficherMessage(
      "✅ Produit modifié avec succès.",
      "success"
    );

  } else {

    afficherMessage(
      "✅ Produit ajouté avec succès.",
      "success"
    );

  }


  viderFormulaire();

  await chargerProduits();

}


/* ==========================================
   CHARGER PRODUITS
========================================== */

async function chargerProduits() {

  const liste =
    document.getElementById("listeProduits");

  liste.innerHTML =
    "Chargement des produits...";


  const resultat =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (resultat.error) {

    liste.innerHTML =
      "<p>Erreur Supabase : " +
      resultat.error.message +
      "</p>";

    return;
  }


  const produits =
    resultat.data || [];


  document.getElementById(
    "nombreProduits"
  ).textContent =
    produits.length;


  if (produits.length === 0) {

    liste.innerHTML =
      "<p>Aucun produit.</p>";

    return;
  }


  liste.innerHTML = "";


  produits.forEach(function(produit) {

    const bloc =
      document.createElement("div");

    bloc.className =
      "product";


    let image = "";

    if (produit.image_url) {

      image =
        '<img src="' +
        produit.image_url +
        '" alt="Produit">';

    }


    bloc.innerHTML =

      image +

      "<h3>" +
      (produit.name || "Produit") +
      "</h3>" +

      "<p>" +
      (produit.description || "") +
      "</p>" +

      "<p><strong>Prix :</strong> " +
      Number(produit.price || 0)
        .toLocaleString("fr-FR") +
      " FCFA</p>" +

      "<p><strong>Stock :</strong> " +
      (produit.stock ?? 0) +
      "</p>" +

      "<p><strong>Catégorie :</strong> " +
      (produit.category || "") +
      "</p>";


    const modifier =
      document.createElement("button");

    modifier.type = "button";

    modifier.className =
      "btn-edit";

    modifier.textContent =
      "✏️ Modifier";


    modifier.onclick =
      function() {

        modifierProduit(
          produit.id
        );

      };


    const supprimer =
      document.createElement("button");

    supprimer.type = "button";

    supprimer.className =
      "btn-delete";

    supprimer.textContent =
      "🗑️ Supprimer";


    supprimer.onclick =
      function() {

        supprimerProduit(
          produit.id
        );

      };


    bloc.appendChild(modifier);

    bloc.appendChild(supprimer);

    liste.appendChild(bloc);

  });

}


/* ==========================================
   MODIFIER PRODUIT
========================================== */

async function modifierProduit(id) {

  const resultat =
    await supabaseClient
      .from("Products")
      .select("*")
      .eq("id", id)
      .single();


  if (resultat.error) {

    afficherMessage(
      "Erreur : " +
      resultat.error.message,
      "error"
    );

    return;
  }


  const produit =
    resultat.data;


  document.getElementById(
    "produitId"
  ).value =
    produit.id;


  document.getElementById(
    "nomProduit"
  ).value =
    produit.name || "";


  document.getElementById(
    "descriptionProduit"
  ).value =
    produit.description || "";


  document.getElementById(
    "prixProduit"
  ).value =
    produit.price || "";


  document.getElementById(
    "stockProduit"
  ).value =
    produit.stock ?? "";


  document.getElementById(
    "categorieProduit"
  ).value =
    produit.category || "";


  document.getElementById(
    "imageProduit"
  ).value =
    produit.image_url || "";


  document.getElementById(
    "titreProduit"
  ).textContent =
    "✏️ Modifier le produit";


  document.querySelector(
    ".btn-main"
  ).textContent =
    "💾 Enregistrer les modifications";


  document.getElementById(
    "annulerModification"
  ).style.display =
    "block";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* ==========================================
   SUPPRIMER PRODUIT
========================================== */

async function supprimerProduit(id) {

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer ce produit ?"
    );


  if (!confirmation) {

    return;

  }


  const resultat =
    await supabaseClient
      .from("Products")
      .delete()
      .eq("id", id);


  if (resultat.error) {

    afficherMessage(
      "ERREUR SUPABASE :\n\n" +
      resultat.error.message +
      "\n\nCode : " +
      (resultat.error.code || "inconnu"),
      "error"
    );

    return;
  }


  afficherMessage(
    "✅ Produit supprimé.",
    "success"
  );


  await chargerProduits();

}


/* ==========================================
   CHARGER COMMANDES
========================================== */

async function chargerCommandes() {

  const liste =
    document.getElementById(
      "listeCommandes"
    );

  liste.innerHTML =
    "Chargement des commandes...";


  const resultat =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("created_at", {
        ascending: false
      });


  if (resultat.error) {

    liste.innerHTML =
      "<p>Erreur Supabase : " +
      resultat.error.message +
      "</p>";

    return;
  }


  const commandes =
    resultat.data || [];


  document.getElementById(
    "nombreCommandes"
  ).textContent =
    commandes.length;


  let totalGeneral = 0;


  commandes.forEach(function(commande) {

    totalGeneral +=
      Number(
        commande.total || 0
      );

  });


  document.getElementById(
    "totalCommandes"
  ).textContent =
    totalGeneral.toLocaleString(
      "fr-FR"
    ) +
    " FCFA";


  if (commandes.length === 0) {

    liste.innerHTML =
      "<p>Aucune commande.</p>";

    return;
  }


  liste.innerHTML = "";


  for (
    const commande of commandes
  ) {

    const bloc =
      document.createElement("div");

    bloc.className =
      "order";


    const date =
      commande.created_at
      ? new Date(
          commande.created_at
        ).toLocaleString("fr-FR")
      : "";


    bloc.innerHTML =

      "<h3>📦 Commande #" +
      commande.id +
      "</h3>" +

      "<p><strong>Client :</strong> " +
      (commande.customer_nam || "") +
      "</p>" +

      "<p><strong>📞 Téléphone :</strong> " +
      (commande.phone || "") +
      "</p>" +

      "<p><strong>📍 Adresse :</strong> " +
      (commande.address || "") +
      "</p>" +

      "<p><strong>💰 Total :</strong> " +
      Number(
        commande.total || 0
      ).toLocaleString("fr-FR") +
      " FCFA</p>" +

      "<p><strong>📅 Date :</strong> " +
      date +
      "</p>" +

      "<p><strong>📌 Statut :</strong></p>";


    const select =
      document.createElement("select");


    const statuts = [
      "Nouvelle",
      "Confirmée",
      "Expédiée",
      "Livrée",
      "Annulée"
    ];


    statuts.forEach(function(statut) {

      const option =
        document.createElement("option");

      option.value =
        statut;

      option.textContent =
        statut;

      if (
        commande.status === statut
      ) {

        option.selected =
          true;

      }

      select.appendChild(option);

    });


    select.onchange =
      async function() {

        const resultat =
          await supabaseClient
            .from("Orders")
            .update({
              status: this.value
            })
            .eq("id", commande.id);


        if (resultat.error) {

          alert(
            "Erreur : " +
            resultat.error.message
          );

          return;
        }


        alert(
          "✅ Statut modifié."
        );

      };


    bloc.appendChild(select);


    const produitsZone =
      document.createElement("div");

    produitsZone.style.marginTop =
      "15px";

    produitsZone.innerHTML =
      "<strong>🛍️ Produits :</strong>";


    bloc.appendChild(
      produitsZone
    );


    liste.appendChild(
      bloc
    );


    chargerProduitsCommande(
      commande.id,
      produitsZone
    );

  }

}


/* ==========================================
   PRODUITS D'UNE COMMANDE
========================================== */

async function chargerProduitsCommande(
  orderId,
  zone
) {

  const resultat =
    await supabaseClient
      .from("Orders_items")
      .select("*")
      .eq("order_id", orderId);


  if (resultat.error) {

    zone.innerHTML +=
      "<p>Erreur : " +
      resultat.error.message +
      "</p>";

    return;
  }


  const lignes =
    resultat.data || [];


  if (lignes.length === 0) {

    zone.innerHTML +=
      "<p>Aucun produit.</p>";

    return;
  }


  for (
    const ligne of lignes
  ) {

    const produitResultat =
      await supabaseClient
        .from("Products")
        .select("name")
        .eq(
          "id",
          ligne.product_id
        )
        .maybeSingle();


    const nom =
      produitResultat.data
      ? produitResultat.data.name
      : "Produit #" +
        ligne.product_id;


    const prix =
      Number(ligne.price || 0);


    const quantite =
      Number(ligne.quantity || 0);


    const sousTotal =
      prix * quantite;


    const ligneDiv =
      document.createElement("div");


    ligneDiv.className =
      "order-product";


    ligneDiv.textContent =
      nom +
      " × " +
      quantite +
      " = " +
      sousTotal.toLocaleString(
        "fr-FR"
      ) +
      " FCFA";


    zone.appendChild(
      ligneDiv
    );

  }

}


/* ==========================================
   DEMARRAGE
========================================== */

chargerProduits();

chargerCommandes();

</script>

</body>
</html>
