  <style>

<body>

<header>
  <h1>YAYOUNABYSAC</h1>
  <p>Administration des commandes</p>
</header>

<div class="container">

  <!-- CONNEXION -->
  <div id="connexionBox" class="box">
    <h2>Connexion administrateur</h2>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Votre email">

    <label for="password">Mot de passe</label>
    <input type="password" id="password" placeholder="Votre mot de passe">

    <button class="btn-principal" onclick="connexionAdmin()">
      Se connecter
    </button>

    <button class="btn-secondaire" onclick="afficherRecuperation()">
      Mot de passe oublié ?
    </button>

    <div id="messageConnexion" class="message"></div>
  </div>

  <!-- RECUPERATION -->
  <div id="recoveryBox" class="box hidden">
    <h2>Réinitialiser le mot de passe</h2>

    <label for="recoveryEmail">Email administrateur</label>
    <input type="email" id="recoveryEmail" placeholder="Votre email">

    <button class="btn-principal" onclick="envoyerRecuperation()">
      Envoyer le lien
    </button>

    <button class="btn-secondaire" onclick="retourConnexion()">
      Retour
    </button>

    <div id="messageRecovery" class="message"></div>
  </div>

  <!-- NOUVEAU MOT DE PASSE -->
  <div id="newPasswordBox" class="box hidden">
    <h2>Nouveau mot de passe</h2>

    <label for="newPassword">Nouveau mot de passe</label>
    <input type="password" id="newPassword" placeholder="Nouveau mot de passe">

    <button class="btn-principal" onclick="changerMotDePasse()">
      Enregistrer le nouveau mot de passe
    </button>

    <div id="messageNewPassword" class="message"></div>
  </div>

  <!-- ADMIN -->
  <div id="adminBox" class="hidden">

    <div class="box">
      <div class="top-actions">
        <div>
          <h2 style="margin-bottom:5px;">📦 Commandes</h2>
          <div style="color:#777;font-size:14px;">
            Gestion des commandes YAYOUNABYSAC
          </div>
        </div>

        <div>
          <button class="btn-secondaire" onclick="chargerCommandes()">
            Actualiser
          </button>

          <button class="btn-danger" onclick="deconnexion()">
            Se déconnecter
          </button>
        </div>
      </div>
    </div>

    <div id="commandesContainer">
      <div class="loading">
        Chargement des commandes...
      </div>
    </div>

  </div>

</div>

<script>
  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL = "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_ANON_KEY = "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const connexionBox = document.getElementById("connexionBox");
  const recoveryBox = document.getElementById("recoveryBox");
  const newPasswordBox = document.getElementById("newPasswordBox");
  const adminBox = document.getElementById("adminBox");

  const commandesContainer =
    document.getElementById("commandesContainer");


  /* =========================================================
     MESSAGES
  ========================================================= */

  function afficherMessage(element, texte, type){

    element.textContent = texte;

    element.className = "message " + type;
  }


  /* =========================================================
     CONNEXION
  ========================================================= */

  async function connexionAdmin(){

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("messageConnexion");

    if(!email || !password){

      afficherMessage(
        message,
        "Veuillez remplir votre email et votre mot de passe.",
        "error"
      );

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if(error){

      afficherMessage(
        message,
        "Erreur de connexion : " + error.message,
        "error"
      );

      return;
    }

    if(data.session){

      connexionBox.classList.add("hidden");
      recoveryBox.classList.add("hidden");
      newPasswordBox.classList.add("hidden");
      adminBox.classList.remove("hidden");

      chargerCommandes();
    }
  }


  /* =========================================================
     RECUPERATION MOT DE PASSE
  ========================================================= */

  function afficherRecuperation(){

    connexionBox.classList.add("hidden");
    recoveryBox.classList.remove("hidden");
  }


  function retourConnexion(){

    recoveryBox.classList.add("hidden");
    connexionBox.classList.remove("hidden");
  }


  async function envoyerRecuperation(){

    const email =
      document.getElementById("recoveryEmail").value.trim();

    const message =
      document.getElementById("messageRecovery");

    if(!email){

      afficherMessage(
        message,
        "Veuillez entrer votre email.",
        "error"
      );

      return;
    }

    const redirectUrl =
      window.location.origin + window.location.pathname;

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(
        email,
        {
          redirectTo: redirectUrl
        }
      );

    if(error){

      afficherMessage(
        message,
        "Erreur : " + error.message,
        "error"
      );

      return;
    }

    afficherMessage(
      message,
      "Le lien de réinitialisation a été envoyé.",
      "success"
    );
  }


  /* =========================================================
     CHANGEMENT MOT DE PASSE
  ========================================================= */

  async function changerMotDePasse(){

    const password =
      document.getElementById("newPassword").value;

    const message =
      document.getElementById("messageNewPassword");

    if(!password || password.length < 6){

      afficherMessage(
        message,
        "Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }

    const { error } =
      await supabaseClient.auth.updateUser({
        password: password
      });

    if(error){

      afficherMessage(
        message,
        "Erreur : " + error.message,
        "error"
      );

      return;
    }

    afficherMessage(
      message,
      "Mot de passe modifié avec succès.",
      "success"
    );
  }


  /* =========================================================
     CHARGER LES COMMANDES
  ========================================================= */

  async function chargerCommandes(){

    commandesContainer.innerHTML =
      '<div class="loading">Chargement des commandes...</div>';

    const {
      data: commandes,
      error
    } = await supabaseClient
      .from("Orders")
      .select("*")
      .order("id", { ascending:false });

    if(error){

      commandesContainer.innerHTML =
        '<div class="box">' +
        '<div class="message error" style="display:block;">' +
        "Erreur lors du chargement des commandes : " +
        escapeHtml(error.message) +
        "</div></div>";

      return;
    }

    if(!commandes || commandes.length === 0){

      commandesContainer.innerHTML =
        '<div class="vide">' +
        "Aucune commande pour le moment." +
        "</div>";

      return;
    }

    commandesContainer.innerHTML = "";

    for(const commande of commandes){

      const bloc =
        await creerBlocCommande(commande);

      commandesContainer.appendChild(bloc);
    }
  }


  /* =========================================================
     CREER BLOC COMMANDE
  ========================================================= */

  async function creerBlocCommande(commande){

    const div = document.createElement("div");

    div.className = "commande";

    const id = commande.id;

    const client =
      commande.customer_name ||
      commande.Customer_name ||
      "";

    const phone =
      commande.phone ||
      commande.Phone ||
      "";

    const address =
      commande.address ||
      commande.Address ||
      "";

    const total =
      Number(
        commande.total ??
        commande.Total ??
        0
      );

    const statut =
      commande.status ||
      commande.Status ||
      "En attente";

    const createdAt =
      commande.created_at ||
      commande.created_ at ||
      "";

    let dateFormatee = "";

    if(createdAt){

      const date = new Date(createdAt);

      if(!isNaN(date.getTime())){

        dateFormatee =
          date.toLocaleString("fr-FR");
      }
    }


    /* =====================================================
       RECUPERATION DES ARTICLES
    ===================================================== */

    let articlesHtml =
      '<div style="color:#777;font-size:14px;">' +
      "Aucun article trouvé pour cette commande." +
      "</div>";

    try{

      const {
        data: items,
        error: itemsError
      } = await supabaseClient
        .from("Orders_items")
        .select("*")
        .eq("order_id", id);

      if(!itemsError && items && items.length > 0){

        const productIds = [];

        items.forEach(item => {

          const productId =
            item.product_id ??
            item.Product_id ??
            item.productId;

          if(productId !== null && productId !== undefined){

            productIds.push(productId);
          }
        });


        let produits = [];

        if(productIds.length > 0){

          const result =
            await supabaseClient
              .from("Products")
              .select("*")
              .in("id", productIds);

          if(!result.error && result.data){

            produits = result.data;
          }
        }


        articlesHtml = "";

        items.forEach(item => {

          const productId =
            item.product_id ??
            item.Product_id ??
            item.productId;

          const produit =
            produits.find(
              p => String(p.id) === String(productId)
            );

          const nom =
            produit?.name ||
            produit?.Name ||
            "Produit";

          const quantite =
            Number(
              item.quantity ??
              item.Quantity ??
              1
            );

          const prix =
            Number(
              item.price ??
              item.Price ??
              produit?.Price ??
              produit?.price ??
              0
            );

          const sousTotal =
            prix * quantite;

          articlesHtml += `
            <div class="produit-ligne">
              <div>
                <div class="produit-nom">
                  ${escapeHtml(nom)}
                </div>

                <div class="produit-details">
                  Quantité : ${quantite}
                  ×
                  ${formaterPrix(prix)} FCFA
                </div>
              </div>

              <strong>
                ${formaterPrix(sousTotal)} FCFA
              </strong>
            </div>
          `;
        });
      }

    }catch(e){

      console.error(
        "Erreur récupération articles :",
        e
      );
    }


    /* =====================================================
       HTML COMMANDE
    ===================================================== */

    div.innerHTML = `

      <div class="commande-header">

        <div>
          <div class="commande-id">
            Commande #${escapeHtml(String(id))}
          </div>

          ${
            dateFormatee
              ? `<div class="date">
                   ${escapeHtml(dateFormatee)}
                 </div>`
              : ""
          }
        </div>

      </div>


      <div class="infos-client">

        <strong>👤 Client :</strong>
        ${escapeHtml(String(client))}

        <br>

        <strong>📞 Téléphone :</strong>
        ${escapeHtml(String(phone))}

        <br>

        <strong>📍 Adresse :</strong>
        ${escapeHtml(String(address))}

      </div>


      <div class="produits">

        <h3>🛍️ Produits commandés</h3>

        ${articlesHtml}

      </div>


      <div class="total">

        Total :
        ${formaterPrix(total)}
        FCFA

      </div>


      <div class="statut-zone">

        <label>
          Statut de la commande
        </label>

        <select id="statut-${escapeHtml(String(id))}">

          <option value="Depuis WhatsApp"
            ${statut === "Depuis WhatsApp" ? "selected" : ""}>
            Depuis WhatsApp
          </option>

          <option value="En attente"
            ${statut === "En attente" ? "selected" : ""}>
            En attente
          </option>

          <option value="Confirmée"
            ${statut === "Confirmée" ? "selected" : ""}>
            Confirmée
          </option>

          <option value="En préparation"
            ${statut === "En préparation" ? "selected" : ""}>
            En préparation
          </option>

          <option value="Expédiée"
            ${statut === "Expédiée" ? "selected" : ""}>
            Expédiée
          </option>

          <option value="Livrée"
            ${statut === "Livrée" ? "selected" : ""}>
            Livrée
          </option>

          <option value="Annulée"
            ${statut === "Annulée" ? "selected" : ""}>
            Annulée
          </option>

        </select>

        <button
          class="btn-principal"
          onclick="enregistrerStatut(${Number(id)})">

          Enregistrer le statut

        </button>

      </div>

    `;

    return div;
  }


  /* =========================================================
     ENREGISTRER STATUT
  ========================================================= */

  async function enregistrerStatut(orderId){

    const select =
      document.getElementById(
        "statut-" + orderId
      );

    if(!select){

      alert("Champ de statut introuvable.");

      return;
    }

    const nouveauStatut =
      select.value;

    const {
      error
    } = await supabaseClient
      .from("Orders")
      .update({
        status: nouveauStatut
      })
      .eq("id", orderId);

    if(error){

      alert(
        "Erreur lors de la modification du statut : " +
        error.message
      );

      return;
    }

    alert(
      "Statut enregistré avec succès."
    );

    chargerCommandes();
  }


  /* =========================================================
     DECONNEXION
  ========================================================= */

  async function deconnexion(){

    await supabaseClient.auth.signOut();

    adminBox.classList.add("hidden");
    newPasswordBox.classList.add("hidden");
    recoveryBox.classList.add("hidden");
    connexionBox.classList.remove("hidden");
  }


  /* =========================================================
     VERIFICATION SESSION
  ========================================================= */

  async function verifierSession(){

    const {
      data
    } = await supabaseClient.auth.getSession();

    if(data && data.session){

      connexionBox.classList.add("hidden");
      recoveryBox.classList.add("hidden");
      newPasswordBox.classList.add("hidden");
      adminBox.classList.remove("hidden");

      chargerCommandes();

    }else{

      connexionBox.classList.remove("hidden");
      adminBox.classList.add("hidden");
    }
  }


  /* =========================================================
     DETECTION RECUPERATION
  ========================================================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if(event === "PASSWORD_RECOVERY"){

        connexionBox.classList.add("hidden");
        recoveryBox.classList.add("hidden");
        adminBox.classList.add("hidden");
        newPasswordBox.classList.remove("hidden");

      }else if(
        event === "SIGNED_IN" &&
        session
      ){

        connexionBox.classList.add("hidden");
        recoveryBox.classList.add("hidden");
        newPasswordBox.classList.add("hidden");
        adminBox.classList.remove("hidden");

        chargerCommandes();
      }
    }
  );


  /* =========================================================
     OUTILS
  ========================================================= */

  function formaterPrix(prix){

    return Number(prix || 0)
      .toLocaleString("fr-FR");
  }


  function escapeHtml(value){

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* =========================================================
     DEMARRAGE
  ========================================================= */

  verifierSession();

</script>

</body>
</html>
```
