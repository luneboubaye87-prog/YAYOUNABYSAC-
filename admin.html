<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test YAYOUNABYSAC</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 18px 25px;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #resultat {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>YAYOUNABYSAC</h1>

  <p>Test du bouton Ajouter produit</p>

  <button
    type="button"
    onclick="testerBouton()"
  >
    ➕ Ajouter le produit
  </button>

  <div id="resultat"></div>

  <script>
    function testerBouton() {

      document.getElementById("resultat").textContent =
        "✅ LE BOUTON FONCTIONNE !";

      alert("LE BOUTON FONCTIONNE !");
    }
  </script>

</body>
</html>
