<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-line;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .produits {
      margin-top: 25px;
    }

    .produit {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>👜 YAYOUNABYSAC</h1>
  <p>Administration</p>
</header>

<div class="container">

  <div class="box">

    <h2>➕ Ajouter un produit</h2>

    <label>Nom du produit</label>

    <input
      type="text"
      id="nom"
      placeholder="Exemple : Sac bandoulière"
    >

    <label>Description</label>

    <textarea
      id="description"
      placeholder="Description du produit"
    ></textarea>

    <label>Prix en FCFA</label>

    <input
      type="number"
      id="prix"
      placeholder="18000"
    >

    <label>Stock</label>

    <input
      type="number"
      id="stock"
      placeholder="5"
    >

    <label>Catégorie</label>

    <input
      type="text"
      id="categorie"
      placeholder="Sacs à main"
    >

    <label>URL de l'image</label>

    <input
      type="text"
      id="image"
      placeholder="https://..."
    >

    <button
      type="button"
      onclick="ajouterProduit()"
    >
      ➕ Ajouter le produit
    </button>

    <div id="message"></div>

  </div>


  <div class="box produits">

    <h2>🛍️ Produits existants</h2>

    <div id="listeProduits">
      Chargement...
    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   MESSAGE
========================================= */

function afficherMessage(
  texte,
  type
) {

  const message =
    document.getElementById("message");

  message.textContent =
    texte;

  message.className =
    type;

}


/* =========================================
   AJOUTER PRODUIT
========================================= */

async function ajouterProduit() {

  const nom =
    document
      .getElementById("nom")
      .value
      .trim();

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const prix =
    Number(
      document
        .getElementById("prix")
        .value
    );

  const stock =
    Number(
      document
        .getElementById("stock")
        .value
    );

  const categorie =
    document
      .getElementById("categorie")
      .value
      .trim();

  const image =
    document
      .getElementById("image")
      .value
      .trim();


  /* Vérifications */

  if (!nom) {

    afficherMessage(
      "Veuillez entrer le nom du produit.",
      "error"
    );

    return;
  }


  if (!prix || prix < 0) {

    afficherMessage(
      "Veuillez entrer un prix valide.",
      "error"
    );

    return;
  }


  if (stock < 0 || isNaN(stock)) {

    afficherMessage(
      "Veuillez entrer un stock valide.",
      "error"
    );

    return;
  }


  afficherMessage(
    "Enregistrement du produit...",
    "success"
  );


  /* =========================================
     INSERTION SUPABASE
  ========================================= */

  const { data, error } =
    await supabaseClient
      .from("Products")
      .insert([
        {
          name: nom,
          description: description,
          Price: prix,
          Stock: stock,
          Category: categorie,
          Image_url: image || null
        }
      ])
      .select();


  /* =========================================
     ERREUR
  ========================================= */

  if (error) {

    console.error(
      "Erreur Supabase :",
      error
    );

    afficherMessage(
      "ERREUR SUPABASE :\n\n" +
      error.message +
      "\n\nCode : " +
      (error.code || "inconnu"),
      "error"
    );

    return;
  }


  /* =========================================
     SUCCÈS
  ========================================= */

  afficherMessage(
    "✅ Produit ajouté avec succès !",
    "success"
  );


  /* Vider les champs */

  document.getElementById("nom").value = "";

  document.getElementById("description").value = "";

  document.getElementById("prix").value = "";

  document.getElementById("stock").value = "";

  document.getElementById("categorie").value = "";

  document.getElementById("image").value = "";


  /* Actualiser la liste */

  chargerProduits();

}


/* =========================================
   CHARGER LES PRODUITS
========================================= */

async function chargerProduits() {

  const liste =
    document.getElementById(
      "listeProduits"
    );

  liste.innerHTML =
    "Chargement des produits...";


  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    liste.innerHTML =
      "<div class='error'>" +
      error.message +
      "</div>";

    return;
  }


  if (!data || data.length === 0) {

    liste.innerHTML =
      "Aucun produit.";

    return;
  }


  liste.innerHTML = "";


  data.forEach(function(produit) {

    const bloc =
      document.createElement("div");

    bloc.className =
      "produit";


    bloc.innerHTML =

      "<strong>" +
      (produit.name || "") +
      "</strong>" +

      "<br><br>" +

      "Prix : " +
      Number(
        produit.Price || 0
      ).toLocaleString("fr-FR") +
      " FCFA" +

      "<br>" +

      "Stock : " +
      (produit.Stock || 0) +

      "<br>" +

      "Catégorie : " +
      (produit.Category || "");


    liste.appendChild(bloc);

  });

}


/* =========================================
   DÉMARRAGE
========================================= */

chargerProduits();

</script>

</body>
</html>
