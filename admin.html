<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YAYOUNABYSAC - Administration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h2{
  margin-top:30px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,textarea,select{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:14px;
  margin:4px;
}

.btn-ajouter{
  background:#111;
  color:white;
  width:100%;
  margin:0;
}

.btn-modifier{
  background:#2563eb;
  color:white;
}

.btn-supprimer{
  background:#dc2626;
  color:white;
}

.btn-annuler{
  background:#777;
  color:white;
}

.btn-refresh{
  background:#111;
  color:white;
}

.stats{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.stat{
  flex:1;
  min-width:180px;
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:8px;
}

.produit{
  border:1px solid #ddd;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
  background:#fff;
}

.produit img{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:8px;
  display:block;
  margin-bottom:10px;
}

.commande{
  border:1px solid #ddd;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

.ligne-produit{
  padding:8px;
  background:#f7f7f7;
  margin:5px 0;
  border-radius:6px;
}

.message{
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  display:none;
}

.succes{
  background:#dcfce7;
  color:#166534;
}

.erreur{
  background:#fee2e2;
  color:#991b1b;
}
</style>
</head>

<body>

<header>
  <h1>YAYOUNABYSAC</h1>
  <div>Administration</div>
</header>

<div class="container">

  <div id="message" class="message"></div>

  <div class="stats">
    <div class="stat">
      Commandes
      <strong id="nombreCommandes">0</strong>
    </div>

    <div class="stat">
      Total
      <strong id="totalCommandes">0 FCFA</strong>
    </div>

    <div class="stat">
      Produits
      <strong id="nombreProduits">0</strong>
    </div>
  </div>


  <!-- ================= PRODUITS ================= -->

  <h2>🛍️ Gestion des produits</h2>

  <div class="card">

    <h3 id="titreFormulaire">➕ Ajouter un produit</h3>

    <input type="hidden" id="produitId">

    <label>Nom du produit</label>
    <input
      type="text"
      id="nomProduit"
      placeholder="Ex : Sac bandoulière"
    >

    <label>Description</label>
    <textarea
      id="descriptionProduit"
      placeholder="Description du produit"
    ></textarea>

    <label>Prix (FCFA)</label>
    <input
      type="number"
      id="prixProduit"
      placeholder="18000"
    >

    <label>Stock</label>
    <input
      type="number"
      id="stockProduit"
      placeholder="10"
    >

    <label>Catégorie</label>
    <input
      type="text"
      id="categorieProduit"
      placeholder="Sacs à main"
    >

    <label>URL de l'image</label>
    <input
      type="url"
      id="imageProduit"
      placeholder="https://..."
    >

    <button
      class="btn-ajouter"
      id="boutonProduit"
      onclick="enregistrerProduit()"
    >
      Ajouter le produit
    </button>

    <button
      class="btn-annuler"
      id="boutonAnnuler"
      onclick="annulerModification()"
      style="display:none;width:100%;"
    >
      Annuler la modification
    </button>

  </div>


  <div class="card">

    <h3>📋 Produits existants</h3>

    <button class="btn-refresh" onclick="chargerProduits()">
      🔄 Actualiser les produits
    </button>

    <div id="listeProduits">
      Chargement des produits...
    </div>

  </div>


  <!-- ================= COMMANDES ================= -->

  <h2>📦 Commandes</h2>

  <div class="card">

    <button class="btn-refresh" onclick="chargerCommandes()">
      🔄 Actualiser les commandes
    </button>

    <div id="listeCommandes">
      Chargement des commandes...
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_KEY =
"sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================= MESSAGE ================= */

function afficherMessage(texte, type){

  const box = document.getElementById("message");

  box.textContent = texte;

  box.className = "message " + type;

  box.style.display = "block";

  setTimeout(() => {
    box.style.display = "none";
  }, 4000);
}


/* ================= PRODUITS ================= */

async function chargerProduits(){

  const liste =
    document.getElementById("listeProduits");

  liste.innerHTML =
    "Chargement des produits...";

  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .order("id", { ascending:false });

  if(error){

    liste.innerHTML =
      "Erreur : " + error.message;

    return;
  }

  document.getElementById("nombreProduits").textContent =
    data.length;

  if(data.length === 0){

    liste.innerHTML =
      "<p>Aucun produit pour le moment.</p>";

    return;
  }

  liste.innerHTML = "";

  data.forEach(produit => {

    const div =
      document.createElement("div");

    div.className = "produit";

    const image =
      produit.image_url
      ? `<img src="${produit.image_url}" alt="${produit.name}">`
      : "";

    div.innerHTML = `

      ${image}

      <h3>${produit.name || ""}</h3>

      <p>
        ${produit.description || ""}
      </p>

      <p>
        <strong>Prix :</strong>
        ${Number(produit.price || 0).toLocaleString("fr-FR")}
        FCFA
      </p>

      <p>
        <strong>Stock :</strong>
        ${produit.stock ?? 0}
      </p>

      <p>
        <strong>Catégorie :</strong>
        ${produit.category || ""}
      </p>

      <button
        class="btn-modifier"
        onclick="modifierProduit(${produit.id})"
      >
        ✏️ Modifier
      </button>

      <button
        class="btn-supprimer"
        onclick="supprimerProduit(${produit.id})"
      >
        🗑️ Supprimer
      </button>

    `;

    liste.appendChild(div);

  });

}


/* ================= AJOUT / MODIFICATION ================= */

async function enregistrerProduit(){

  const id =
    document.getElementById("produitId").value;

  const nom =
    document.getElementById("nomProduit").value.trim();

  const description =
    document.getElementById("descriptionProduit").value.trim();

  const prix =
    Number(document.getElementById("prixProduit").value);

  const stock =
    Number(document.getElementById("stockProduit").value);

  const categorie =
    document.getElementById("categorieProduit").value.trim();

  const image =
    document.getElementById("imageProduit").value.trim();


  if(!nom){

    afficherMessage(
      "Le nom du produit est obligatoire.",
      "erreur"
    );

    return;
  }


  if(!prix || prix < 0){

    afficherMessage(
      "Veuillez entrer un prix valide.",
      "erreur"
    );

    return;
  }


  if(stock < 0){

    afficherMessage(
      "Le stock ne peut pas être négatif.",
      "erreur"
    );

    return;
  }


  const produit = {

    name: nom,

    description: description,

    price: prix,

    stock: stock,

    category: categorie,

    image_url: image || null

  };


  let result;


  if(id){

    result =
      await supabaseClient
        .from("Products")
        .update(produit)
        .eq("id", id);

  }else{

    result =
      await supabaseClient
        .from("Products")
        .insert([produit]);

  }


  if(result.error){

    afficherMessage(
      "Erreur : " + result.error.message,
      "erreur"
    );

    return;
  }


  if(id){

    afficherMessage(
      "Produit modifié avec succès ✅",
      "succes"
    );

  }else{

    afficherMessage(
      "Produit ajouté avec succès ✅",
      "succes"
    );

  }


  viderFormulaire();

  chargerProduits();

}


/* ================= MODIFIER ================= */

async function modifierProduit(id){

  const { data, error } =
    await supabaseClient
      .from("Products")
      .select("*")
      .eq("id", id)
      .single();


  if(error){

    afficherMessage(
      "Erreur : " + error.message,
      "erreur"
    );

    return;
  }


  document.getElementById("produitId").value =
    data.id;

  document.getElementById("nomProduit").value =
    data.name || "";

  document.getElementById("descriptionProduit").value =
    data.description || "";

  document.getElementById("prixProduit").value =
    data.price || "";

  document.getElementById("stockProduit").value =
    data.stock ?? "";

  document.getElementById("categorieProduit").value =
    data.category || "";

  document.getElementById("imageProduit").value =
    data.image_url || "";


  document.getElementById("titreFormulaire").textContent =
    "✏️ Modifier le produit";

  document.getElementById("boutonProduit").textContent =
    "Enregistrer les modifications";

  document.getElementById("boutonAnnuler").style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================= ANNULER ================= */

function annulerModification(){

  viderFormulaire();

}


/* ================= VIDER FORMULAIRE ================= */

function viderFormulaire(){

  document.getElementById("produitId").value = "";

  document.getElementById("nomProduit").value = "";

  document.getElementById("descriptionProduit").value = "";

  document.getElementById("prixProduit").value = "";

  document.getElementById("stockProduit").value = "";

  document.getElementById("categorieProduit").value = "";

  document.getElementById("imageProduit").value = "";


  document.getElementById("titreFormulaire").textContent =
    "➕ Ajouter un produit";

  document.getElementById("boutonProduit").textContent =
    "Ajouter le produit";

  document.getElementById("boutonAnnuler").style.display =
    "none";

}


/* ================= SUPPRIMER ================= */

async function supprimerProduit(id){

  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer ce produit ?"
    );

  if(!confirmation){

    return;

  }


  const { error } =
    await supabaseClient
      .from("Products")
      .delete()
      .eq("id", id);


  if(error){

    afficherMessage(
      "Erreur : " + error.message,
      "erreur"
    );

    return;
  }


  afficherMessage(
    "Produit supprimé avec succès ✅",
    "succes"
  );


  chargerProduits();

}


/* ================= COMMANDES ================= */

async function chargerCommandes(){

  const liste =
    document.getElementById("listeCommandes");

  liste.innerHTML =
    "Chargement des commandes...";


  const { data: commandes, error } =
    await supabaseClient
      .from("Orders")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if(error){

    liste.innerHTML =
      "Erreur : " + error.message;

    return;
  }


  document.getElementById("nombreCommandes").textContent =
    commandes.length;


  let totalGeneral = 0;


  if(commandes.length === 0){

    liste.innerHTML =
      "<p>Aucune commande pour le moment.</p>";

    return;

  }


  liste.innerHTML = "";


  for(const commande of commandes){

    totalGeneral +=
      Number(commande.total || 0);


    const div =
      document.createElement("div");

    div.className = "commande";


    const date =
      commande.created_at
      ? new Date(
          commande.created_at
        ).toLocaleString("fr-FR")
      : "";


    div.innerHTML = `

      <h3>
        Commande #${commande.id}
      </h3>

      <p>
        <strong>Date :</strong>
        ${date}
      </p>

      <p>
        <strong>Client :</strong>
        ${commande.customer_nam || ""}
      </p>

      <p>
        <strong>Téléphone :</strong>
        ${commande.phone || ""}
      </p>

      <p>
        <strong>Adresse :</strong>
        ${commande.address || ""}
      </p>

      <p>
        <strong>Total :</strong>
        ${Number(
          commande.total || 0
        ).toLocaleString("fr-FR")}
        FCFA
      </p>

      <label>
        <strong>Statut :</strong>
      </label>

      <select
        class="statut"
        data-id="${commande.id}"
      >

        <option value="Nouvelle"
          ${commande.status === "Nouvelle" ? "selected" : ""}>
          Nouvelle
        </option>

        <option value="Confirmée"
          ${commande.status === "Confirmée" ? "selected" : ""}>
          Confirmée
        </option>

        <option value="Expédiée"
          ${commande.status === "Expédiée" ? "selected" : ""}>
          Expédiée
        </option>

        <option value="Livrée"
          ${commande.status === "Livrée" ? "selected" : ""}>
          Livrée
        </option>

        <option value="Annulée"
          ${commande.status === "Annulée" ? "selected" : ""}>
          Annulée
        </option>

      </select>

      <div id="produits-${commande.id}">
        Chargement des produits...
      </div>

    `;


    liste.appendChild(div);


    const select =
      div.querySelector(".statut");


    select.addEventListener(
      "change",
      async function(){

        const nouveauStatut =
          this.value;

        const id =
          this.dataset.id;


        const { error } =
          await supabaseClient
            .from("Orders")
            .update({
              status: nouveauStatut
            })
            .eq("id", id);


        if(error){

          alert(
            "Erreur : " +
            error.message
          );

          return;
        }


        alert(
          "Statut modifié avec succès ✅"
        );

      }
    );


    chargerProduitsCommande(
      commande.id
    );

  }


  document.getElementById("totalCommandes").textContent =
    totalGeneral.toLocaleString("fr-FR") +
    " FCFA";

}


/* ================= PRODUITS D'UNE COMMANDE ================= */

async function chargerProduitsCommande(orderId){

  const zone =
    document.getElementById(
      "produits-" + orderId
    );


  const { data: lignes, error } =
    await supabaseClient
      .from("Orders_items")
      .select("*")
      .eq("order_id", orderId);


  if(error){

    zone.innerHTML =
      "Erreur : " + error.message;

    return;
  }


  if(!lignes || lignes.length === 0){

    zone.innerHTML =
      "<p>Aucun produit.</p>";

    return;

  }


  zone.innerHTML =
    "<strong>Produits :</strong>";


  for(const ligne of lignes){

    const { data: produit } =
      await supabaseClient
        .from("Products")
        .select("name")
        .eq("id", ligne.product_id)
        .single();


    const nom =
      produit
      ? produit.name
      : "Produit";


    const ligneDiv =
      document.createElement("div");

    ligneDiv.className =
      "ligne-produit";


    const sousTotal =
      Number(ligne.price || 0) *
      Number(ligne.quantity || 0);


    ligneDiv.innerHTML = `

      ${nom}

      × ${ligne.quantity}

      — ${sousTotal.toLocaleString("fr-FR")}
      FCFA

    `;


    zone.appendChild(ligneDiv);

  }

}


/* ================= LANCEMENT ================= */

chargerProduits();

chargerCommandes();

</script>

</body>
</html>
