<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABY STORE — Boutique en ligne</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#faf8f6;
      color:#30231e;
      min-height:100vh;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.55;
    }

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#fff;
      border-bottom:1px solid #eee;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .logo{
      font-size:22px;
      font-weight:800;
      color:#30231e;
      letter-spacing:.5px;
    }

    .cart-button{
      border:0;
      background:#8b6250;
      color:#fff;
      border-radius:25px;
      padding:10px 15px;
      font-weight:700;
    }

    .cart-button span{
      background:#fff;
      color:#8b6250;
      border-radius:50%;
      padding:2px 7px;
      margin-left:5px;
    }

    .hero{
      max-width:1200px;
      margin:auto;
      padding:45px 18px 25px;
      text-align:center;
    }

    .hero h1{
      font-size:34px;
      margin-bottom:10px;
    }

    .hero p{
      color:#766b66;
      font-size:16px;
    }

    .search-area{
      max-width:1200px;
      margin:auto;
      padding:0 18px 25px;
    }

    .search-input{
      width:100%;
      padding:14px 16px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fff;
      outline:none;
    }

    .search-input:focus{
      border-color:#8b6250;
    }

    .categories{
      max-width:1200px;
      margin:auto;
      padding:0 18px 25px;
      display:flex;
      gap:8px;
      overflow-x:auto;
    }

    .category-btn{
      border:1px solid #ddd;
      background:#fff;
      color:#30231e;
      padding:9px 15px;
      border-radius:22px;
      white-space:nowrap;
    }

    .category-btn.active{
      background:#8b6250;
      color:#fff;
      border-color:#8b6250;
    }

    .products-section{
      max-width:1200px;
      margin:auto;
      padding:0 18px 50px;
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:18px;
    }

    .product-card{
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
      border:1px solid #eee;
    }

    .product-image{
      width:100%;
      height:210px;
      object-fit:cover;
      background:#f1ece8;
      display:block;
    }

    .product-info{
      padding:14px;
    }

    .product-category{
      font-size:12px;
      color:#8b6250;
      margin-bottom:5px;
    }

    .product-name{
      font-size:17px;
      font-weight:700;
      margin-bottom:7px;
    }

    .product-description{
      font-size:13px;
      color:#766b66;
      min-height:35px;
      margin-bottom:10px;
    }

    .product-price{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .product-actions{
      display:flex;
      gap:8px;
    }

    .btn-primary{
      flex:1;
      border:0;
      background:#8b6250;
      color:#fff;
      padding:11px;
      border-radius:10px;
      font-weight:700;
    }

    .btn-secondary{
      border:1px solid #ddd;
      background:#fff;
      color:#30231e;
      padding:11px 12px;
      border-radius:10px;
    }

    .empty-products{
      text-align:center;
      padding:50px 20px;
      color:#766b66;
    }

    .floating-cart{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:900;
      background:#8b6250;
      color:#fff;
      border:0;
      border-radius:50px;
      padding:14px 20px;
      font-weight:700;
      box-shadow:0 5px 20px rgba(0,0,0,.2);
    }

    .modal-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:2000;
      align-items:flex-end;
      justify-content:center;
    }

    .modal-overlay.show{
      display:flex;
    }

    .modal{
      width:100%;
      max-width:650px;
      max-height:92vh;
      overflow-y:auto;
      background:#fff;
      border-radius:22px 22px 0 0;
      padding:20px;
      animation:slideUp .2s ease;
    }

    @keyframes slideUp{
      from{
        transform:translateY(100%);
      }
      to{
        transform:translateY(0);
      }
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
      gap:10px;
    }

    .modal-header h2{
      font-size:21px;
    }

    .close-btn{
      width:38px;
      height:38px;
      border-radius:50%;
      border:0;
      background:#f1ece8;
      color:#30231e;
      font-size:22px;
    }

    .cart-item{
      display:flex;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .cart-item-image{
      width:75px;
      height:75px;
      object-fit:cover;
      border-radius:10px;
      background:#f1ece8;
      flex-shrink:0;
    }

    .cart-item-info{
      flex:1;
    }

    .cart-item-name{
      font-weight:700;
      margin-bottom:5px;
    }

    .cart-item-price{
      color:#8b6250;
      font-weight:700;
      margin-bottom:8px;
    }

    .quantity-controls{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }

    .quantity-btn{
      width:30px;
      height:30px;
      border:1px solid #ddd;
      background:#fff;
      border-radius:8px;
      font-weight:700;
    }

    .delete-btn{
      margin-left:8px;
      border:0;
      background:none;
      color:#b33;
      font-size:13px;
    }

    .cart-total{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:18px;
      padding-top:15px;
      border-top:2px solid #eee;
      font-size:19px;
      font-weight:800;
    }

    .cart-actions{
      display:flex;
      gap:10px;
      margin-top:18px;
    }

    .cart-actions button{
      flex:1;
    }

    .checkout-form{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .form-group label{
      font-weight:700;
      font-size:14px;
    }

    .form-group input,
    .form-group textarea{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      outline:none;
      background:#fff;
    }

    .form-group input:focus,
    .form-group textarea:focus{
      border-color:#8b6250;
    }

    .form-group textarea{
      min-height:90px;
      resize:vertical;
    }

    .checkout-summary{
      background:#faf8f6;
      border-radius:12px;
      padding:14px;
      margin-bottom:15px;
    }

    .checkout-summary-item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:5px 0;
      font-size:14px;
    }

    .checkout-summary-total{
      display:flex;
      justify-content:space-between;
      border-top:1px solid #ddd;
      margin-top:8px;
      padding-top:10px;
      font-weight:800;
      font-size:18px;
    }

    .product-detail-image{
      width:100%;
      max-height:400px;
      object-fit:cover;
      border-radius:15px;
      background:#f1ece8;
      margin-bottom:15px;
    }

    .product-detail-price{
      font-size:22px;
      font-weight:800;
      color:#8b6250;
      margin:12px 0;
    }

    .product-detail-description{
      color:#665d58;
      line-height:1.6;
      margin-bottom:18px;
      white-space:pre-line;
    }

    .notice{
      padding:12px 14px;
      border-radius:10px;
      margin-bottom:15px;
      font-size:14px;
      display:none;
    }

    .notice.show{
      display:block;
    }

    .notice.error{
      background:#fff0f0;
      color:#a40000;
    }

    .notice.success{
      background:#edf9ef;
      color:#24702d;
    }

    .loading{
      text-align:center;
      padding:40px 20px;
      color:#766b66;
    }

    footer{
      text-align:center;
      padding:35px 18px;
      background:#30231e;
      color:#fff;
      margin-top:30px;
    }

    @media(max-width:600px){

      .hero h1{
        font-size:27px;
      }

      .products-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
      }

      .product-image{
        height:180px;
      }

      .product-info{
        padding:11px;
      }

      .product-name{
        font-size:15px;
      }

      .product-description{
        font-size:12px;
      }

      .product-price{
        font-size:16px;
      }

      .btn-primary,
      .btn-secondary{
        padding:9px 7px;
        font-size:13px;
      }
    }
  </style>
</head>

<header>

<!-- MODAL PANIER -->

<div id="cartModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">

      <button

</div>

<!-- MODAL PRODUIT -->

<div id="productModal" class="modal-overlay">

    <div class="modal-header">

        class="close-btn"

</div>

<!-- MODAL COMMANDE -->

<div id="checkoutModal" class="modal-overlay">

    <div class="modal-header">

      <button
        class="close-btn"

      >×</button>
    </div>

    <div id="checkoutSummary" class="checkout-summary"></div>

    <form id="checkoutForm" class="checkout-form">

      <div class="form-group">
        <label for="customerName">Nom</label>
        <input
          id="customerName"
          type="text"
          placeholder="Votre nom"
          required
        >
      </div>

      <div class="form-group">
        <label for="customerPhone">Téléphone</label>
        <input
          id="customerPhone"
          type="tel"
          placeholder="Votre numéro de téléphone"
          required
        >
      </div>

      <div class="form-group">
        <label for="customerAddress">Adresse / Quartier</label>
        <input
          id="customerAddress"
          type="text"
          placeholder="Exemple : Dakar, Parcelles Assainies"
          required
        >
      </div>

      <div class="form-group">
        <label for="customerComment">Commentaire</label>
        <textarea
          id="customerComment"
          placeholder="Un commentaire concernant votre commande..."
        ></textarea>
      </div>

      <button
        id="submitOrderBtn"
        type="submit"
        class="btn-primary"
      >
        📱 Commander sur WhatsApp
      </button>

    </form>
  </div>
</div>

function convertirPrix(valeur){

  if(
    valeur === null ||
    valeur === undefined
  ){
    return 0;
  }

  if(typeof valeur === "number"){

    return Number.isFinite(valeur)
      ? valeur
      : 0;
  }

  const propre =
    String(valeur)
      .replace(/\s/g,"")
      .replace(/FCFA/gi,"")
      .replace(/,/g,".")
      .trim();

  const nombre =
    Number(propre);

  return Number.isFinite(nombre)
    ? nombre
    : 0;
}


function convertirNombre(valeur){

  const nombre =
    Number(valeur);

  return Number.isFinite(nombre)
    ? nombre
    : 0;
}


function formaterPrix(prix){

  const nombre =
    convertirPrix(prix);

  return (
    nombre.toLocaleString("fr-FR") +
    " FCFA"
  );
}
