<!DOCTYPE html>

<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Boutique</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 18px;
    }

    .categories button {
      border: none;
      background: #ddd;
      padding: 9px 15px;
      border-radius: 20px;
      white-space: nowrap;
      cursor: pointer;
    }

    .categories button.active {
      background: #111;
      color: white;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .product-content {
      padding: 14px;
    }

    .product h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .price {
      margin: 10px 0;
      font-size: 18px;
      font-weight: bold;
    }

    .stock {
      margin-bottom: 10px;
      font-size: 14px;
      color: #555;
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .add-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .section {
      background: white;
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .section h2 {
      margin-top: 0;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-info {
      flex: 1;
    }

    .cart-name {
      font-weight: bold;
    }

    .cart-price {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .quantity button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: #ddd;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity .delete-btn {
      background: #c62828;
      color: white;
    }

    .cart-total {
      margin-top: 15px;
      text-align: right;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout-form {
      display: grid;
      gap: 10px;
    }

    .checkout-form input,
    .checkout-form textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .checkout-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .order-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 25px;
      color: #777;
    }

    .error {
      margin-top: 15px;
      padding: 15px;
      background: #ffe5e5;
      color: #a00000;
      border-radius: 8px;
      white-space: pre-line;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      background: #111;
      color: white;
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      #products {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .product img {
        height: 170px;
      }

      .product-content {
        padding: 10px;
      }

      .product h3 {
        font-size: 16px;
      }

      .price {
        font-size: 16px;
      }

      .cart-item {
        flex-wrap: wrap;
      }
    }
  </style>

</head>

<body>

<header>
  <h1>YAYOUNABYSAC</h1>
  <p>Votre boutique de sacs pour femme</p>
</header>

<main class="container">

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="Rechercher un sac..."
    >
  </div>

  <div class="categories" id="categories">
    <button class="active" onclick="choisirCategorie('Toutes', this)">
      Toutes
    </button>
  </div>

  <div id="products">
    <div class="loading">
      Chargement des produits...
    </div>
  </div>

  <div id="productError"></div>

  <section class="section">

<h2>🛒 Mon panier</h2>

  <div class="empty">

  </div>
</div>

<div class="cart-total">
  Total :
  <span id="cartTotal">0</span> FCFA
</div>

  <section class="section">

<h2>📦 Finaliser ma commande</h2>

<div class="checkout-form">

  <input
    type="text"

    placeholder="Votre nom complet"
  >

  <input

  <input

  <textarea
    id="customerComment"
    placeholder="Commentaire (facultatif)"
  ></textarea>

  <button
    class="order-btn"

  >

  </button>

</div>
```

  </section>

</main>

<footer>
  © 2026 YAYOUNABYSAC - Tous droits réservés
</footer>

<script>

  // =====================================================
  // SUPABASE
  // =====================================================

  const SUPABASE_URL =
    "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // =====================================================
  // VARIABLES
  // =====================================================

  let produits = [];

  let panier = JSON.parse(
    localStorage.getItem("yayounabysac_panier") || "[]"
  );

  let categorieActuelle = "Toutes";


  // =====================================================
  // CHARGER LES PRODUITS
  // =====================================================

  async function chargerProduits() {

    const productsDiv =
      document.getElementById("products");

    productsDiv.innerHTML =
      '<div class="loading">Chargement des produits...</div>';

    const { data, error } =
      await supabaseClient
        .from("Products")
        .select("*")
        .order("id", { ascending: false });

    if (error) {

      console.error(
        "Erreur produits :",
        error
      );

      productsDiv.innerHTML = "";

      document.getElementById(
        "productError"
      ).innerHTML =
        '<div class="error">' +
        "Erreur Supabase :\n\n" +
        error.message +
        "\n\nCode : " +
        (error.code || "inconnu") +
        "</div>";

      return;
    }

    produits = data || [];

    afficherCategories();
    afficherProduits();
    afficherPanier();
  }


  // =====================================================
  // CATÉGORIES
  // =====================================================

  function afficherCategories() {

    const categoriesDiv =
      document.getElementById("categories");

    const categories = [
      ...new Set(
        produits
          .map(p => p.Category)
          .filter(Boolean)
      )
    ];

    categoriesDiv.innerHTML = "";

    const boutonToutes =
      document.createElement("button");

    boutonToutes.textContent = "Toutes";

    boutonToutes.className =
      categorieActuelle === "Toutes"
        ? "active"
        : "";

    boutonToutes.onclick =
      function() {
        choisirCategorie(
          "Toutes",
          this
        );
      };

    categoriesDiv.appendChild(
      boutonToutes
    );

    categories.forEach(
      categorie => {

        const bouton =
          document.createElement("button");

        bouton.textContent =
          categorie;

        bouton.className =
          categorieActuelle === categorie
            ? "active"
            : "";

        bouton.onclick =
          function() {
            choisirCategorie(
              categorie,
              this
            );
          };

        categoriesDiv.appendChild(
          bouton
        );
      }
    );
  }


  function choisirCategorie(
    categorie,
    bouton
  ) {

    categorieActuelle =
      categorie;

    document
      .querySelectorAll(
        "#categories button"
      )
      .forEach(btn => {
        btn.classList.remove("active");
      });

    bouton.classList.add("active");

    afficherProduits();
  }


  // =====================================================
  // AFFICHER LES PRODUITS
  // =====================================================

  function afficherProduits() {

    const productsDiv =
      document.getElementById("products");

    const recherche =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const liste =
      produits.filter(
        produit => {

          const nom =
            String(
              produit.name || ""
            ).toLowerCase();

          const description =
            String(
              produit.description || ""
            ).toLowerCase();

          const categorie =
            String(
              produit.Category || ""
            );

          const rechercheOK =
            nom.includes(recherche) ||
            description.includes(recherche);

          const categorieOK =
            categorieActuelle === "Toutes" ||
            categorie === categorieActuelle;

          return (
            rechercheOK &&
            categorieOK
          );
        }
      );

    if (liste.length === 0) {

      productsDiv.innerHTML =
        '<div class="empty">' +
        "Aucun produit trouvé." +
        "</div>";

      return;
    }

    productsDiv.innerHTML = "";

    liste.forEach(
      produit => {

        const prix =
          Number(
            produit.Price || 0
          );

        const stock =
          Number(
            produit.Stock || 0
          );

        const image =
          produit.Image_url ||
          "https://via.placeholder.com/600x600?text=YAYOUNABYSAC";

        const card =
          document.createElement("div");

        card.className =
          "product";

        card.innerHTML = `

          <img
            src="${image}"
            alt="${escapeHtml(produit.name || "Sac")}"
            onerror="this.src='https://via.placeholder.com/600x600?text=YAYOUNABYSAC'"
          >

          <div class="product-content">

            <h3>
              ${escapeHtml(produit.name || "Produit")}
            </h3>

            <div class="description">
              ${escapeHtml(produit.description || "")}
            </div>

            <div class="price">
              ${prix.toLocaleString("fr-FR")}
              FCFA
            </div>

            <div class="stock">
              Stock : ${stock}
            </div>

            <button
              class="add-btn"
              ${stock <= 0 ? "disabled" : ""}
              onclick="ajouterAuPanier(${produit.id})"
            >
              ${
                stock > 0
                  ? "Ajouter au panier"
                  : "Rupture de stock"
              }
            </button>

          </div>
        `;

        productsDiv.appendChild(card);
      }
    );
  }


  // =====================================================
  // RECHERCHE
  // =====================================================

  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      afficherProduits
    );


  // =====================================================
  // AJOUTER AU PANIER
  // =====================================================

  function ajouterAuPanier(id) {

    const produit =
      produits.find(
        p =>
          Number(p.id) === Number(id)
      );

    if (!produit) {

      alert("Produit introuvable.");

      return;
    }

    const stock =
      Number(produit.Stock || 0);

    if (stock <= 0) {

      alert(
        "Ce produit est en rupture de stock."
      );

      return;
    }

    const existant =
      panier.find(
        p =>
          Number(p.id) === Number(id)
      );

    if (existant) {

      if (
        Number(existant.quantity) >= stock
      ) {

        alert(
          "Vous avez atteint la quantité disponible en stock."
        );

        return;
      }

      existant.quantity++;

    } else {

      panier.push({
        id: produit.id,
        name: produit.name,
        price: Number(produit.Price || 0),
        quantity: 1,
        stock: stock
      });
    }

    sauvegarderPanier();
    afficherPanier();

    alert("Produit ajouté au panier.");
  }


  // =====================================================
  // AFFICHER LE PANIER
  // =====================================================

  function afficherPanier() {

    const cartItems =
      document.getElementById("cartItems");

    const cartTotal =
      document.getElementById("cartTotal");

    if (
      !panier ||
      panier.length === 0
    ) {

      cartItems.innerHTML =
        '<div class="empty">' +
        "Votre panier est vide." +
        "</div>";

      cartTotal.textContent = "0";

      return;
    }

    cartItems.innerHTML = "";

    let total = 0;

    panier.forEach(
      (item, index) => {

        const prix =
          Number(item.price || 0);

        const quantite =
          Number(item.quantity || 0);

        const sousTotal =
          prix * quantite;

        total += sousTotal;

        const ligne =
          document.createElement("div");

        ligne.className =
          "cart-item";

        ligne.innerHTML = `

          <div class="cart-info">

            <div class="cart-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="cart-price">
              ${prix.toLocaleString("fr-FR")}
              FCFA × ${quantite}
            </div>

          </div>

          <div class="quantity">

            <button
              onclick="diminuerQuantite(${index})"
            >
              −
            </button>

            <strong>
              ${quantite}
            </strong>

            <button
              onclick="augmenterQuantite(${index})"
            >
              +
            </button>

            <button
              class="delete-btn"
              onclick="supprimerDuPanier(${index})"
            >
              ×
            </button>

          </div>
        `;

        cartItems.appendChild(ligne);
      }
    );

    cartTotal.textContent =
      total.toLocaleString("fr-FR");
  }


  // =====================================================
  // AUGMENTER QUANTITÉ
  // =====================================================

  function augmenterQuantite(index) {

    const item =
      panier[index];

    if (!item) return;

    if (
      Number(item.quantity) >=
      Number(item.stock)
    ) {

      alert(
        "Vous avez atteint la quantité disponible en stock."
      );

      return;
    }

    item.quantity++;

    sauvegarderPanier();
    afficherPanier();
  }


  // =====================================================
  // DIMINUER QUANTITÉ
  // =====================================================

  function diminuerQuantite(index) {

    const item =
      panier[index];

    if (!item) return;

    item.quantity--;

    if (item.quantity <= 0) {

      panier.splice(index, 1);
    }

    sauvegarderPanier();
    afficherPanier();
  }


  // =====================================================
  // SUPPRIMER DU PANIER
  // =====================================================

  function supprimerDuPanier(index) {

    panier.splice(index, 1);

    sauvegarderPanier();
    afficherPanier();
  }


  // =====================================================
  // SAUVEGARDER LE PANIER
  // =====================================================

  function sauvegarderPanier() {

    localStorage.setItem(
      "yayounabysac_panier",
      JSON.stringify(panier)
    );
  }


  // =====================================================
  // CALCULER LE TOTAL
  // =====================================================

  function calculerTotal() {

    return panier.reduce(
      (somme, produit) => {

        return (
          somme +
          Number(produit.price || 0) *
          Number(produit.quantity || 0)
        );

      },
      0
    );
  }


  // =====================================================
  // ENREGISTRER LA COMMANDE
  // =====================================================

  async function enregistrerCommande() {

    const nom =
      document
        .getElementById("customerName")
        .value
        .trim();

    const telephone =
      document
        .getElementById("customerPhone")
        .value
        .trim();

    const adresse =
      document
        .getElementById("customerAddress")
        .value
        .trim();

    const commentaire =
      document
        .getElementById("customerComment")
        .value
        .trim();

    if (!nom) {

      alert(
        "Veuillez entrer votre nom."
      );

      return;
    }

    if (!telephone) {

      alert(
        "Veuillez entrer votre numéro de téléphone."
      );

      return;
    }

    if (!adresse) {

      alert(
        "Veuillez entrer votre adresse ou quartier."
      );

      return;
    }

    if (
      !panier ||
      panier.length === 0
    ) {

      alert(
        "Votre panier est vide."
      );

      return;
    }

    const total =
      calculerTotal();

    let adresseComplete =
      adresse;

    if (commentaire) {

      adresseComplete +=
        " | Commentaire : " +
        commentaire;
    }

    try {

      // =================================================
      // 1. ENREGISTRER DANS ORDERS
      // IMPORTANT :
      // LA COLONNE EST EXACTEMENT "customer_nam"
      // =================================================

      const { data: commande, error } =
        await supabaseClient
          .from("Orders")
          .insert([
            {
              customer_nam: nom,
              phone: telephone,
              address: adresseComplete,
              total: total,
              status: "Nouvelle"
            }
          ])
          .select("id")
          .single();

      if (error) {

        console.error(
          "ERREUR ORDERS :",
          error
        );

        alert(
          "ERREUR SUPABASE :\n\n" +
          error.message +
          "\n\nCode : " +
          (error.code || "inconnu")
        );

        return;
      }

      const orderId =
        commande.id;

      console.log(
        "Commande enregistrée. ID :",
        orderId
      );


      // =================================================
      // 2. ENREGISTRER LES PRODUITS DE LA COMMANDE
      // =================================================

      const lignesCommande =
        panier.map(produit => {

          return {
            order_id: orderId,
            product_id: produit.id,
            quantity: Number(produit.quantity),
            price: Number(produit.price)
          };

        });

      const {
        error: itemsError
      } =
        await supabaseClient
          .from("Orders_items")
          .insert(lignesCommande);

      if (itemsError) {

        console.error(
          "ERREUR ORDERS_ITEMS :",
          itemsError
        );

        alert(
          "La commande principale a été enregistrée,\n" +
          "mais les produits de la commande n'ont pas pu être enregistrés.\n\n" +
          "Erreur : " +
          itemsError.message
        );

        return;
      }


      // =================================================
      // 3. MESSAGE WHATSAPP
      // =================================================

      let message =
        "🛍️ *NOUVELLE COMMANDE - YAYOUNABYSAC*\n\n";

      message +=
        "👤 Nom : " +
        nom +
        "\n";

      message +=
        "📞 Téléphone : " +
        telephone +
        "\n";

      message +=
        "📍 Adresse : " +
        adresse +
        "\n";

      if (commentaire) {

        message +=
          "📝 Commentaire : " +
          commentaire +
          "\n";
      }

      message +=
        "\n🛒 *Produits commandés :*\n";

      panier.forEach(
        produit => {

          const sousTotal =
            Number(produit.price) *
            Number(produit.quantity);

          message +=
            "• " +
            produit.name +
            " x" +
            produit.quantity +
            " = " +
            sousTotal.toLocaleString("fr-FR") +
            " FCFA\n";
        }
      );

      message +=
        "\n💰 *TOTAL : " +
        total.toLocaleString("fr-FR") +
        " FCFA*";


      // =================================================
      // 4. VIDER LE PANIER
      // =================================================

      panier = [];

      sauvegarderPanier();

      afficherPanier();


      // =================================================
      // 5. WHATSAPP
      // =================================================

      const numeroWhatsApp =
        "221775124928";

      const urlWhatsApp =
        "https://wa.me/" +
        numeroWhatsApp +
        "?text=" +
        encodeURIComponent(message);

      alert(
        "Commande enregistrée avec succès !\n\n" +
        "Vous allez être redirigé vers WhatsApp."
      );

      window.location.href =
        urlWhatsApp;

    } catch (erreur) {

      console.error(
        "Erreur inattendue :",
        erreur
      );

      alert(
        "Une erreur est survenue.\n\n" +
        (
          erreur.message ||
          erreur
        )
      );
    }
  }


  // =====================================================
  // PROTECTION DU TEXTE
  // =====================================================

  function escapeHtml(texte) {

    return String(texte || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // =====================================================
  // DÉMARRAGE
  // =====================================================

  chargerProduits();

</script>

</body>
</html>
