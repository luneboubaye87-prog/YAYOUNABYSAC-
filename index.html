<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Boutique</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 22px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      margin: 0;
      font-size: 27px;
      letter-spacing: 1px;
    }

    header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 18px;
    }

    .search {
      margin-bottom: 15px;
    }

    .search input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .category {
      flex-shrink: 0;
      border: none;
      background: #ddd;
      color: #222;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    .category.active {
      background: #111;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #eee;
    }

    .product-content {
      padding: 13px;
    }

    .product h3 {
      margin: 0 0 7px;
      font-size: 17px;
    }

    .description {
      color: #666;
      font-size: 13px;
      min-height: 35px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin: 10px 0;
    }

    .stock {
      font-size: 13px;
      color: #555;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      font-size: 15px;
    }

    .add-button {
      width: 100%;
      background: #111;
      color: white;
      margin-top: 10px;
    }

    .add-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .cart {
      background: white;
      margin-top: 25px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .cart h2 {
      margin-top: 0;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-name {
      font-weight: bold;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .quantity-button {
      width: 38px;
      height: 38px;
      padding: 0;
      background: #eee;
      font-size: 20px;
    }

    .remove-button {
      background: #d9534f;
      color: white;
      padding: 8px 12px;
      margin-left: auto;
    }

    .cart-total {
      font-size: 20px;
      font-weight: bold;
      text-align: right;
      padding-top: 15px;
    }

    .checkout {
      background: white;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .checkout h2 {
      margin-top: 0;
    }

    .checkout input,
    .checkout textarea {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    .checkout textarea {
      min-height: 90px;
      resize: vertical;
    }

    .order-button {
      width: 100%;
      background: #25D366;
      color: white;
      font-weight: bold;
      margin-top: 10px;
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
    }

    .success {
      display: block;
      background: #e5f7e5;
      color: #176b17;
    }

    .error {
      display: block;
      background: #ffe5e5;
      color: #a00000;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    .cart-badge {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #111;
      color: white;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      z-index: 200;
      cursor: pointer;
    }

    .cart-count {
      position: absolute;
      top: -4px;
      right: -3px;
      background: #e53935;
      color: white;
      font-size: 12px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }

      .product-image {
        height: 230px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>YAYOUNABYSAC</h1>
  <p>Votre boutique de sacs pour femme</p>
</header>

<div class="container">

  <div class="search">
    <input
      type="search"
      id="searchInput"
      placeholder="🔎 Rechercher un sac..."
      oninput="afficherProduits()"
    >
  </div>

  <div id="categories" class="categories"></div>

  <div id="products" class="products">
    <div class="empty">Chargement des produits...</div>
  </div>

  <div id="cart" class="cart">
    <h2>🛒 Mon panier</h2>

    <div id="cartItems">
      <div class="empty">Votre panier est vide.</div>
    </div>

    <div id="cartTotal" class="cart-total">
      Total : 0 FCFA
    </div>
  </div>

  <div class="checkout">

    <h2>📦 Finaliser ma commande</h2>

    <input
      type="text"
      id="customerName"
      placeholder="Votre nom complet"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="Votre numéro de téléphone"
    >

    <input
      type="text"
      id="customerAddress"
      placeholder="Adresse / Quartier"
    >

    <textarea
      id="customerComment"
      placeholder="Commentaire (facultatif)"
    ></textarea>

    <button
      class="order-button"
      onclick="passerCommande()"
    >
      📱 Commander sur WhatsApp
    </button>

    <div id="orderMessage" class="message"></div>

  </div>

</div>

<div class="cart-badge" onclick="allerAuPanier()">
  🛒
  <span id="cartCount" class="cart-count">0</span>
</div>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://ajprnhqphbtgfztspuio.supabase.co";

  /*
     IMPORTANT :
     Remets ici ta clé publishable Supabase
     que tu utilises déjà dans ton projet.
  */
  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let produits = [];

  let panier =
    JSON.parse(
      localStorage.getItem("yayounabysac_panier")
    ) || [];

  let categorieActuelle = "Toutes";


  /* =========================
     CHARGER PRODUITS
  ========================= */

  async function chargerProduits() {

    const zone =
      document.getElementById("products");

    zone.innerHTML =
      '<div class="empty">Chargement des produits...</div>';

    const {
      data,
      error
    } =
      await supabaseClient
        .from("Products")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {

      console.error(error);

      zone.innerHTML =
        '<div class="empty">Erreur lors du chargement des produits.</div>';

      return;
    }

    produits = data || [];

    afficherCategories();
    afficherProduits();
    afficherPanier();
  }


  /* =========================
     CATEGORIES
  ========================= */

  function afficherCategories() {

    const zone =
      document.getElementById("categories");

    const categories =
      [
        "Toutes",
        ...new Set(
          produits
            .map(p => p.Category)
            .filter(Boolean)
        )
      ];

    zone.innerHTML = "";

    categories.forEach(categorie => {

      const bouton =
        document.createElement("button");

      bouton.className =
        "category"
        + (
          categorie === categorieActuelle
            ? " active"
            : ""
        );

      bouton.textContent =
        categorie;

      bouton.onclick = function() {

        categorieActuelle =
          categorie;

        afficherCategories();
        afficherProduits();
      };

      zone.appendChild(bouton);

    });
  }


  /* =========================
     AFFICHER PRODUITS
  ========================= */

  function afficherProduits() {

    const zone =
      document.getElementById("products");

    const recherche =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let liste =
      produits.filter(produit => {

        const nom =
          String(produit.name || "")
            .toLowerCase();

        const description =
          String(produit.description || "")
            .toLowerCase();

        const categorie =
          String(produit.Category || "");

        const correspondRecherche =
          !recherche ||
          nom.includes(recherche) ||
          description.includes(recherche);

        const correspondCategorie =
          categorieActuelle === "Toutes" ||
          categorie === categorieActuelle;

        return (
          correspondRecherche &&
          correspondCategorie
        );
      });

    if (liste.length === 0) {

      zone.innerHTML =
        '<div class="empty">Aucun produit trouvé.</div>';

      return;
    }

    zone.innerHTML = "";

    liste.forEach(produit => {

      const stock =
        Number(produit.Stock || 0);

      const prix =
        Number(produit.Price || 0);

      const image =
        produit.Image_url ||
        "https://via.placeholder.com/500x400?text=YAYOUNABYSAC";

      const card =
        document.createElement("div");

      card.className =
        "product";

      card.innerHTML = `

        <img
          class="product-image"
          src="${image}"
          alt="${produit.name || "Produit"}"
          onerror="this.src='https://via.placeholder.com/500x400?text=YAYOUNABYSAC'"
        >

        <div class="product-content">

          <h3>
            ${produit.name || "Produit"}
          </h3>

          <div class="description">
            ${produit.description || ""}
          </div>

          <div class="price">
            ${prix.toLocaleString("fr-FR")} FCFA
          </div>

          <div class="stock">
            Stock : ${stock}
          </div>

          <button
            class="add-button"
            onclick="ajouterAuPanier(${produit.id})"
            ${stock <= 0 ? "disabled" : ""}
          >
            ${
              stock <= 0
                ? "Rupture de stock"
                : "🛒 Ajouter au panier"
            }
          </button>

        </div>
      `;

      zone.appendChild(card);

    });
  }


  /* =========================
     AJOUTER PANIER
  ========================= */

  function ajouterAuPanier(id) {

    const produit =
      produits.find(
        p => Number(p.id) === Number(id)
      );

    if (!produit) return;

    const stock =
      Number(produit.Stock || 0);

    if (stock <= 0) return;

    const existant =
      panier.find(
        item => Number(item.id) === Number(id)
      );

    if (existant) {

      if (existant.quantite < stock) {

        existant.quantite++;

      }

    } else {

      panier.push({
        id: produit.id,
        name: produit.name,
        price: Number(produit.Price || 0),
        quantite: 1
      });

    }

    sauvegarderPanier();
    afficherPanier();
  }


  /* =========================
     SAUVEGARDER PANIER
  ========================= */

  function sauvegarderPanier() {

    localStorage.setItem(
      "yayounabysac_panier",
      JSON.stringify(panier)
    );
  }


  /* =========================
     AFFICHER PANIER
  ========================= */

  function afficherPanier() {

    const zone =
      document.getElementById("cartItems");

    const totalZone =
      document.getElementById("cartTotal");

    const countZone =
      document.getElementById("cartCount");

    if (panier.length === 0) {

      zone.innerHTML =
        '<div class="empty">Votre panier est vide.</div>';

      totalZone.textContent =
        "Total : 0 FCFA";

      countZone.textContent = "0";

      return;
    }

    zone.innerHTML = "";

    let total = 0;
    let nombreArticles = 0;

    panier.forEach(item => {

      const sousTotal =
        Number(item.price) *
        Number(item.quantite);

      total += sousTotal;

      nombreArticles +=
        Number(item.quantite);

      const div =
        document.createElement("div");

      div.className =
        "cart-item";

      div.innerHTML = `

        <div class="cart-name">
          ${item.name}
        </div>

        <div>
          ${Number(item.price).toLocaleString("fr-FR")}
          FCFA × ${item.quantite}
        </div>

        <div class="cart-controls">

          <button
            class="quantity-button"
            onclick="modifierQuantite(${item.id}, -1)"
          >
            −
          </button>

          <strong>
            ${item.quantite}
          </strong>

          <button
            class="quantity-button"
            onclick="modifierQuantite(${item.id}, 1)"
          >
            +
          </button>

          <button
            class="remove-button"
            onclick="supprimerDuPanier(${item.id})"
          >
            Supprimer
          </button>

        </div>

      `;

      zone.appendChild(div);

    });

    totalZone.textContent =
      "Total : "
      + total.toLocaleString("fr-FR")
      + " FCFA";

    countZone.textContent =
      nombreArticles;
  }


  /* =========================
     MODIFIER QUANTITE
  ========================= */

  function modifierQuantite(id, changement) {

    const item =
      panier.find(
        p => Number(p.id) === Number(id)
      );

    if (!item) return;

    const produit =
      produits.find(
        p => Number(p.id) === Number(id)
      );

    const stock =
      Number(
        produit
          ? produit.Stock
          : 999999
      );

    item.quantite += changement;

    if (item.quantite <= 0) {

      panier =
        panier.filter(
          p => Number(p.id) !== Number(id)
        );

    } else if (item.quantite > stock) {

      item.quantite = stock;

      alert(
        "Vous ne pouvez pas dépasser le stock disponible."
      );
    }

    sauvegarderPanier();
    afficherPanier();
  }


  /* =========================
     SUPPRIMER
  ========================= */

  function supprimerDuPanier(id) {

    panier =
      panier.filter(
        item => Number(item.id) !== Number(id)
      );

    sauvegarderPanier();
    afficherPanier();
  }


  /* =========================
     ALLER AU PANIER
  ========================= */

  function allerAuPanier() {

    document
      .getElementById("cart")
      .scrollIntoView({
        behavior: "smooth"
      });
  }


  /* =========================
     PASSER COMMANDE
  ========================= */

  async function passerCommande() {

    const message =
      document.getElementById("orderMessage");

    message.className = "message";
    message.style.display = "none";

    if (panier.length === 0) {

      afficherMessage(
        "Ajoute au moins un produit au panier.",
        "error"
      );

      return;
    }

    const nom =
      document
        .getElementById("customerName")
        .value
        .trim();

    const telephone =
      document
        .getElementById("customerPhone")
        .value
        .trim();

    const adresse =
      document
        .getElementById("customerAddress")
        .value
        .trim();

    const commentaire =
      document
        .getElementById("customerComment")
        .value
        .trim();

    if (!nom || !telephone || !adresse) {

      afficherMessage(
        "Remplis ton nom, ton téléphone et ton adresse.",
        "error"
      );

      return;
    }

    let total = 0;

    panier.forEach(item => {

      total +=
        Number(item.price) *
        Number(item.quantite);

    });


    /* =========================
       ENREGISTREMENT SUPABASE
    ========================= */

    const {
      data,
      error
    } =
      await supabaseClient
        .from("Orders")
        .insert([
          {
            Customer_name: nom,
            Phone: telephone,
            Address:
              adresse
              + (
                commentaire
                  ? " | Commentaire : " + commentaire
                  : ""
              ),
            Total: total,
            Status: "Nouvelle"
          }
        ])
        .select()
        .single();

    if (error) {

      console.error(error);

      afficherMessage(
        "La commande n'a pas pu être enregistrée. Vérifie les autorisations Supabase.",
        "error"
      );

      return;
    }


    /* =========================
       MESSAGE WHATSAPP
    ========================= */

    let texte =
      "Bonjour YAYOUNABYSAC,%0A%0A";

    texte +=
      "Je souhaite passer une commande.%0A%0A";

    texte +=
      "Client : "
      + encodeURIComponent(nom)
      + "%0A";

    texte +=
      "Téléphone : "
      + encodeURIComponent(telephone)
      + "%0A";

    texte +=
      "Adresse : "
      + encodeURIComponent(adresse)
      + "%0A%0A";

    texte +=
      "Produits :%0A";

    panier.forEach(item => {

      const sousTotal =
        Number(item.price) *
        Number(item.quantite);

      texte +=
        "- "
        + encodeURIComponent(item.name)
        + " x"
        + item.quantite
        + " = "
        + sousTotal.toLocaleString("fr-FR")
        + " FCFA%0A";

    });

    texte +=
      "%0ATotal : "
      + total.toLocaleString("fr-FR")
      + " FCFA%0A";

    if (commentaire) {

      texte +=
        "%0ACommentaire : "
        + encodeURIComponent(commentaire);

    }


    /* =========================
       VIDER PANIER
    ========================= */

    panier = [];

    sauvegarderPanier();
    afficherPanier();


    afficherMessage(
      "Commande enregistrée. Ouverture de WhatsApp...",
      "success"
    );


    setTimeout(() => {

      window.open(
        "https://wa.me/221775124928?text="
        + texte,
        "_blank"
      );

    }, 500);

  }


  /* =========================
     MESSAGE
  ========================= */

  function afficherMessage(texte, type) {

    const message =
      document.getElementById("orderMessage");

    message.textContent =
      texte;

    message.className =
      "message " + type;

    message.style.display =
      "block";
  }


  /* =========================
     DÉMARRAGE
  ========================= */

  chargerProduits();

</script>

</body>
</html>
