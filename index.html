<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://ajprnhqphbtgfztspuio.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   CONFIGURATION
========================================================= */

const WHATSAPP_NUMBER =
  "221775124928";

const CART_KEY =
  "yayounabysac_panier";


/* =========================================================
   VARIABLES
========================================================= */

let produits = [];

let panier =
  chargerPanier();

let categorieActive =
  "Toutes";


/* =========================================================
   OUTILS
========================================================= */

function convertirPrix(valeur){

  if(
    valeur === null ||
    valeur === undefined
  ){
    return 0;
  }

  if(typeof valeur === "number"){

    return Number.isFinite(valeur)
      ? valeur
      : 0;
  }

  const propre =
    String(valeur)
      .replace(/\s/g,"")
      .replace(/FCFA/gi,"")
      .replace(/,/g,".")
      .trim();

  const nombre =
    Number(propre);

  return Number.isFinite(nombre)
    ? nombre
    : 0;
}


function convertirNombre(valeur){

  const nombre =
    Number(valeur);

  return Number.isFinite(nombre)
    ? nombre
    : 0;
}


function formaterPrix(prix){

  const nombre =
    convertirPrix(prix);

  return (
    nombre.toLocaleString("fr-FR") +
    " FCFA"
  );
}


function imageProduit(produit){

  const url =
    produit.Image_url ||
    produit.image_url ||
    produit.image ||
    "";

  if(url){
    return url;
  }

  return "https://via.placeholder.com/600x600?text=YAYOUNABYSAC";
}


function getPrixProduit(produit){

  return convertirPrix(
    produit.Price ??
    produit.price ??
    produit.prix ??
    0
  );
}


function getStockProduit(produit){

  return convertirNombre(
    produit.Stock ??
    produit.stock ??
    0
  );
}


function getCategorieProduit(produit){

  return (
    produit.Category ||
    produit.category ||
    "Autres"
  );
}


/* =========================================================
   PANIER
========================================================= */

function chargerPanier(){

  try{

    const sauvegarde =
      localStorage.getItem(
        CART_KEY
      );

    if(!sauvegarde){
      return [];
    }

    const donnees =
      JSON.parse(sauvegarde);

    return Array.isArray(donnees)
      ? donnees
      : [];

  }catch(erreur){

    console.error(
      "Erreur chargement panier :",
      erreur
    );

    return [];
  }
}


function sauvegarderPanier(){

  localStorage.setItem(
    CART_KEY,
    JSON.stringify(panier)
  );

  mettreAJourCompteurPanier();
}


function viderPanier(){

  panier = [];

  sauvegarderPanier();

  afficherPanier();
}


function nombreArticlesPanier(){

  return panier.reduce(
    (total, article) =>
      total +
      convertirNombre(
        article.quantity
      ),
    0
  );
}


function calculerTotalPanier(){

  return panier.reduce(
    (total, article) => {

      const prix =
        convertirPrix(
          article.price
        );

      const quantite =
        convertirNombre(
          article.quantity
        );

      return total +
        (prix * quantite);

    },
    0
  );
}


function mettreAJourCompteurPanier(){

  const compteur =
    document.getElementById(
      "cartCount"
    );

  if(compteur){

    compteur.textContent =
      nombreArticlesPanier();

  }
}


/* =========================================================
   AJOUT AU PANIER — PROTECTION DU STOCK
========================================================= */

function ajouterAuPanier(produit){

  const id = Number(produit.id);
  const prix = getPrixProduit(produit);
  const stock = getStockProduit(produit);

  if(!id){
    alert("Produit invalide.");
    return;
  }

  if(prix <= 0){
    alert("Le prix de ce produit est invalide.");
    return;
  }

  if(stock <= 0){
    alert("Ce produit est en rupture de stock. Il ne peut pas être ajouté au panier.");
    return;
  }

  const articleExistant =
    panier.find(
      article =>
        Number(article.id) === id
    );

  if(articleExistant){

    const quantiteActuelle =
      convertirNombre(
        articleExistant.quantity
      );

    if(quantiteActuelle >= stock){
      alert(
        "Stock maximum atteint. Quantité disponible : " +
        stock +
        "."
      );
      return;
    }

    articleExistant.quantity =
      quantiteActuelle + 1;

    articleExistant.price =
      prix;

    articleExistant.stock =
      stock;

  }else{

    panier.push({

      id: id,

      name:
        produit.name ||
        "Produit",

      description:
        produit.description ||
        "",

      price:
        prix,

      image_url:
        imageProduit(produit),

      category:
        getCategorieProduit(produit),

      stock:
        stock,

      quantity:
        1

    });

  }

  sauvegarderPanier();

  alert(
    "Produit ajouté au panier."
  );

  ouvrirPanier();
}


/* =========================================================
   MODIFICATION DES QUANTITÉS — PROTECTION DU STOCK
========================================================= */

function modifierQuantite(
  id,
  variation
){

  const article =
    panier.find(
      item =>
        Number(item.id) ===
        Number(id)
    );

  if(!article){
    return;
  }

  const stock =
    convertirNombre(
      article.stock
    );

  if(stock <= 0){

    alert(
      "Ce produit est en rupture de stock. Il va être retiré du panier."
    );

    supprimerDuPanier(id);

    return;
  }

  let nouvelleQuantite =
    convertirNombre(
      article.quantity
    ) + variation;

  if(nouvelleQuantite < 1){
    nouvelleQuantite = 1;
  }

  if(nouvelleQuantite > stock){

    alert(
      "Stock maximum atteint. Quantité disponible : " +
      stock +
      "."
    );

    nouvelleQuantite =
      stock;
  }

  article.quantity =
    nouvelleQuantite;

  sauvegarderPanier();

  afficherPanier();

  afficherResumeCommande();
}


function supprimerDuPanier(id){

  panier =
    panier.filter(
      item =>
        Number(item.id) !==
        Number(id)
    );

  sauvegarderPanier();

  afficherPanier();

  afficherResumeCommande();
}


/* =========================================================
   PRODUITS SUPABASE
========================================================= */

async function chargerProduits(){

  const zone =
    document.getElementById(
      "productsGrid"
    );

  zone.innerHTML =
    '<div class="loading">Chargement des produits...</div>';

  try{

    const {
      data,
      error
    } =
      await supabaseClient
        .from("Products")
        .select("*")
        .order(
          "id",
          {
            ascending:false
          }
        );

    if(error){
      throw error;
    }

    produits =
      Array.isArray(data)
        ? data
        : [];

    afficherCategories();

    appliquerFiltres();

    synchroniserPrixPanier();

  }catch(erreur){

    console.error(erreur);

    zone.innerHTML = `
      <div class="empty-products">
        Impossible de charger les produits.
      </div>
    `;
  }
}


/* =========================================================
   SYNCHRONISATION DU PANIER AVEC LE STOCK RÉEL
========================================================= */

function synchroniserPrixPanier(){

  let modification = false;
  let produitsRetires = 0;

  panier = panier.filter(article => {

    const produit =
      produits.find(
        p =>
          Number(p.id) ===
          Number(article.id)
      );

    if(!produit){
      modification = true;
      produitsRetires++;
      return false;
    }

    const nouveauStock =
      getStockProduit(produit);

    if(nouveauStock <= 0){
      modification = true;
      produitsRetires++;
      return false;
    }

    const nouveauPrix =
      getPrixProduit(produit);

    if(
      convertirPrix(article.price) !==
      nouveauPrix
    ){

      article.price =
        nouveauPrix;

      modification = true;
    }

    article.stock =
      nouveauStock;

    if(
      convertirNombre(article.quantity) >
      nouveauStock
    ){

      article.quantity =
        nouveauStock;

      modification = true;
    }

    article.name =
      produit.name ||
      article.name;

    article.description =
      produit.description ||
      article.description ||
      "";

    article.image_url =
      imageProduit(produit);

    article.category =
      getCategorieProduit(produit);

    return true;
  });

  if(modification){
    sauvegarderPanier();
  }

  mettreAJourCompteurPanier();

  if(produitsRetires > 0){

    alert(
      "Un ou plusieurs produits indisponibles ont été retirés du panier. Vérifiez votre panier avant de commander."
    );
  }
}

/* =========================================================
   AFFICHAGE DES PRODUITS
========================================================= */

function appliquerFiltres(){

  const recherche =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .toLowerCase()
      .trim();

  let resultat =
    [...produits];

  if(
    categorieActive !==
    "Toutes"
  ){

    resultat =
      resultat.filter(
        produit =>
          getCategorieProduit(
            produit
          ) ===
          categorieActive
      );
  }

  if(recherche){

    resultat =
      resultat.filter(
        produit => {

          const nom =
            String(
              produit.name ||
              ""
            ).toLowerCase();

          const description =
            String(
              produit.description ||
              ""
            ).toLowerCase();

          const categorie =
            String(
              getCategorieProduit(
                produit
              )
            ).toLowerCase();

          return (
            nom.includes(recherche) ||
            description.includes(recherche) ||
            categorie.includes(recherche)
          );
        }
      );
  }

  afficherProduits(
    resultat
  );
}

  );

/* =========================================================
   ENVOI DE LA COMMANDE
========================================================= */

document
  .getElementById(
    "checkoutForm"
  )
  .addEventListener(
    "submit",
    envoyerCommande
  );


async function envoyerCommande(
  event
){

  event.preventDefault();

  if(!panier.length){

    afficherErreurCommande(
      "Votre panier est vide."
    );

    return;
  }


  /* =======================================================
     RECALCUL DU TOTAL DEPUIS SUPABASE
  ======================================================= */

  let totalCommande =
    0;

  const lignesCommande =
    [];


  for(
    const article of panier
  ){

    const produit =
      produits.find(
        p =>
          Number(p.id) ===
          Number(article.id)
      );


    if(!produit){

      afficherErreurCommande(
        "Impossible de retrouver le produit " +
        (article.name || "") +
        " dans la base de données."
      );

      return;
    }


    const prix =
      Number(
        produit.Price ??
        produit.price ??
        produit.prix ??
        0
      );


    const quantite =
      Number(
        article.quantity ||
        0
      );


    const stock =
      getStockProduit(produit);


    if(
      !Number.isFinite(prix) ||
      prix <= 0
    ){

      afficherErreurCommande(
        "Le prix du produit " +
        (produit.name || "") +
        " est invalide."
      );

      return;
    }


    if(
      !Number.isFinite(quantite) ||
      quantite <= 0
    ){

      afficherErreurCommande(
        "La quantité du produit est invalide."
      );

      return;
    }


    if(stock <= 0){

      afficherErreurCommande(
        "Le produit " +
        (produit.name || "") +
        " est en rupture de stock. Retirez-le du panier."
      );

      return;
    }


    if(quantite > stock){

      afficherErreurCommande(
        "Stock insuffisant pour " +
        (produit.name || "ce produit") +
        ". Stock disponible : " +
        stock +
        "."
      );

      return;
    }


    const sousTotal =
      Math.round(
        prix * quantite
      );


    totalCommande +=
      sousTotal;


    article.price =
      Math.round(prix);


    lignesCommande.push({

      productId:
        Number(produit.id),

      name:
        produit.name ||
        "Produit",

      quantity:
        quantite,

      price:
        Math.round(prix),

      subtotal:
        sousTotal

    });

  }


  totalCommande =
    Math.round(
      totalCommande
    );


  console.log(
    "TOTAL FINAL ENVOYÉ À SUPABASE :",
    totalCommande
  );


  if(totalCommande <= 0){

    afficherErreurCommande(
      "Le total de la commande est égal à 0 FCFA."
    );

    return;
  }


  const nom =
    document
      .getElementById(
        "customerName"
      )
      .value
      .trim();


  const telephone =
    document
      .getElementById(
        "customerPhone"
      )
      .value
      .trim();


  const adresse =
    document
      .getElementById(
        "customerAddress"
      )
      .value
      .trim();


  const commentaire =
    document
      .getElementById(
        "customerComment"
      )
      .value
      .trim();


  if(
    !nom ||
    !telephone ||
    !adresse
  ){

    afficherErreurCommande(
      "Veuillez remplir le nom, le téléphone et l'adresse."
    );

    return;
  }


  const bouton =
    document.getElementById(
      "submitOrderBtn"
    );


  bouton.disabled =
    true;


  bouton.textContent =
    "Enregistrement de la commande...";


  try{

    /* =====================================================
       CRÉATION SÉCURISÉE DE LA COMMANDE
       Supabase recalcule les prix et le total côté serveur.
       La commande et ses articles sont enregistrés ensemble.
    ===================================================== */

    const articlesSecurises =
      lignesCommande.map(ligne => ({
        product_id: ligne.productId,
        quantity: ligne.quantity
      }));

    const {
      data: orderData,
      error: orderError
    } = await supabaseClient.rpc(
      "create_order_secure",
      {
        p_customer_name: nom,
        p_phone: telephone,
        p_address: adresse,
        p_items: articlesSecurises
      }
    );

    if(orderError){

      console.error(
        "ERREUR CREATE_ORDER_SECURE :",
        orderError
      );

      throw new Error(
        "Impossible d'enregistrer la commande : " +
        orderError.message
      );
    }

    console.log(
      "RÉPONSE CREATE_ORDER_SECURE :",
      orderData
    );


    /* =====================================================
       RÉCUPÉRATION DE L'IDENTIFIANT DE COMMANDE
    ===================================================== */

    let orderId = null;

    if(Array.isArray(orderData)){

      if(orderData.length > 0){

        const premier =
          orderData[0];

        if(
          premier &&
          typeof premier === "object"
        ){

          orderId =
            premier.id ??
            premier.order_id ??
            premier.create_order_secure;

        }else{

          orderId =
            premier;

        }
      }

    }else{

      orderId =
        orderData;

    }

    orderId =
      Number(orderId);

    if(
      !orderId ||
      !Number.isFinite(orderId)
    ){

      console.error(
        "Retour create_order_secure :",
        orderData
      );

      throw new Error(
        "La commande a été enregistrée mais son identifiant n'a pas pu être récupéré."
      );
    }


    /* =====================================================
       CONSTRUCTION DU MESSAGE WHATSAPP
    ===================================================== */

    const lignesWhatsApp =
      lignesCommande.map(
        ligne =>
          "* " +
          ligne.name +
          " × " +
          ligne.quantity +
          " — " +
          formaterPrix(
            ligne.subtotal
          )
      );


    const message =
      [
        "YAYOUNABYSAC — NOUVELLE COMMANDE",
        "",
        "Commande : #" +
          orderId,
        "Client : " +
          nom,
        "Téléphone : " +
          telephone,
        "Adresse : " +
          adresse,
        "",
        "Produits commandés :",
        ...lignesWhatsApp,
        "",
        "TOTAL : " +
          formaterPrix(
            totalCommande
          ),
        commentaire
          ? ""
          : null,
        commentaire
          ? "Commentaire : " +
            commentaire
          : null
      ]
      .filter(
        valeur =>
          valeur !== null
      )
      .join("\n");


    console.log(
      "MESSAGE WHATSAPP :",
      message
    );


    /* =====================================================
       NETTOYAGE DU PANIER APRÈS ENREGISTREMENT
    ===================================================== */

    panier = [];

    sauvegarderPanier();


    document
      .getElementById(
        "checkoutForm"
      )
      .reset();


    /* =====================================================
       ENCODAGE ET OUVERTURE WHATSAPP
    ===================================================== */

    const whatsappURL =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(
        message
      );


    window.location.href =
      whatsappURL;


  }catch(erreur){

    console.error(
      "ERREUR COMMANDE :",
      erreur
    );


    afficherErreurCommande(
      erreur.message ||
      "Une erreur est survenue pendant la commande."
    );


    bouton.disabled =
      false;


    bouton.textContent =
      "📱 Commander sur WhatsApp";
  }
}


function afficherErreurCommande(
  message
){

  const zone =
    document.getElementById(
      "checkoutNotice"
    );


  zone.className =
    "notice error show";


  zone.textContent =
    message;
}

========================================================= */

function ouvrirModal(id){

    document.getElementById(
      id
    );

  if(modal){

    modal.classList.add(
      "show"
    );

  }
}


function fermerModal(id){

  const modal =
    document.getElementById(
      id
    );

  if(modal){

    modal.classList.remove(
      "show"
    );

  }
}


document
  .querySelectorAll(
    ".modal-overlay"
  )
  .forEach(
    modal => {

      modal.addEventListener(
        "click",
        function(event){

          if(
            event.target ===
            modal
          ){

            modal.classList.remove(
              "show"
            );

          }

        }
      );

    }
  );


/* =========================================================
   PROTECTION AFFICHAGE HTML
========================================================= */

function echapperHTML(
  valeur
){

  return String(
    valeur ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function echapperAttribut(
  valeur
){

  return echapperHTML(
    valeur
  );
}

   INITIALISATION
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    mettreAJourCompteurPanier();

    await chargerProduits();

    mettreAJourCompteurPanier();

  }
