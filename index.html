<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#302016">
  <meta name="description" content="YAYOUNABY STORE : découvrez notre collection de sacs pour femme, élégants et raffinés.">
  <title>YAYOUNABY STORE — Sacs pour femme</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --cream: #fbf6ed;
      --cream-dark: #f1e5d3;
      --white: #fffdf9;
      --chocolate: #302016;
      --brown: #60402e;
      --brown-light: #8b6850;
      --gold: #c5a15b;
      --gold-light: #e3ce9b;
      --text: #35261e;
      --muted: #827369;
      --border: #e8dccb;
      --shadow: 0 16px 42px rgba(48,32,22,.14);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 0% 20%, rgba(197,161,91,.07), transparent 30%),
        var(--cream);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px;
    }

    .announcement {
      padding: 11px 14px;
      text-align: center;
      color: var(--cream);
      background: linear-gradient(100deg, #24160f, #493020, #24160f);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .announcement span {
      color: var(--gold-light);
      font-weight: bold;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,253,249,.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--gold-light);
      box-shadow: 0 5px 22px rgba(48,32,22,.05);
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      text-decoration: none;
    }

    .brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 50%;
      background: var(--cream);
      border: 1px solid rgba(197,161,91,.5);
      box-shadow: 0 4px 15px rgba(48,32,22,.09);
      transition: transform .4s ease;
    }

    .brand:hover img { transform: rotate(-5deg) scale(1.05); }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(15px, 3vw, 23px);
      font-weight: bold;
      letter-spacing: 1.5px;
      color: var(--chocolate);
    }

    .brand-subtitle {
      margin-top: 4px;
      font-size: 9px;
      letter-spacing: 2px;
      color: #a27d3e;
      text-transform: uppercase;
    }

    .cart-button {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--gold);
      border-radius: 30px;
      background: linear-gradient(120deg, var(--chocolate), #63432e);
      color: white;
      padding: 11px 14px;
      font-weight: bold;
      transition: transform .25s, box-shadow .25s;
    }

    .cart-button:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .cart-number {
      min-width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--chocolate);
      background: var(--gold-light);
      font-size: 12px;
      font-weight: bold;
    }

    /* BANNIÈRE PRINCIPALE */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 72px 20px 68px;
      text-align: center;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(197,161,91,.26), transparent 35%),
        radial-gradient(ellipse at 90% 80%, rgba(139,104,80,.2), transparent 32%),
        linear-gradient(135deg, #fffdf9 0%, #f4e8d6 50%, #ead5b5 100%);
    }

    .hero::before, .hero::after {
      content: "✦";
      position: absolute;
      z-index: -1;
      color: rgba(180,137,62,.55);
      font-size: 110px;
      animation: sparkle 4s ease-in-out infinite;
      pointer-events: none;
    }

    .hero::before { left: 7%; top: 18%; }
    .hero::after {
      right: 8%;
      bottom: 12%;
      font-size: 72px;
      animation-delay: 1.2s;
    }

    .hero-inner {
      max-width: 820px;
      margin: auto;
      animation: heroReveal 1s ease both;
    }

    .eyebrow {
      color: var(--brown-light);
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .hero h1 {
      margin: 18px 0 15px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(35px, 7vw, 67px);
      line-height: 1.08;
      color: var(--chocolate);
      font-weight: 500;
    }

    .hero h1 em {
      color: #9b7740;
      font-weight: 500;
    }

    .hero p {
      max-width: 570px;
      margin: 0 auto 27px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .primary-button, .secondary-button {
      border-radius: 30px;
      padding: 14px 23px;
      font-weight: bold;
      transition: transform .25s, box-shadow .25s, background .25s;
    }

    .primary-button {
      border: 1px solid var(--gold);
      color: white;
      background: linear-gradient(115deg, #302016, #765033, #302016);
      background-size: 200% 100%;
      box-shadow: 0 8px 22px rgba(48,32,22,.2);
    }

    .primary-button:hover {
      transform: translateY(-3px);
      background-position: 100% 0;
      box-shadow: 0 12px 28px rgba(48,32,22,.28);
    }

    .secondary-button {
      background: var(--cream-dark);
      color: var(--chocolate);
      border: 1px solid var(--border);
    }

    .secondary-button:hover { transform: translateY(-2px); }

    .benefits {
      max-width: 1000px;
      margin: -1px auto 0;
      padding: 23px 15px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: var(--white);
      border-bottom: 1px solid var(--gold-light);
    }

    .benefit {
      text-align: center;
      font-size: 12px;
      color: var(--brown);
    }

    .benefit strong {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: var(--chocolate);
    }

    .benefit-icon {
      display: block;
      margin-bottom: 7px;
      font-size: 25px;
      color: var(--gold);
    }

    main {
      max-width: 1250px;
      margin: auto;
      padding: 48px 20px 70px;
    }

    .section-heading {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-heading .eyebrow { font-size: 10px; }

    .section-heading h2 {
      margin: 10px 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 500;
      color: var(--chocolate);
    }

    .section-heading p {
      color: var(--muted);
      font-size: 13px;
    }

    .search-wrap {
      max-width: 580px;
      margin: 0 auto 20px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 16px 18px 16px 45px;
      background: var(--white);
      color: var(--text);
      box-shadow: 0 5px 18px rgba(48,32,22,.05);
      transition: border-color .25s, box-shadow .25s;
    }

    .search-wrap input:focus {
      border-color: var(--gold);
      box-shadow: 0 5px 22px rgba(197,161,91,.16);
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 14px;
      font-size: 19px;
      color: var(--gold);
    }

    .categories {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 34px;
    }

    .category-chip {
      padding: 10px 17px;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: var(--white);
      color: var(--brown);
      font-size: 12px;
      transition: all .25s;
    }

    .category-chip:hover, .category-chip.active {
      color: white;
      background: linear-gradient(120deg, var(--chocolate), #68462e);
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(48,32,22,.13);
    }

    /* NOUVELLE PRÉSENTATION LUXUEUSE DES PRODUITS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .product-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: var(--white);
      border: 1px solid #e6d5b9;
      border-radius: 19px;
      box-shadow: 0 7px 22px rgba(48,32,22,.07);
      animation: cardAppear .65s both;
      transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    }

    .product-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      z-index: 2;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .75;
    }

    .product-card:hover {
      transform: translateY(-8px);
      border-color: var(--gold);
      box-shadow: 0 18px 38px rgba(48,32,22,.16);
    }

    .product-image-wrap {
      position: relative;
      overflow: hidden;
      aspect-ratio: 4 / 4.7;
      background:
        radial-gradient(ellipse at center, #fffdf9 0%, #f5ecdf 62%, #ead9bf 100%);
      cursor: pointer;
      border-bottom: 1px solid rgba(197,161,91,.3);
    }

    .product-image-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(140deg, rgba(255,255,255,.15), transparent 42%, rgba(197,161,91,.08));
      pointer-events: none;
    }

    .product-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .7s cubic-bezier(.2,.8,.2,1), filter .5s;
    }

    .product-card:hover .product-image {
      transform: scale(1.09);
      filter: saturate(1.05);
    }

    .product-label {
      position: absolute;
      top: 13px;
      left: 11px;
      z-index: 3;
      padding: 7px 10px;
      border: 1px solid rgba(197,161,91,.55);
      border-radius: 20px;
      color: var(--chocolate);
      background: rgba(255,253,249,.94);
      box-shadow: 0 3px 10px rgba(48,32,22,.07);
      font-size: 10px;
      letter-spacing: .5px;
    }

    .product-info {
      padding: 17px 15px 18px;
      display: flex;
      flex-direction: column;
      min-height: 195px;
    }

    .product-category {
      margin-bottom: 8px;
      color: #987443;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .product-name {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--chocolate);
      overflow-wrap: anywhere;
    }

    .product-price {
      color: #946d32;
      font-weight: bold;
      font-size: 17px;
      letter-spacing: .2px;
    }

    .product-stock {
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 15px;
    }

    .product-actions button {
      flex: 1;
      min-width: 0;
      padding: 11px 7px;
      font-size: 11px;
      font-weight: bold;
    }

    .add-button {
      border: 1px solid var(--chocolate);
      border-radius: 22px;
      background: linear-gradient(120deg, var(--chocolate), #67452e);
      color: white;
      transition: background .25s, transform .25s, box-shadow .25s;
    }

    .add-button:hover:not(:disabled) {
      background: linear-gradient(120deg, #765033, var(--chocolate));
      transform: translateY(-2px);
      box-shadow: 0 5px 14px rgba(48,32,22,.17);
    }

    .add-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .detail-button {
      border: 1px solid var(--gold-light);
      border-radius: 22px;
      background: var(--cream);
      color: var(--brown);
      transition: background .25s, border-color .25s;
    }

    .detail-button:hover {
      border-color: var(--gold);
      background: #f2e3ca;
    }

    .message-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 45px 15px;
      border-radius: 16px;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.7;
    }

    .message-state strong { color: var(--chocolate); }

    .promo {
      position: relative;
      overflow: hidden;
      margin-top: 60px;
      padding: 42px 20px;
      border: 1px solid var(--gold);
      border-radius: 22px;
      text-align: center;
      background:
        radial-gradient(ellipse at 10% 10%, rgba(197,161,91,.18), transparent 40%),
        linear-gradient(125deg, #f0e0c6, #fffaf1, #e8d1ae);
      box-shadow: 0 9px 25px rgba(48,32,22,.06);
    }

    .promo::before, .promo::after {
      content: "✧";
      position: absolute;
      color: rgba(160,117,49,.35);
      font-size: 54px;
      animation: sparkle 5s ease-in-out infinite;
      pointer-events: none;
    }

    .promo::before { top: 10px; left: 8%; }
    .promo::after { bottom: 8px; right: 8%; animation-delay: 1.5s; }

    .promo h3 {
      margin: 10px 0;
      font: 500 clamp(24px, 5vw, 36px) Georgia, "Times New Roman", serif;
      color: var(--chocolate);
    }

    .promo p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      padding: 38px 18px 95px;
      background: linear-gradient(135deg, #24160f, #493020, #24160f);
      color: #f7ecdc;
      text-align: center;
      border-top: 2px solid var(--gold);
    }

    .footer-brand {
      font: 500 27px Georgia, "Times New Roman", serif;
      letter-spacing: 2px;
    }

    footer p {
      color: #d7c4ad;
      font-size: 12px;
      line-height: 1.8;
    }

    .footer-handle {
      display: inline-block;
      margin-top: 4px;
      color: var(--gold-light);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      transition: color .25s, transform .25s;
    }

    .footer-handle:hover {
      color: #fffdf9;
      transform: translateY(-1px);
    }

    .footer-line {
      width: 75px;
      height: 2px;
      margin: 18px auto;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .floating-cart {
      position: fixed;
      z-index: 25;
      right: 18px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 19px;
      border: 1px solid var(--gold-light);
      border-radius: 35px;
      background: linear-gradient(120deg, var(--chocolate), #67452e);
      color: white;
      box-shadow: 0 8px 25px rgba(48,32,22,.28);
      animation: floatCart 3s ease-in-out infinite;
      transition: box-shadow .25s, transform .25s;
    }

    .floating-cart:hover {
      box-shadow: 0 12px 32px rgba(48,32,22,.36);
    }

    .floating-cart .cart-number { background: var(--gold-light); }

    /* FENÊTRES DU PANIER ET DE COMMANDE */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: 15px;
      background: rgba(26,17,12,.68);
      backdrop-filter: blur(6px);
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open {
      display: flex;
      animation: fadeIn .2s ease;
    }

    .modal-panel {
      width: 100%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 23px;
      border: 1px solid rgba(197,161,91,.5);
      border-radius: 23px 23px 13px 13px;
      background: var(--white);
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
      animation: slideUp .35s ease;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--gold-light);
    }

    .modal-head h2 {
      margin: 0;
      font: 500 25px Georgia, "Times New Roman", serif;
      color: var(--chocolate);
    }

    .close-button {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border: 1px solid var(--gold-light);
      border-radius: 50%;
      background: var(--cream);
      color: var(--chocolate);
      font-size: 22px;
    }

    .close-button:hover { background: var(--cream-dark); }

    .cart-empty {
      text-align: center;
      padding: 25px 8px;
      color: var(--muted);
      line-height: 1.7;
    }

    .cart-empty .empty-icon { font-size: 43px; margin-bottom: 8px; }

    .cart-item {
      display: grid;
      grid-template-columns: 68px minmax(0,1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item img {
      width: 68px;
      height: 75px;
      object-fit: cover;
      border-radius: 9px;
      background: var(--cream-dark);
    }

    .cart-item-name {
      font-weight: bold;
      font-size: 13px;
      line-height: 1.4;
    }

    .cart-item-price {
      margin-top: 5px;
      color: #946d32;
      font-size: 12px;
      font-weight: bold;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 9px;
    }

    .quantity-controls button {
      width: 28px;
      height: 28px;
      border: 1px solid var(--gold-light);
      border-radius: 50%;
      background: var(--cream);
      color: var(--chocolate);
    }

    .delete-button {
      border: 0;
      background: transparent;
      color: #a13d32;
      padding: 5px;
      font-size: 11px;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 20px 0;
      padding: 16px;
      border: 1px solid var(--gold-light);
      border-radius: 13px;
      background: linear-gradient(120deg, #fbf3e5, #fffdf9);
      font-weight: bold;
    }

    .cart-total strong {
      color: #946d32;
      text-align: right;
    }

    .full-button { width: 100%; margin-top: 10px; }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .detail-layout img {
      width: 100%;
      max-height: 340px;
      object-fit: cover;
      border: 1px solid var(--gold-light);
      border-radius: 15px;
      background: var(--cream-dark);
    }

    .detail-description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-line;
    }

    .detail-price {
      margin: 15px 0;
      font-size: 23px;
      font-weight: bold;
      color: #946d32;
    }

    .form-group { margin-bottom: 14px; }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: bold;
      color: var(--brown);
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fffefa;
      color: var(--text);
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(197,161,91,.13);
    }

    .form-group textarea { min-height: 80px; resize: vertical; }

    .form-hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .notice {
      display: none;
      margin: 12px 0;
      padding: 12px;
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.6;
    }

    .notice.show { display: block; }
    .notice.error { background: #fff0ee; color: #942f25; border: 1px solid #efc4be; }
    .notice.success { background: #edf8ee; color: #236a35; border: 1px solid #b9dfbf; }
    .submit-button:disabled { opacity: .6; cursor: wait; }

    @keyframes heroReveal {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(22px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(35px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes sparkle {
      0%,100% { transform: rotate(0) scale(.9); opacity: .45; }
      50% { transform: rotate(20deg) scale(1.15); opacity: .9; }
    }

    @keyframes floatCart {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @media (max-width: 1000px) {
      .products-grid {
        grid-template-columns: repeat(3, minmax(0,1fr));
        gap: 17px;
      }
    }

    @media (max-width: 620px) {
