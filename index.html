<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC — Sacs pour femme</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#faf8f6;
      color:#30231e;
      min-height:100vh;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#fff;
      border-bottom:1px solid #eee;
    }

    .header-inner{
      max-width:1200px;
      margin:auto;
      padding:14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
    }

    .logo{
      font-size:22px;
      font-weight:800;
      color:#30231e;
      letter-spacing:.5px;
    }

    .cart-button{
      border:0;
      background:#8b6250;
      color:#fff;
      border-radius:25px;
      padding:10px 15px;
      font-weight:700;
    }

    .cart-button span{
      background:#fff;
      color:#8b6250;
      border-radius:50%;
      padding:2px 7px;
      margin-left:5px;
    }

    .hero{
      max-width:1200px;
      margin:auto;
      padding:45px 18px 25px;
      text-align:center;
    }

    .hero h1{
      font-size:34px;
      margin-bottom:10px;
    }

    .hero p{
      color:#766b66;
      font-size:16px;
    }

    .search-area{
      max-width:1200px;
      margin:auto;
      padding:0 18px 25px;
    }

    .search-input{
      width:100%;
      padding:14px 16px;
      border:1px solid #ddd;
      border-radius:12px;
      background:#fff;
      outline:none;
    }

    .search-input:focus{
      border-color:#8b6250;
    }

    .categories{
      max-width:1200px;
      margin:auto;
      padding:0 18px 25px;
      display:flex;
      gap:8px;
      overflow-x:auto;
    }

    .category-btn{
      border:1px solid #ddd;
      background:#fff;
      color:#30231e;
      padding:9px 15px;
      border-radius:22px;
      white-space:nowrap;
    }

    .category-btn.active{
      background:#8b6250;
      color:#fff;
      border-color:#8b6250;
    }

    .products-section{
      max-width:1200px;
      margin:auto;
      padding:0 18px 50px;
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:18px;
    }

    .product-card{
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
      border:1px solid #eee;
    }

    .product-image{
      width:100%;
      height:210px;
      object-fit:cover;
      background:#f1ece8;
      display:block;
    }

    .product-info{
      padding:14px;
    }

    .product-category{
      font-size:12px;
      color:#8b6250;
      margin-bottom:5px;
    }

    .product-name{
      font-size:17px;
      font-weight:700;
      margin-bottom:7px;
    }

    .product-description{
      font-size:13px;
      color:#766b66;
      min-height:35px;
      margin-bottom:10px;
    }

    .product-price{
      font-size:18px;
      font-weight:800;
      margin-bottom:12px;
    }

    .product-actions{
      display:flex;
      gap:8px;
    }

    .btn-primary{
      flex:1;
      border:0;
      background:#8b6250;
      color:#fff;
      padding:11px;
      border-radius:10px;
      font-weight:700;
    }

    .btn-secondary{
      border:1px solid #ddd;
      background:#fff;
      color:#30231e;
      padding:11px 12px;
      border-radius:10px;
    }

    .empty-products{
      text-align:center;
      padding:50px 20px;
      color:#766b66;
    }

    .floating-cart{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:900;
      background:#8b6250;
      color:#fff;
      border:0;
      border-radius:50px;
      padding:14px 20px;
      font-weight:700;
      box-shadow:0 5px 20px rgba(0,0,0,.2);
    }

    .modal-overlay{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      z-index:2000;
      align-items:flex-end;
      justify-content:center;
    }

    .modal-overlay.show{
      display:flex;
    }

    .modal{
      width:100%;
      max-width:650px;
      max-height:92vh;
      overflow-y:auto;
      background:#fff;
      border-radius:22px 22px 0 0;
      padding:20px;
      animation:slideUp .2s ease;
    }

    @keyframes slideUp{
      from{
        transform:translateY(100%);
      }
      to{
        transform:translateY(0);
      }
    }

    .modal-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
      gap:10px;
    }

    .modal-header h2{
      font-size:21px;
    }

    .close-btn{
      width:38px;
      height:38px;
      border-radius:50%;
      border:0;
      background:#f1ece8;
      color:#30231e;
      font-size:22px;
    }

    .cart-item{
      display:flex;
      gap:12px;
      padding:12px 0;
      border-bottom:1px solid #eee;
    }

    .cart-item-image{
      width:75px;
      height:75px;
      object-fit:cover;
      border-radius:10px;
      background:#f1ece8;
      flex-shrink:0;
    }

    .cart-item-info{
      flex:1;
    }

    .cart-item-name{
      font-weight:700;
      margin-bottom:5px;
    }

    .cart-item-price{
      color:#8b6250;
      font-weight:700;
      margin-bottom:8px;
    }

    .quantity-controls{
      display:flex;
      align-items:center;
      gap:8px;
    }

    .quantity-btn{
      width:30px;
      height:30px;
      border:1px solid #ddd;
      background:#fff;
      border-radius:8px;
      font-weight:700;
    }

    .delete-btn{
      margin-left:8px;
      border:0;
      background:none;
      color:#b33;
      font-size:13px;
    }

    .cart-total{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:18px;
      padding-top:15px;
      border-top:2px solid #eee;
      font-size:19px;
      font-weight:800;
    }

    .cart-actions{
      display:flex;
      gap:10px;
      margin-top:18px;
    }

    .cart-actions button{
      flex:1;
    }

    .checkout-form{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .form-group{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .form-group label{
      font-weight:700;
      font-size:14px;
    }

    .form-group input,
    .form-group textarea{
      width:100%;
      padding:13px;
      border:1px solid #ddd;
      border-radius:10px;
      outline:none;
      background:#fff;
    }

    .form-group input:focus,
    .form-group textarea:focus{
      border-color:#8b6250;
    }

    .form-group textarea{
      min-height:90px;
      resize:vertical;
    }

    .checkout-summary{
      background:#faf8f6;
      border-radius:12px;
      padding:14px;
      margin-bottom:15px;
    }

    .checkout-summary-item{
      display:flex;
      justify-content:space-between;
      gap:10px;
      padding:5px 0;
      font-size:14px;
    }

    .checkout-summary-total{
      display:flex;
      justify-content:space-between;
      border-top:1px solid #ddd;
      margin-top:8px;
      padding-top:10px;
      font-weight:800;
      font-size:18px;
    }

    .product-detail-image{
      width:100%;
      max-height:400px;
      object-fit:cover;
      border-radius:15px;
      background:#f1ece8;
      margin-bottom:15px;
    }

    .product-detail-price{
      font-size:22px;
      font-weight:800;
      color:#8b6250;
      margin:12px 0;
    }

    .product-detail-description{
      color:#665d58;
      line-height:1.6;
      margin-bottom:18px;
      white-space:pre-line;
    }

    .notice{
      padding:12px 14px;
      border-radius:10px;
      margin-bottom:15px;
      font-size:14px;
      display:none;
    }

    .notice.show{
      display:block;
    }

    .notice.error{
      background:#fff0f0;
      color:#a40000;
    }

    .notice.success{
      background:#edf9ef;
      color:#24702d;
    }

    .loading{
      text-align:center;
      padding:40px 20px;
      color:#766b66;
    }

    footer{
      text-align:center;
      padding:35px 18px;
      background:#30231e;
      color:#fff;
      margin-top:30px;
    }

    @media(max-width:600px){
      .hero h1{
        font-size:27px;
      }

      .products-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
      }

      .product-image{
        height:180px;
      }

      .product-info{
        padding:11px;
      }

      .product-name{
        font-size:15px;
      }

      .product-description{
        font-size:12px;
      }

      .product-price{
        font-size:16px;
      }

      .btn-primary,
      .btn-secondary{
        padding:9px 7px;
        font-size:13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">YAYOUNABYSAC</div>

    <button class="cart-button" onclick="ouvrirPanier()">
      🛒 Panier
      <span id="cartCount">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <h1>Des sacs élégants pour femme</h1>
  <p>Découvrez notre sélection YAYOUNABYSAC.</p>
</section>

<section class="search-area">
  <input
    id="searchInput"
    class="search-input"
    type="search"
    placeholder="🔎 Rechercher un sac..."
    oninput="appliquerFiltres()"
  >
</section>

<div id="categories" class="categories"></div>

<section class="products-section">
  <div id="productsGrid" class="products-grid">
    <div class="loading">Chargement des produits...</div>
  </div>
</section>

<footer>
  <p>© 2026 YAYOUNABYSAC — Sacs pour femme</p>
</footer>

<button class="floating-cart" onclick="ouvrirPanier()">
  🛒 Voir le panier
</button>


<!-- ==================== MODAL PANIER ==================== -->

<div id="cartModal" class="modal-overlay">
  <div class="modal">

    <div class="modal-header">
      <h2>🛒 Votre panier</h2>
      <button class="close-btn" onclick="fermerModal('cartModal')">×</button>
    </div>

    <div id="cartContent"></div>

  </div>
</div>


<!-- ==================== MODAL PRODUIT ==================== -->

<div id="productModal" class="modal-overlay">
  <div class="modal">

    <div class="modal-header">
      <h2 id="detailName">Produit</h2>
      <button class="close-btn" onclick="fermerModal('productModal')">×</button>
    </div>

    <div id="productDetailContent"></div>

  </div>
</div>


<!-- ==================== MODAL COMMANDE ==================== -->

<div id="checkoutModal" class="modal-overlay">
  <div class="modal">

    <div class="modal-header">
      <h2>🧾 Passer la commande</h2>
      <button class="close-btn" onclick="fermerModal('checkoutModal')">×</button>
    </div>

    <div id="checkoutNotice" class="notice"></div>

    <div id="checkoutSummary" class="checkout-summary"></div>

    <form id="checkoutForm" class="checkout-form">

      <div class="form-group">
        <label for="customerName">Nom</label>
        <input
          id="customerName"
          type="text"
          placeholder="Votre nom"
          required
        >
      </div>

      <div class="form-group">
        <label for="customerPhone">Téléphone</label>
        <input
          id="customerPhone"
          type="tel"
          placeholder="Votre numéro de téléphone"
          required
        >
      </div>

      <div class="form-group">
        <label for="customerAddress">Adresse / Quartier</label>
        <input
          id="customerAddress"
          type="text"
          placeholder="Exemple : Dakar, Parcelles Assainies"
          required
        >
      </div>

      <div class="form-group">
        <label for="customerComment">Commentaire</label>
        <textarea
          id="customerComment"
          placeholder="Un commentaire concernant votre commande..."
        ></textarea>
      </div>

      <button
        id="submitOrderBtn"
        type="submit"
        class="btn-primary"
      >
        📱 Commander sur WhatsApp
      </button>

    </form>

  </div>
</div>


<script>
  /* =========================================================
     SUPABASE
  ========================================================= */

  const SUPABASE_URL = "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* =========================================================
     CONFIGURATION
  ========================================================= */

  const WHATSAPP_NUMBER = "221775124928";

  const CART_KEY = "yayounabysac_panier";


  /* =========================================================
     VARIABLES
  ========================================================= */

  let produits = [];

  let panier = chargerPanier();

  let categorieActive = "Toutes";


  /* =========================================================
     OUTILS
  ========================================================= */

  function convertirPrix(valeur){

    if(valeur === null || valeur === undefined){
      return 0;
    }

    if(typeof valeur === "number"){
      return Number.isFinite(valeur) ? valeur : 0;
    }

    const propre = String(valeur)
      .replace(/\s/g, "")
      .replace(/FCFA/gi, "")
      .replace(/,/g, ".")
      .trim();

    const nombre = Number(propre);

    return Number.isFinite(nombre) ? nombre : 0;
  }


  function convertirNombre(valeur){

    const nombre = Number(valeur);

    return Number.isFinite(nombre) ? nombre : 0;
  }


  function formaterPrix(prix){

    const nombre = convertirPrix(prix);

    return nombre.toLocaleString("fr-FR") + " FCFA";
  }


  function imageProduit(produit){

    const url =
      produit.Image_url ||
      produit.image_url ||
      produit.image ||
      "";

    if(url){
      return url;
    }

    return "https://via.placeholder.com/600x600?text=YAYOUNABYSAC";
  }


  function getPrixProduit(produit){

    return convertirPrix(
      produit.Price ??
      produit.price ??
      produit.prix ??
      0
    );
  }


  function getStockProduit(produit){

    return convertirNombre(
      produit.Stock ??
      produit.stock ??
      0
    );
  }


  function getCategorieProduit(produit){

    return (
      produit.Category ||
      produit.category ||
      "Autres"
    );
  }


  /* =========================================================
     PANIER
  ========================================================= */

  function chargerPanier(){

    try{

      const sauvegarde = localStorage.getItem(CART_KEY);

      if(!sauvegarde){
        return [];
      }

      const donnees = JSON.parse(sauvegarde);

      return Array.isArray(donnees) ? donnees : [];

    }catch(erreur){

      console.error("Erreur chargement panier :", erreur);

      return [];
    }
  }


  function sauvegarderPanier(){

    localStorage.setItem(
      CART_KEY,
      JSON.stringify(panier)
    );

    mettreAJourCompteurPanier();
  }


  function viderPanier(){

    panier = [];

    sauvegarderPanier();

    afficherPanier();
  }


  function nombreArticlesPanier(){

    return panier.reduce(
      (total, article) =>
        total + convertirNombre(article.quantity),
      0
    );
  }


  function calculerTotalPanier(){

    /*
      IMPORTANT :
      Le prix est recalculé à partir du produit/prix
      réellement présent dans le panier.

      Cela évite que le total envoyé à Supabase
      soit 0 FCFA.
    */

    return panier.reduce(
      (total, article) => {

        const prix = convertirPrix(article.price);

        const quantite = convertirNombre(article.quantity);

        return total + (prix * quantite);

      },
      0
    );
  }


  function mettreAJourCompteurPanier(){

    const compteur = document.getElementById("cartCount");

    if(compteur){
      compteur.textContent = nombreArticlesPanier();
    }
  }


  function ajouterAuPanier(produit){

    const id = Number(produit.id);

    const prix = getPrixProduit(produit);

    const stock = getStockProduit(produit);

    if(!id){
      alert("Produit invalide.");
      return;
    }

    if(prix <= 0){
      alert("Le prix de ce produit est invalide.");
      return;
    }

    const articleExistant = panier.find(
      article => Number(article.id) === id
    );

    if(articleExistant){

      if(stock > 0 &&
         convertirNombre(articleExistant.quantity) >= stock){

        alert("Stock maximum atteint.");
        return;
      }

      articleExistant.quantity =
        convertirNombre(articleExistant.quantity) + 1;

      /*
        On remet également le prix actuel du produit.
      */
      articleExistant.price = prix;

    }else{

      panier.push({

        id: id,

        name:
          produit.name ||
          "Produit",

        description:
          produit.description ||
          "",

        price:
          prix,

        image_url:
          imageProduit(produit),

        category:
          getCategorieProduit(produit),

        stock:
          stock,

        quantity:
          1
      });
    }

    sauvegarderPanier();

    alert("Produit ajouté au panier.");

    ouvrirPanier();
  }


  function modifierQuantite(id, variation){

    const article = panier.find(
      item => Number(item.id) === Number(id)
    );

    if(!article){
      return;
    }

    let nouvelleQuantite =
      convertirNombre(article.quantity) + variation;

    const stock = convertirNombre(article.stock);

    if(nouvelleQuantite < 1){
      nouvelleQuantite = 1;
    }

    if(stock > 0 && nouvelleQuantite > stock){

      alert("Stock maximum atteint.");

      nouvelleQuantite = stock;
    }

    article.quantity = nouvelleQuantite;

    sauvegarderPanier();

    afficherPanier();

    afficherResumeCommande();
  }


  function supprimerDuPanier(id){

    panier = panier.filter(
      item => Number(item.id) !== Number(id)
    );

    sauvegarderPanier();

    afficherPanier();

    afficherResumeCommande();
  }


  /* =========================================================
     PRODUITS SUPABASE
  ========================================================= */

  async function chargerProduits(){

    const zone =
      document.getElementById("productsGrid");

    zone.innerHTML =
      '<div class="loading">Chargement des produits...</div>';

    try{

      const { data, error } =
        await supabaseClient
          .from("Products")
          .select("*")
          .order("id", { ascending:false });

      if(error){
        throw error;
      }

      produits = Array.isArray(data) ? data : [];

      afficherCategories();

      appliquerFiltres();

      /*
        Mise à jour du prix des articles déjà présents
        dans le panier avec les prix Supabase actuels.
      */

      synchroniserPrixPanier();

    }catch(erreur){

      console.error(erreur);

      zone.innerHTML = `
        <div class="empty-products">
          Impossible de charger les produits.
        </div>
      `;
    }
  }


  function synchroniserPrixPanier(){

    let modification = false;

    panier.forEach(article => {

      const produit = produits.find(
        p => Number(p.id) === Number(article.id)
      );

      if(produit){

        const nouveauPrix =
          getPrixProduit(produit);

        const nouveauStock =
          getStockProduit(produit);

        if(
          convertirPrix(article.price) !== nouveauPrix
        ){
          article.price = nouveauPrix;
          modification = true;
        }

        article.stock = nouveauStock;

        article.name =
          produit.name ||
          article.name;

        article.image_url =
          imageProduit(produit);

        article.category =
          getCategorieProduit(produit);
      }
    });

    if(modification){
      sauvegarderPanier();
    }

    mettreAJourCompteurPanier();
  }


  /* =========================================================
     CATEGORIES
  ========================================================= */

  function afficherCategories(){

    const zone =
      document.getElementById("categories");

    const categories = [
      "Toutes",
      ...new Set(
        produits
          .map(p => getCategorieProduit(p))
          .filter(Boolean)
      )
    ];

    zone.innerHTML = categories.map(categorie => `

      <button
        class="category-btn ${
          categorieActive === categorie
            ? "active"
            : ""
        }"
        onclick='choisirCategorie(${JSON.stringify(categorie)})'
      >
        ${echapperHTML(categorie)}
      </button>

    `).join("");
  }


  function choisirCategorie(categorie){

    categorieActive = categorie;

    afficherCategories();

    appliquerFiltres();
  }


  /* =========================================================
     AFFICHAGE PRODUITS
  ========================================================= */

  function appliquerFiltres(){

    const recherche =
      document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let resultat = [...produits];

    if(categorieActive !== "Toutes"){

      resultat = resultat.filter(
        produit =>
          getCategorieProduit(produit) ===
          categorieActive
      );
    }

    if(recherche){

      resultat = resultat.filter(produit => {

        const nom =
          String(produit.name || "")
            .toLowerCase();

        const description =
          String(produit.description || "")
            .toLowerCase();

        const categorie =
          String(getCategorieProduit(produit))
            .toLowerCase();

        return (
          nom.includes(recherche) ||
          description.includes(recherche) ||
          categorie.includes(recherche)
        );
      });
    }

    afficherProduits(resultat);
  }


  function afficherProduits(liste){

    const zone =
      document.getElementById("productsGrid");

    if(!liste.length){

      zone.innerHTML = `
        <div class="empty-products">
          Aucun produit trouvé.
        </div>
      `;

      return;
    }

    zone.innerHTML = liste.map(produit => {

      const prix = getPrixProduit(produit);

      const stock = getStockProduit(produit);

      return `

        <article class="product-card">

          <img
            class="product-image"
            src="${echapperAttribut(imageProduit(produit))}"
            alt="${echapperAttribut(produit.name || "Produit")}"
            onerror="this.src='https://via.placeholder.com/600x600?text=YAYOUNABYSAC'"
          >

          <div class="product-info">

            <div class="product-category">
              ${echapperHTML(getCategorieProduit(produit))}
            </div>

            <div class="product-name">
              ${echapperHTML(produit.name || "Produit")}
            </div>

            <div class="product-description">
              ${echapperHTML(
                produit.description || ""
              )}
            </div>

            <div class="product-price">
              ${formaterPrix(prix)}
            </div>

            <div class="product-actions">

              <button
                class="btn-primary"
                onclick="ajouterAuPanierDepuisId(${Number(produit.id)})"
                ${stock <= 0 ? "disabled" : ""}
              >
                ${
                  stock <= 0
                    ? "Rupture"
                    : "Ajouter"
                }
              </button>

              <button
                class="btn-secondary"
                onclick="ouvrirDetailProduit(${Number(produit.id)})"
              >
                Voir
              </button>

            </div>

          </div>

        </article>

      `;

    }).join("");
  }


  function ajouterAuPanierDepuisId(id){

    const produit = produits.find(
      p => Number(p.id) === Number(id)
    );

    if(!produit){
      alert("Produit introuvable.");
      return;
    }

    ajouterAuPanier(produit);
  }


  /* =========================================================
     DETAIL PRODUIT
  ========================================================= */

  function ouvrirDetailProduit(id){

    const produit = produits.find(
      p => Number(p.id) === Number(id)
    );

    if(!produit){
      return;
    }

    const prix = getPrixProduit(produit);

    const contenu =
      document.getElementById(
        "productDetailContent"
      );

    document.getElementById("detailName").textContent =
      produit.name || "Produit";

    contenu.innerHTML = `

      <img
        class="product-detail-image"
        src="${echapperAttribut(imageProduit(produit))}"
        alt="${echapperAttribut(produit.name || "Produit")}"
        onerror="this.src='https://via.placeholder.com/600x600?text=YAYOUNABYSAC'"
      >

      <div class="product-category">
        ${echapperHTML(getCategorieProduit(produit))}
      </div>

      <div class="product-detail-price">
        ${formaterPrix(prix)}
      </div>

      <div class="product-detail-description">
        ${echapperHTML(
          produit.description || ""
        )}
      </div>

      <button
        class="btn-primary"
        onclick="ajouterAuPanierDepuisId(${Number(produit.id)}); fermerModal('productModal');"
      >
        🛒 Ajouter au panier
      </button>
    `;

    ouvrirModal("productModal");
  }


  /* =========================================================
     PANIER AFFICHAGE
  ========================================================= */

  function ouvrirPanier(){

    afficherPanier();

    ouvrirModal("cartModal");
  }


  function afficherPanier(){

    const zone =
      document.getElementById("cartContent");

    if(!panier.length){

      zone.innerHTML = `

        <div class="empty-products">

          <p style="margin-bottom:18px;">
            Votre panier est vide.
          </p>

          <button
            class="btn-primary"
            onclick="fermerModal('cartModal')"
          >
            Continuer mes achats
          </button>

        </div>

      `;

      return;
    }

    const total =
      calculerTotalPanier();

    zone.innerHTML = `

      <div>

        ${panier.map(article => {

          const prix =
            convertirPrix(article.price);

          const quantite =
            convertirNombre(article.quantity);

          return `

            <div class="cart-item">

              <img
                class="cart-item-image"
                src="${echapperAttribut(article.image_url || "")}"
                alt="${echapperAttribut(article.name || "Produit")}"
                onerror="this.src='https://via.placeholder.com/200x200?text=Sac'"
              >

              <div class="cart-item-info">

                <div class="cart-item-name">
                  ${echapperHTML(article.name || "Produit")}
                </div>

                <div class="cart-item-price">
                  ${formaterPrix(prix)}
                </div>

                <div class="quantity-controls">

                  <button
                    class="quantity-btn"
                    onclick="modifierQuantite(${Number(article.id)},-1)"
                  >
                    −
                  </button>

                  <strong>
                    ${quantite}
                  </strong>

                  <button
                    class="quantity-btn"
                    onclick="modifierQuantite(${Number(article.id)},1)"
                  >
                    +
                  </button>

                  <button
                    class="delete-btn"
                    onclick="supprimerDuPanier(${Number(article.id)})"
                  >
                    Supprimer
                  </button>

                </div>

              </div>

            </div>

          `;

        }).join("")}

        <div class="cart-total">
          <span>Total</span>
          <span>${formaterPrix(total)}</span>
        </div>

        <div class="cart-actions">

          <button
            class="btn-secondary"
            onclick="fermerModal('cartModal')"
          >
            Continuer mes achats
          </button>

          <button
            class="btn-primary"
            onclick="ouvrirCommande()"
          >
            Passer à la commande
          </button>

        </div>

      </div>

    `;
  }


  /* =========================================================
     CHECKOUT
  ========================================================= */

  function ouvrirCommande(){

    if(!panier.length){

      alert("Votre panier est vide.");

      return;
    }

    const total =
      calculerTotalPanier();

    if(total <= 0){

      alert(
        "Le total du panier est invalide. Vérifiez le prix du produit."
      );

      return;
    }

    afficherResumeCommande();

    fermerModal("cartModal");

    document.getElementById(
      "checkoutNotice"
    ).className = "notice";

    ouvrirModal("checkoutModal");
  }


  function afficherResumeCommande(){

    const zone =
      document.getElementById(
        "checkoutSummary"
      );

    if(!zone){
      return;
    }

    const total =
      calculerTotalPanier();

    zone.innerHTML = `

      <strong>Votre commande</strong>

      ${panier.map(article => {

        const prix =
          convertirPrix(article.price);

        const quantite =
          convertirNombre(article.quantity);

        return `

          <div class="checkout-summary-item">

            <span>
              ${echapperHTML(article.name || "Produit")}
              × ${quantite}
            </span>

            <span>
              ${formaterPrix(prix * quantite)}
            </span>

          </div>

        `;

      }).join("")}

      <div class="checkout-summary-total">
        <span>Total</span>
        <span>${formaterPrix(total)}</span>
      </div>

    `;
  }


  /* =========================================================
     ENVOI DE LA COMMANDE
  ========================================================= */

  document
    .getElementById("checkoutForm")
    .addEventListener(
      "submit",
      envoyerCommande
    );


  async function envoyerCommande(event){

    event.preventDefault();

    if(!panier.length){

      afficherErreurCommande(
        "Votre panier est vide."
      );

      return;
    }

    /*
      IMPORTANT :
      On recalcule le total ICI, juste avant
      l'enregistrement dans Supabase.
    */

    const total =
      calculerTotalPanier();

    if(total <= 0){

      afficherErreurCommande(
        "Le total de la commande est égal à 0 FCFA. Vérifiez le prix des produits."
      );

      return;
    }

    const nom =
      document
        .getElementById("customerName")
        .value
        .trim();

    const telephone =
      document
        .getElementById("customerPhone")
        .value
        .trim();

    const adresse =
      document
        .getElementById("customerAddress")
        .value
        .trim();

    const commentaire =
      document
        .getElementById("customerComment")
        .value
        .trim();


    if(!nom || !telephone || !adresse){

      afficherErreurCommande(
        "Veuillez remplir le nom, le téléphone et l'adresse."
      );

      return;
    }


    const bouton =
      document.getElementById(
        "submitOrderBtn"
      );

    bouton.disabled = true;

    bouton.textContent =
      "Enregistrement de la commande...";


    try{

      /*
        ======================================================
        ÉTAPE 1
        Création de la commande principale.

        p_total reçoit le total recalculé.
        ======================================================
      */

      const { data: orderData, error: orderError } =
        await supabaseClient.rpc(
          "create_order",
          {
            p_customer_name: nom,
            p_phone: telephone,
            p_address: adresse,
            p_total: Math.round(total),
            p_status: "Depuis whatsapp"
          }
        );


      if(orderError){

        console.error(
          "Erreur create_order :",
          orderError
        );

        throw new Error(
          "Impossible d'enregistrer la commande : " +
          orderError.message
        );
      }


      /*
        ======================================================
        RÉCUPÉRATION DE L'ID DE COMMANDE

        Selon le retour Supabase, la valeur peut être
        directement un nombre ou être contenue dans un
        tableau.
        ======================================================
      */

      let orderId = null;


      if(Array.isArray(orderData)){

        if(orderData.length > 0){

          const premier =
            orderData[0];

          if(
            premier &&
            typeof premier === "object"
          ){

            orderId =
              premier.id ??
              premier.order_id ??
              premier.create_order;

          }else{

            orderId = premier;
          }
        }

      }else{

        orderId = orderData;
      }


      orderId = Number(orderId);


      if(!orderId || !Number.isFinite(orderId)){

        console.error(
          "Retour create_order :",
          orderData
        );

        throw new Error(
          "La commande a été créée mais son identifiant n'a pas pu être récupéré."
        );
      }


      /*
        ======================================================
        ÉTAPE 2
        Création des produits de la commande.

        On utilise la fonction add_order_item déjà mise
        en place pour éviter le problème RLS rencontré
        précédemment sur Orders_items.
        ======================================================
      */

      for(const article of panier){

        const productId =
          Number(article.id);

        const quantity =
          Math.max(
            1,
            Number(article.quantity)
          );

        const price =
          Math.round(
            convertirPrix(article.price)
          );


        if(
          !productId ||
          !Number.isFinite(productId)
        ){

          throw new Error(
            "Un produit de la commande possède un identifiant invalide."
          );
        }


        if(price <= 0){

          throw new Error(
            "Le prix du produit " +
            (article.name || "") +
            " est invalide."
          );
        }


        const {
          data: itemData,
          error: itemError
        } =
          await supabaseClient.rpc(
            "add_order_item",
            {
              p_order_id: orderId,
              p_product_id: productId,
              p_quantity: quantity,
              p_price: price
            }
          );


        if(itemError){

          console.error(
            "Erreur add_order_item :",
            itemError
          );

          throw new Error(
            "Impossible d'enregistrer le produit " +
            (article.name || "") +
            " dans la commande : " +
            itemError.message
          );
        }

      }


      /*
        ======================================================
        ÉTAPE 3
        Préparation du message WhatsApp.
        ======================================================
      */

      let message =
        "👜 *YAYOUNABYSAC — NOUVELLE COMMANDE*%0A%0A";

      message +=
        "*Commande :* #" +
        orderId +
        "%0A";

      message +=
        "*Client :* " +
        encodeURIComponent(nom) +
        "%0A";

      message +=
        "*Téléphone :* " +
        encodeURIComponent(telephone) +
        "%0A";

      message +=
        "*Adresse :* " +
        encodeURIComponent(adresse) +
        "%0A%0A";


      message +=
        "*Produits commandés :*%0A";


      panier.forEach(article => {

        const prix =
          convertirPrix(article.price);

        const quantite =
          convertirNombre(article.quantity);

        const sousTotal =
          prix * quantite;

        message +=
          "• " +
          encodeURIComponent(
            article.name || "Produit"
          ) +
          " × " +
          quantite +
          " — " +
          encodeURIComponent(
            formaterPrix(sousTotal)
          ) +
          "%0A";
      });


      message +=
        "%0A*TOTAL : " +
        encodeURIComponent(
          formaterPrix(total)
        ) +
        "*%0A";


      if(commentaire){

        message +=
          "%0A*Commentaire :* " +
          encodeURIComponent(
            commentaire
          );
      }


      /*
        ======================================================
        ÉTAPE 4
        Nettoyage du panier.
        ======================================================
      */

      panier = [];

      sauvegarderPanier();


      /*
        Réinitialisation du formulaire.
      */

      document
        .getElementById("checkoutForm")
        .reset();


      /*
        ======================================================
        ÉTAPE 5
        Ouverture de WhatsApp.
        ======================================================
      */

      const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        message;


      window.location.href =
        whatsappURL;


    }catch(erreur){

      console.error(
        "Erreur commande :",
        erreur
      );

      afficherErreurCommande(
        erreur.message ||
        "Une erreur est survenue pendant la commande."
      );

      bouton.disabled = false;

      bouton.textContent =
        "📱 Commander sur WhatsApp";
    }
  }


  function afficherErreurCommande(message){

    const zone =
      document.getElementById(
        "checkoutNotice"
      );

    zone.className =
      "notice error show";

    zone.textContent =
      message;
  }


  /* =========================================================
     MODALES
  ========================================================= */

  function ouvrirModal(id){

    const modal =
      document.getElementById(id);

    if(modal){
      modal.classList.add("show");
    }
  }


  function fermerModal(id){

    const modal =
      document.getElementById(id);

    if(modal){
      modal.classList.remove("show");
    }
  }


  document
    .querySelectorAll(".modal-overlay")
    .forEach(modal => {

      modal.addEventListener(
        "click",
        function(event){

          if(event.target === modal){

            modal.classList.remove(
              "show"
            );
          }
        }
      );

    });


  /* =========================================================
     PROTECTION AFFICHAGE HTML
  ========================================================= */

  function echapperHTML(valeur){

    return String(valeur ?? "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  function echapperAttribut(valeur){

    return echapperHTML(valeur);
  }


  /* =========================================================
     INITIALISATION
  ========================================================= */

  document.addEventListener(
    "DOMContentLoaded",
    async function(){

      mettreAJourCompteurPanier();

      await chargerProduits();

      mettreAJourCompteurPanier();

    }
  );

</script>

</body>
</html>
