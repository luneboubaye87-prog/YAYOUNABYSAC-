<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YAYOUNABYSAC - Boutique</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 25px;
    }

    #search {
      width: 100%;
      max-width: 500px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px;
      background: white;
    }

    .categories button {
      white-space: nowrap;
      padding: 9px 14px;
      border: 1px solid #ddd;
      border-radius: 20px;
      background: white;
      cursor: pointer;
    }

    .categories button:hover {
      background: #111;
      color: white;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }

    .product h3 {
      margin: 10px 0 5px;
    }

    .description {
      font-size: 14px;
      color: #666;
      min-height: 38px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
      margin: 8px 0;
    }

    .stock {
      font-size: 13px;
      color: #555;
    }

    .product button {
      width: 100%;
      padding: 11px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .product button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #cart {
      background: white;
      max-width: 700px;
      margin: 20px auto;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
    }

    .cart-controls {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cart-controls button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 6px;
      background: #111;
      color: white;
      cursor: pointer;
    }

    .remove {
      background: #c62828 !important;
    }

    #total {
      font-size: 21px;
      font-weight: bold;
      text-align: right;
      margin-top: 15px;
    }

    .checkout {
      background: white;
      max-width: 700px;
      margin: 20px auto 40px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .checkout input,
    .checkout textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .checkout textarea {
      min-height: 90px;
      resize: vertical;
    }

    #orderButton {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #orderButton:disabled {
      background: #999;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>YAYOUNABYSAC</h1>
  <input
    type="text"
    id="search"
    placeholder="Rechercher un sac..."
  >
</header>

<div class="categories" id="categories"></div>

<section id="products">
  <p class="empty">Chargement des produits...</p>
</section>

<section id="cart">
  <h2>🛒 Mon panier</h2>

  <div id="cartItems">
    <p class="empty">Votre panier est vide.</p>
  </div>

  <div id="total">
    Total : 0 FCFA
  </div>
</section>

<section class="checkout">
  <h2>📦 Commander</h2>

  <input
    type="text"
    id="customerName"
    placeholder="Nom et prénom"
  >

  <input
    type="tel"
    id="customerPhone"
    placeholder="Numéro de téléphone"
  >

  <input
    type="text"
    id="customerAddress"
    placeholder="Adresse / Quartier"
  >

  <textarea
    id="customerComment"
    placeholder="Commentaire (facultatif)"
  ></textarea>

  <button id="orderButton">
    Commander sur WhatsApp
  </button>
</section>

<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://ajprnhqphbtgfztspuio.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Qxr7ftKtVgB3y3lmx1agWg_UQxqrviy";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /* ==============================
     VARIABLES
  ============================== */

  let products = [];
  let cart = JSON.parse(
    localStorage.getItem("yayounabysac_panier") || "[]"
  );

  let selectedCategory = "Tous";


  /* ==============================
     CHARGER LES PRODUITS
  ============================== */

  async function loadProducts() {

    const productsContainer =
      document.getElementById("products");

    productsContainer.innerHTML =
      '<p class="empty">Chargement des produits...</p>';

    const { data, error } = await supabaseClient
      .from("Products")
      .select("*")
      .order("id", { ascending: true });

    if (error) {

      console.error("Erreur produits :", error);

      productsContainer.innerHTML =
        "<p class='empty'>Erreur lors du chargement des produits.</p>";

      return;
    }

    products = data || [];

    displayCategories();
    displayProducts();
    displayCart();
  }


  /* ==============================
     CATEGORIES
  ============================== */

  function displayCategories() {

    const container =
      document.getElementById("categories");

    const categories = [
      "Tous",
      ...new Set(
        products
          .map(product => product.Category)
          .filter(category => category)
      )
    ];

    container.innerHTML = "";

    categories.forEach(category => {

      const button =
        document.createElement("button");

      button.textContent = category;

      button.onclick = function() {

        selectedCategory = category;

        displayProducts();
      };

      container.appendChild(button);
    });
  }


  /* ==============================
     AFFICHER PRODUITS
  ============================== */

  function displayProducts() {

    const container =
      document.getElementById("products");

    const search =
      document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const filteredProducts =
      products.filter(product => {

        const matchCategory =
          selectedCategory === "Tous" ||
          product.Category === selectedCategory;

        const matchSearch =
          !search ||
          String(product.name || "")
            .toLowerCase()
            .includes(search);

        return matchCategory && matchSearch;
      });

    if (filteredProducts.length === 0) {

      container.innerHTML =
        '<p class="empty">Aucun produit trouvé.</p>';

      return;
    }

    container.innerHTML = "";

    filteredProducts.forEach(product => {

      const card =
        document.createElement("div");

      card.className = "product";

      const image =
        product.Image_url ||
        "https://via.placeholder.com/500x500?text=YAYOUNABYSAC";

      const price =
        Number(product.Price || 0);

      const stock =
        Number(product.Stock || 0);

      card.innerHTML = `
        <img
          src="${image}"
          alt="${product.name || "Sac"}"
        >

        <h3>${product.name || "Produit"}</h3>

        <div class="description">
          ${product.description || ""}
        </div>

        <div class="price">
          ${price.toLocaleString("fr-FR")} FCFA
        </div>

        <div class="stock">
          Stock : ${stock}
        </div>

        <button
          ${stock <= 0 ? "disabled" : ""}
          onclick="addToCart(${product.id})"
        >
          ${stock <= 0 ? "Rupture de stock" : "Ajouter au panier"}
        </button>
      `;

      container.appendChild(card);
    });
  }


  /* ==============================
     RECHERCHE
  ============================== */

  document
    .getElementById("search")
    .addEventListener("input", displayProducts);


  /* ==============================
     AJOUT PANIER
  ============================== */

  function addToCart(productId) {

    const product =
      products.find(p => p.id === productId);

    if (!product) return;

    const existing =
      cart.find(item => item.id === productId);

    if (existing) {

      if (existing.quantity < Number(product.Stock || 0)) {
        existing.quantity++;
      }

    } else {

      cart.push({
        id: product.id,
        name: product.name,
        price: Number(product.Price || 0),
        quantity: 1,
        stock: Number(product.Stock || 0)
      });
    }

    saveCart();
    displayCart();
  }


  /* ==============================
     PANIER
  ============================== */

  function saveCart() {

    localStorage.setItem(
      "yayounabysac_panier",
      JSON.stringify(cart)
    );
  }


  function displayCart() {

    const container =
      document.getElementById("cartItems");

    const totalElement =
      document.getElementById("total");

    if (cart.length === 0) {

      container.innerHTML =
        '<p class="empty">Votre panier est vide.</p>';

      totalElement.textContent =
        "Total : 0 FCFA";

      return;
    }

    container.innerHTML = "";

    let total = 0;

    cart.forEach(item => {

      const itemTotal =
        item.price * item.quantity;

      total += itemTotal;

      const div =
        document.createElement("div");

      div.className = "cart-item";

      div.innerHTML = `
        <div>
          <strong>${item.name}</strong><br>
          ${item.price.toLocaleString("fr-FR")} FCFA
        </div>

        <div class="cart-controls">

          <button
            onclick="changeQuantity(${item.id}, -1)"
          >
            −
          </button>

          <span>${item.quantity}</span>

          <button
            onclick="changeQuantity(${item.id}, 1)"
          >
            +
          </button>

          <button
            class="remove"
            onclick="removeFromCart(${item.id})"
          >
            ✕
          </button>

        </div>
      `;

      container.appendChild(div);
    });

    totalElement.textContent =
      "Total : " +
      total.toLocaleString("fr-FR") +
      " FCFA";
  }


  /* ==============================
     QUANTITE
  ============================== */

  function changeQuantity(productId, change) {

    const item =
      cart.find(item => item.id === productId);

    if (!item) return;

    const product =
      products.find(p => p.id === productId);

    if (!product) return;

    const newQuantity =
      item.quantity + change;

    if (newQuantity <= 0) {

      removeFromCart(productId);

      return;
    }

    if (newQuantity > Number(product.Stock || 0)) {

      alert("Stock disponible : " + product.Stock);

      return;
    }

    item.quantity = newQuantity;

    saveCart();
    displayCart();
  }


  /* ==============================
     SUPPRIMER
  ============================== */

  function removeFromCart(productId) {

    cart =
      cart.filter(item => item.id !== productId);

    saveCart();
    displayCart();
  }


  /* ==============================
     CALCUL TOTAL
  ============================== */

  function calculateTotal() {

    return cart.reduce(
      (total, item) =>
        total + item.price * item.quantity,
      0
    );
  }


  /* ==============================
     COMMANDER
  ============================== */

  document
    .getElementById("orderButton")
    .addEventListener("click", async function() {

      if (cart.length === 0) {

        alert("Votre panier est vide.");

        return;
      }

      const nom =
        document
          .getElementById("customerName")
          .value
          .trim();

      const telephone =
        document
          .getElementById("customerPhone")
          .value
          .trim();

      const adresse =
        document
          .getElementById("customerAddress")
          .value
          .trim();

      const commentaire =
        document
          .getElementById("customerComment")
          .value
          .trim();

      if (!nom || !telephone || !adresse) {

        alert(
          "Veuillez remplir le nom, le téléphone et l'adresse."
        );

        return;
      }

      const total =
        calculateTotal();

      const adresseComplete =
        adresse +
        (
          commentaire
            ? " | Commentaire : " + commentaire
            : ""
        );


      const orderButton =
        document.getElementById("orderButton");

      orderButton.disabled = true;
      orderButton.textContent =
        "Enregistrement de la commande...";


      /* ==============================
         ENREGISTRER DANS SUPABASE
      ============================== */

      const { data, error } =
        await supabaseClient
          .from("Orders")
          .insert([
            {
              Customer_name: nom,
              Phone: telephone,
              Address: adresseComplete,
              Total: total,
              Status: "Nouvelle"
            }
          ])
          .select()
          .single();


      /* ==============================
         AFFICHER LA VRAIE ERREUR
      ============================== */

      if (error) {

        console.error(
          "ERREUR SUPABASE :",
          error
        );

        alert(
          "ERREUR SUPABASE :\n\n" +
          (error.message || "Erreur inconnue") +
          "\n\nCode : " +
          (error.code || "inconnu")
        );

        orderButton.disabled = false;
        orderButton.textContent =
          "Commander sur WhatsApp";

        return;
      }


      /* ==============================
         COMMANDE ENREGISTREE
      ============================== */

      console.log(
        "Commande enregistrée :",
        data
      );


      /* ==============================
         MESSAGE WHATSAPP
      ============================== */

      let message =
        "Bonjour YAYOUNABYSAC,%0A%0A" +
        "Je souhaite passer une commande.%0A%0A" +
        "Nom : " + encodeURIComponent(nom) + "%0A" +
        "Téléphone : " + encodeURIComponent(telephone) + "%0A" +
        "Adresse : " + encodeURIComponent(adresse) + "%0A";

      if (commentaire) {

        message +=
          "Commentaire : " +
          encodeURIComponent(commentaire) +
          "%0A";
      }

      message += "%0AProduits :%0A";

      cart.forEach(item => {

        message +=
          "- " +
          encodeURIComponent(item.name) +
          " x" +
          item.quantity +
          " = " +
          encodeURIComponent(
            (item.price * item.quantity)
              .toLocaleString("fr-FR")
          ) +
          " FCFA%0A";
      });

      message +=
        "%0ATotal : " +
        encodeURIComponent(
          total.toLocaleString("fr-FR")
        ) +
        " FCFA";


      const whatsappUrl =
        "https://wa.me/221775124928?text=" +
        message;


      /* ==============================
         VIDER LE PANIER
      ============================== */

      cart = [];

      saveCart();
      displayCart();


      alert(
        "Commande enregistrée avec succès !"
      );


      orderButton.disabled = false;
      orderButton.textContent =
        "Commander sur WhatsApp";


      window.location.href =
        whatsappUrl;

    });


  /* ==============================
     DEMARRAGE
  ============================== */

  loadProducts();

</script>

</body>
</html>
